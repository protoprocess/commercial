<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proto Process / Fiche de vie</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root{
  --bg:#0a0c12; --surface:#1a2030; --surface2:#161b27; --border:#262e42; --border2:#333d55;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  --accent:#F07B1F; --accent-bg:#2a1f10; --pp-blue:#5BC4D8;
  --green:#86c564; --green-bg:#EAF3DE; --green-badge:#3B6D11;
  --amber:#eab676; --amber-bg:#FAEEDA; --amber-badge:#854F0B;
  --red:#f09595;   --red-bg:#FCEBEB;   --red-badge:#A32D2D;
  --pink:#ED93B1;  --pink-bg:#FBEAF0;  --pink-badge:#993556;
  --radius:6px; --radius-lg:10px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.55}

header{background:#0f1117;min-height:52px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:9px}
.logo-text{display:flex;align-items:center;font-size:13px;font-weight:500}
.logo-text .lt{color:#fff}.logo-text .ls{color:#444;margin:0 3px}.logo-text .lo{color:var(--accent)}
.spacer{flex:1}
.hdr-note{font-size:11px;color:var(--text3);font-family:var(--mono)}

.wrap{max-width:min(96vw,1100px);margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px;margin-bottom:13px}
.card h2{font-size:13px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.card h2 i{color:var(--accent);font-size:15px}
.card.warn{border-left:3px solid var(--amber-badge)}
.card.ok{border-left:3px solid var(--green-badge)}

.btn-p{padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-s{padding:7px 13px;background:transparent;color:var(--text2);border:.5px solid var(--border);
  border-radius:var(--radius);font-size:12.5px;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px}
.btn-s:hover{border-color:var(--border2);color:var(--text)}

input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--border2)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label.f{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:12px;color:var(--text3)}
.rangee{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.rangee>div{flex:1;min-width:150px}

.pastille{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11px;font-weight:500}
.met{margin-bottom:14px}
.met-t{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;
  margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ent{padding:9px 0;border-bottom:1px solid var(--border)}
.ent:last-child{border-bottom:none}
.ent-h{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:3px;font-size:11.5px;color:var(--text3)}
.ent-txt{font-size:13.5px;color:var(--text);line-height:1.5}
.ent-rep{margin:6px 0 0 14px;padding-left:11px;border-left:2px solid var(--border2)}
.qz{background:var(--surface2);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tag{padding:6px 11px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.tag:hover{border-color:var(--accent);color:var(--text)}
/* Formulaire de creation d une carte. Classes prefixees cr-, aucune empruntee. */
.cr-lab{display:block;font-size:11px;color:var(--text3);margin:12px 0 4px}
.cr-l{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}
#res select,#res input{background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:var(--radius);padding:8px 10px;font-size:13px;font-family:inherit}
.tag.on{border-color:var(--accent);color:var(--text);background:var(--accent-bg)}
@media(max-width:620px){
  .wrap{padding:11px;max-width:100vw}
  .rangee>div{min-width:100%}
}
</style>
</head>
<body>
<!-- ===== ACCES PROTO PROCESS ===== -->
<script>
(function(){
  var KEY='pp_access_code', HDR='X-PP-Auth', HOST='protoprocess.app.n8n.cloud';
  function get(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function del(){try{localStorage.removeItem(KEY)}catch(e){}}

  /* 1) Interception installee EN PREMIER : ne depend d'aucun element HTML */
  var _f = window.fetch;
  window.fetch = function(input, init){
    var url = '';
    try { url = (typeof input === 'string') ? input : ((input && input.url) || ''); } catch(e){}
    if (url.indexOf(HOST) === -1) { return _f.apply(this, arguments); }
    init = init || {};
    try { var h = new Headers(init.headers || {}); h.set(HDR, get()); init.headers = h; } catch(e){}
    return _f.call(this, input, init).then(function(r){
      if (r && (r.status === 401 || r.status === 403)) { del(); demander("Code d'acces refuse. Ressaisissez-le."); }
      return r;
    });
  };

  /* 2) Ecran construit en JS : aucune dependance au HTML de l'appli */
  var box = null;
  function construire(){
    if (box) return box;
    box = document.createElement('div');
    box.id = 'pp-gate';
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#0a0c12;display:none;'
      + 'align-items:center;justify-content:center;padding:20px;'
      + 'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif';
    box.innerHTML =
      '<div style="background:#1a2030;border:1px solid #262e42;border-radius:10px;padding:26px;max-width:380px;width:100%">'
      + '<div style="font-size:13px;font-weight:500;margin-bottom:14px">'
      +   '<span style="color:#fff">PROTO PROCESS</span><span style="color:#444;margin:0 3px">/</span>'
      +   '<span style="color:#F07B1F">Acces</span></div>'
      + '<div style="font-size:12.5px;color:#94a3b8;line-height:1.55;margin-bottom:16px">'
      +   "Saisissez le code d'acces interne. Il ne vous sera demande qu'une fois sur cet appareil.</div>"
      + '<input id="pp-in" type="password" placeholder="Code d acces" autocomplete="off" '
      +   'style="width:100%;background:#161b27;border:1px solid #262e42;border-radius:6px;color:#e2e8f0;'
      +   'padding:9px 11px;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box">'
      + '<div id="pp-err" style="font-size:12px;color:#f09595;margin-top:9px;min-height:16px"></div>'
      + '<button id="pp-btn" style="width:100%;margin-top:12px;padding:9px;background:#F07B1F;color:#fff;'
      +   'border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">Valider</button>'
      + '</div>';
    document.body.appendChild(box);
    var inp = box.querySelector('#pp-in'), btn = box.querySelector('#pp-btn');
    btn.addEventListener('click', function(){
      var v = (inp.value || '').trim();
      if (!v) { box.querySelector('#pp-err').textContent = 'Code requis.'; return; }
      set(v); inp.value = ''; box.style.display = 'none'; location.reload();
    });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { btn.click(); } });
    return box;
  }

  function demander(msg){
    if (!document.body) { document.addEventListener('DOMContentLoaded', function(){ demander(msg); }); return; }
    var b = construire();
    b.querySelector('#pp-err').textContent = msg || '';
    b.style.display = 'flex';
    setTimeout(function(){ try { b.querySelector('#pp-in').focus(); } catch(e){} }, 50);
  }

  window.ppChangerCode = function(){ del(); demander(''); };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ if (!get()) demander(''); });
  } else if (!get()) { demander(''); }
})();
</script>

  <div class="logo">

<div class="wrap">

<!-- Module commun de la fiche de vie, partage avec devis-client. Le ?v= est la
     parade au cache : sans lui une correction resterait invisible et on
     conclurait a tort qu elle n a pas ete faite. La version reelle est
     affichee en pied de fiche. -->
<script src="../shared/fiche-de-vie.js?v=1.7"></script>
<!-- Mode operatoire. Gabarit commun a toutes les applis ; le contenu est
     ecrit dans ce fichier, pres du code qu il decrit. -->
<script src="../shared/aide.js?v=1.1"></script>
<script>
const APP_VERSION = "3.4";
const APP_DATE = "02/08/2026";
document.title = `Proto Process / Fiche de vie \u2014 v${APP_VERSION} \u2014 ${APP_DATE}`;
document.getElementById('hdr-version').textContent = `v${APP_VERSION} \u2014 ${APP_DATE}`;

const BASE = 'https://protoprocess.app.n8n.cloud/webhook';
const QUI = 'pp_fdv_initiales';
const EQUIPE = ['OC','AC','MM','DG','SG','FR','JM','BL','MD','SS','VF','AP'];

// Les amorces de saisie viennent de la base (table ref_propositions) et sont
// rendues par le module commun : elles repondent au vrai obstacle releve par
// Olivier — les operateurs ne savent pas QUOI noter. Un champ vide ne produit
// rien ; une proposition qu'on clique produit une premiere phrase a completer.

let PRODUITS = [], FICHE_ID = null;

/* ---------- MODE OPERATOIRE ----------
   Le bouton vit dans le bandeau : une notice rangee ailleurs n est pas lue.
   Gabarit commun a toutes les applis (shared/aide.js), contenu propre ici. */
/* Contenu du mode operatoire de l appli fiche de vie. Ecrit ici, pres du code
   qu il decrit : une notice rangee ailleurs cesse d etre mise a jour. */
PPAide.poser({
  titre: 'Fiche de vie — mode opératoire',
  version: APP_VERSION,
  // Version pour laquelle CE TEXTE a ete relu. A remonter des qu une nouvelle
  // version change le PARCOURS et non seulement l apparence : sinon la notice
  // affichera d elle-meme qu elle est peut-etre depassee.
  verifiee: '3.4',
  sections: [
    { type:'etapes', titre:'Le parcours, dans l\u2019ordre',
      intro:'La fiche de vie garde la mémoire d\u2019une carte : ce qu\u2019on a appris, ce qui reste à régler, ce qu\u2019on a demandé au client.',
      items:[
        { titre:'Choisir la carte',
          texte:'Tapez une référence, un libellé ou un nom de client. Une carte reste la même quelle que soit sa version : le SafetyB partage la fiche du SafetyA.' },
        { titre:'Donner vos initiales',
          texte:'Obligatoire, et choisies dans la liste. Les postes sont partagés à l\u2019atelier : un champ libre pré-rempli ferait signer par la personne précédente sans que personne s\u2019en aperçoive.' },
        { titre:'Lire ce qu\u2019on sait déjà',
          texte:'Les filtres du haut trient toute la fiche : ce qui reste à traiter chez nous, ce qui attend le client, ce qui est résolu, ce qui est visible du client. Les métiers se déplient d\u2019un clic.' },
        { titre:'Ajouter une note',
          texte:'Choisissez d\u2019abord <b>pour quel métier</b> — c\u2019est la question qui compte, elle décide qui verra l\u2019information. Les suggestions grises ne sont que des amorces de phrase, vous écrivez ce que vous voulez.' },
        { titre:'Préciser la destination',
          texte:'<b>Information</b> : un constat, rien à faire. <b>À traiter</b> : un point qui reste ouvert chez nous, il ressortira tant qu\u2019il n\u2019est pas réglé. <b>Question client</b> : elle part au client et attend sa réponse.' },
        { titre:'Joindre un fichier si besoin',
          texte:'Photo prise au téléphone, tableau du fabricant de circuit imprimé, PDF, document. Les photos sont réduites automatiquement avant l\u2019envoi ; les autres fichiers passent intacts.' },
        { titre:'Répondre à un point en suspens',
          texte:'Le bouton « Répondre » ouvre une zone sous la question. Répondre ferme le point : il passe en résolu et sort de la liste des choses à traiter.' },
        { titre:'Ranger l\u2019entrée au bon métier',
          texte:'Ce qui est saisi pendant le chiffrage arrive dans « Devis ». Le bouton « Ranger » permet de l\u2019adresser au bon métier et d\u2019ajouter ceux qui doivent aussi la voir. C\u2019est le geste à faire quand une commande arrive.' }
      ] },

    { type:'pieges', titre:'Ce qui coince habituellement',
      intro:'Situations rencontrées, et ce qu\u2019il faut faire.',
      items:[
        { quoi:'Le bouton « Enregistrer » reste gris',
          faire:'Vos initiales ne sont pas choisies. C\u2019est volontaire : une note non signée ne vaut rien, et sur un poste partagé elle serait attribuée à quelqu\u2019un d\u2019autre.' },
        { quoi:'Une note écrite au chiffrage reste dans « Devis »',
          faire:'C\u2019est normal : au chiffrage on ne cherche pas la petite bête, tout arrive dans Devis. Le tri se fait ensuite, avec le bouton « Ranger ». Sans ce geste, l\u2019information n\u2019atteindra jamais le métier concerné.' },
        { quoi:'Un fichier déposé n\u2019apparaît pas',
          faire:'Vérifiez que l\u2019envoi est terminé — la mention « déposé » s\u2019affiche sous la zone. Un fichier déposé puis abandonné en ouvrant une réponse ne part pas : les pièces en cours sont remises à zéro quand on ouvre une zone de réponse.' },
        { quoi:'On ne peut pas supprimer une pièce jointe',
          faire:'« Retirer » ne l\u2019enlève que de la note en cours d\u2019écriture. Une fois enregistrée, la pièce reste : rien n\u2019autorise la suppression dans le stockage, c\u2019est volontaire.' },
        { quoi:'Une correction ne se voit pas',
          faire:'C\u2019est le cache du navigateur. Rechargez en forçant (Ctrl+Maj+R, ou Cmd+Maj+R sur Mac) et vérifiez la mention « module v… » en bas de la fiche.' }
      ] },

    { type:'regles', titre:'Les règles, et pourquoi',
      intro:'Pour comprendre les choix de l\u2019outil.',
      items:[
        { titre:'Le métier, c\u2019est à qui c\u2019est destiné',
          texte:'Pas qui écrit. Une remarque trouvée au chiffrage mais qui concerne le câblage s\u2019adresse au CMS. Les « doit aussi être vu par » servent quand plusieurs métiers sont concernés.' },
        { titre:'L\u2019état découle du geste, jamais d\u2019un choix',
          texte:'Une question attend, une réponse résout, une note ferme. Personne ne décide de l\u2019état à la main : c\u2019est ce qui garantit qu\u2019un point ouvert ne disparaît pas par erreur.' },
        { titre:'La visibilité client découle du type',
          texte:'Une question au client lui est visible par construction, sinon elle ne pourrait pas lui parvenir. Un point interne ne sort jamais. Seule une information simple laisse le choix.' },
        { titre:'On n\u2019efface pas, on ajoute',
          texte:'Le texte, l\u2019auteur et la date d\u2019une entrée ne sont pas modifiables. Ranger une entrée change son métier, jamais ce qui a été dit ni quand.' },
        { titre:'Une carte, une fiche, tous les indices',
          texte:'Les versions successives partagent la même fiche : ce qu\u2019on a appris sur la V1 sert à la V2. Le journal cloisonne par indice à l\u2019affichage, mais rien ne se perd.' },
        { titre:'Pourquoi ça compte',
          texte:'Ce qui est écrit ici et marqué visible client part dans le rapport que le client reçoit. Celui qui a noté quelque chose voit sa remarque arriver chez le client — c\u2019est ce qui rend le client concret depuis l\u2019atelier.' }
      ] }
  ]
});
document.getElementById('hdr-aide').innerHTML = PPAide.bouton();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function qui(){ try{ return localStorage.getItem(QUI)||''; }catch(e){ return ''; } }
function setQui(v){ try{ localStorage.setItem(QUI, v); }catch(e){} majQui(); }
function majQui(){
  const el = document.getElementById('hdr-qui');
  el.innerHTML = qui()
    ? `<span style="cursor:pointer" onclick="demanderQui()" title="Changer d\'op\u00e9rateur">${esc(qui())}</span>`
    : '';
}

// Les initiales sont demandees UNE FOIS et memorisees sur l'appareil : sur un
// telephone perso, exiger un compte ou une installation tuerait l'usage.
function demanderQui(){
  const f = document.createElement('div');
  f.style.cssText = 'position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:flex;'
    + 'align-items:center;justify-content:center;padding:18px';
  f.innerHTML = `<div class="card" style="max-width:340px;width:100%;margin:0">
    <h2><i class="ti ti-user"></i> Qui \u00eates-vous&nbsp;?</h2>
    <p class="hint" style="margin-bottom:11px">Vos initiales, pour savoir \u00e0 qui demander des pr\u00e9cisions. Une seule fois sur cet appareil.</p>
    <div class="tags">${EQUIPE.map(i =>
      `<button class="tag" onclick="setQui('${i}');this.closest('div[style]').parentNode.remove();apresQui()">${i}</button>`
    ).join('')}</div></div>`;
  document.body.appendChild(f);
}

async function charger(){
  try{
    const r = await fetch(`${BASE}/produits`);
    const j = await r.json();
    PRODUITS = (j && j.produits) || [];
  }catch(e){ PRODUITS = []; }
  const p = new URLSearchParams(location.search).get('produit');
  if(p) ouvrir(parseInt(p,10)); else chercher('');
}

function chercher(q){
  const box = document.getElementById('res');
  const n = String(q||'').toLowerCase().trim();
  const l = (n.length < 1 ? PRODUITS : PRODUITS.filter(p =>
    [p.ref_carte, p.libelle_carte, p.nom_client, p.cle_produit]
      .some(v => String(v||'').toLowerCase().includes(n)))).slice(0, 30);
  if(!l.length){
    // Le bouton de creation n apparait QU ICI, apres une recherche infructueuse :
    // chercher d abord est la meilleure protection contre les cartes en double,
    // et une carte en double ce sont deux fiches de vie qui divergent.
    box.innerHTML = '<p class="hint" style="margin-bottom:11px">Aucune carte ne correspond. '
      + 'Une carte apparait ici une fois qu\'un dossier lui a ete rattache dans l\'analyse de devis '
      + '\u2014 ou si vous la creez directement.</p>'
      + '<button class="btn-p" onclick="ouvrirCreation()"><i class="ti ti-plus"></i> Créer une carte</button>';
    return;
  }
  box.innerHTML = l.map(p => `<div class="ent" style="cursor:pointer" onclick="ouvrir(${p.id})">
    <div class="ent-txt"><b>${esc(p.ref_carte)}</b>${p.libelle_carte ? ' \u2014 ' + esc(p.libelle_carte) : ''}</div>
    <div class="ent-h">${esc(p.nom_client||'')} <span style="color:var(--text3)">\u00b7 ${esc(p.cle_produit||'')}</span></div>
  </div>`).join('');
}

/* ---------- CREATION D UNE CARTE ----------
   Une carte peut naitre ici, sans passer par l analyse de devis : carte
   recurrente deja en production, retour client, affaire jamais analysee
   (demande d Olivier, 04/08). Le webhook de rattachement sait deja creer une
   carte sans analyse depuis la v1.1 du workflow Produits.
   Le pont vers Odoo est propose DANS LA FOULEE, au fil de l eau : aucun des 163
   articles existants ne porte de PP Produit ID, et une reprise en masse ne se
   ferait jamais alors que chaque carte creee en regle un. */
let CREA = { etape: 'ferme', societes: [], resultats: null, msg: null,
             client: null, ref: '', libelle: '', indice: '', article: null };

async function ouvrirCreation(){
  CREA = { etape: 'saisie', societes: CREA.societes, resultats: null, msg: null,
           client: null, ref: '', libelle: '', indice: '', article: null };
  rendreCreation();
  if(!CREA.societes.length){
    try{
      const r = await fetch(`${BASE}/po-societes`);
      const j = await r.json();
      // Le webhook rend TOUTES les societes, clients ET fournisseurs : on ne garde
      // que les clients, sans quoi on pourrait creer une carte au nom d un
      // fournisseur. Le code arrive sous la cle « code ».
      CREA.societes = ((j && j.societes) || [])
        .filter(x => String(x.prefixe || '').toUpperCase() === 'CLI' && x.code)
        .sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr'));
    }catch(e){ CREA.societes = []; }
    rendreCreation();
  }
}

function fermerCreation(){ CREA.etape = 'ferme'; chercher(document.getElementById('q').value || ''); }

function rendreCreation(){
  const box = document.getElementById('res');
  if(CREA.etape === 'ferme') return;

  if(CREA.etape === 'saisie'){
    const opts = CREA.societes.map(x =>
      `<option value="${x.id}" data-code="${esc(x.code||'')}"${CREA.client && Number(CREA.client.id)===Number(x.id)?' selected':''}>${esc(x.nom||'')} \u00b7 ${esc(x.code||'')}</option>`).join('');
    box.innerHTML = `<div class="card" style="border-left:3px solid var(--accent)">
      <p style="margin:0 0 4px;font-size:14px;font-weight:600;color:var(--accent)">Créer une carte</p>
      <p class="hint" style="margin:0 0 4px">On regarde d'abord si Odoo connaît déjà cette carte.</p>

      <label class="cr-lab">Client</label>
      ${CREA.societes.length
        ? `<select id="cr-cli" style="width:100%;max-width:420px">${opts}</select>`
        : `<p class="hint">Chargement des clients\u2026</p>`}

      <label class="cr-lab">Référence de la carte</label>
      <input id="cr-ref" value="${esc(CREA.ref)}" placeholder="10078-01-01-00" autocomplete="off" style="width:100%;max-width:320px">

      <div class="cr-l">
        <button class="btn-p" id="cr-ok" onclick="chercherDansOdoo()"><i class="ti ti-search"></i> Chercher dans Odoo</button>
        <button class="btn-s" onclick="fermerCreation()">Annuler</button>
        <span id="cr-msg" class="hint">${CREA.msg ? esc(CREA.msg) : ''}</span>
      </div></div>`;
    return;
  }

  if(CREA.etape === 'choix'){
    const r = CREA.resultats || {};
    const arts = r.articles || [];
    const libres = arts.filter(a => !a.deja_lie);
    box.innerHTML = `<div class="card" style="border-left:3px solid var(--accent)">
      <p style="margin:0 0 4px;font-size:14px;font-weight:600;color:var(--accent)">${esc(CREA.client.code)}-${esc(CREA.ref)}</p>
      <p class="hint" style="margin:0 0 14px">${esc(CREA.client.nom)}</p>

      ${arts.length
        ? `<p style="margin:0 0 4px;font-size:13px;font-weight:500">Odoo connaît ${arts.length === 1 ? 'cet article' : 'ces articles'}</p>
           <p class="hint" style="margin:0 0 11px">Choisissez celui qui correspond : son libellé remplira le champ ci-dessous et le lien sera posé à la création.</p>`
        : `<p style="margin:0 0 11px;padding:9px 11px;background:var(--amber-bg);color:var(--amber-badge);border-radius:6px;font-size:12.5px">
             Aucun article Odoo ne porte cette référence. Si cette carte a déjà été produite, vérifiez la référence avant de continuer — sinon c'est normal, le bouton de devis créera l'article le moment venu.</p>`}

      ${r.avertissement ? `<p style="margin:0 0 11px;padding:9px 11px;background:var(--amber-bg);color:var(--amber-badge);border-radius:6px;font-size:12.5px">${esc(r.avertissement)}</p>` : ''}

      ${arts.map(a => `<div class="ent" style="cursor:${a.deja_lie?'default':'pointer'};opacity:${a.deja_lie?'.55':'1'};${CREA.article && CREA.article.id===a.id?'border-color:var(--accent)':''}"
          ${a.deja_lie ? '' : `onclick="choisirArticle(${a.id})"`}>
        <div class="ent-txt"><b>${esc(a.nom)}</b>${a.conforme_convention ? '' : ' <span class="hint">hors convention</span>'}${CREA.article && CREA.article.id===a.id ? ' <span style="color:var(--accent)">\u2713 retenu</span>' : ''}</div>
        <div class="ent-h">${esc(a.categorie||'')}${a.reference_interne ? ' \u00b7 ' + esc(a.reference_interne) : ''}${a.deja_lie ? ` \u00b7 déjà relié à la carte n\u00b0 ${a.lie_a_carte}` : ''}${a.lien_orphelin ? ` \u00b7 <span style="color:var(--amber)">ancien lien vers une carte supprimée, sera repris</span>` : ''}</div>
      </div>`).join('')}

      <label class="cr-lab">Référence de la carte${CREA.article ? ' <span class="hint">— reprise de l\'article retenu</span>' : ''}</label>
      <input id="cr-ref2" value="${esc(CREA.ref)}" oninput="majCle()" autocomplete="off" style="width:100%;max-width:320px">
      <p class="hint" style="margin:5px 0 0">Clé de la carte : <span id="cr-cle" style="color:var(--text2)">${esc(CREA.client.code)}-${esc(CREA.ref)}</span></p>

      <label class="cr-lab">Libellé${CREA.article ? ' <span class="hint">— repris de l\'article retenu</span>' : ''}</label>
      <input id="cr-lib" value="${esc(CREA.libelle)}" placeholder="Carte_SBW_SafetyA" autocomplete="off" style="width:100%;max-width:420px">

      <label class="cr-lab">Indice <span class="hint">— facultatif, rangé comme alias</span></label>
      <input id="cr-ind" value="${esc(CREA.indice)}" placeholder="V1" autocomplete="off" style="width:100px">

      <div class="cr-l">
        <button class="btn-p" id="cr-ok" onclick="creerCarte()"><i class="ti ti-check"></i> Créer la carte${CREA.article ? ' et poser le lien' : ''}</button>
        <button class="btn-s" onclick="retourSaisie()">Corriger la référence</button>
        <button class="btn-s" onclick="fermerCreation()">Annuler</button>
        <span id="cr-msg" class="hint">${CREA.msg ? esc(CREA.msg) : ''}</span>
      </div>
      ${libres.length ? '' : '<p class="hint" style="margin-top:9px">Aucun article libre : la carte sera créée sans lien Odoo.</p>'}
      </div>`;
  }
}

function retourSaisie(){ CREA.etape = 'saisie'; CREA.msg = null; rendreCreation(); }

// La cle se recompose a chaque frappe : une faute dans la reference se voit
// AVANT la creation, pas apres. C est ce qui a produit CLI277-cli277 le 04/08.
function majCle(){
  memoriserSaisie();
  const el = document.getElementById('cr-cle');
  if(el) el.textContent = CREA.client.code + '-' + CREA.ref;
}

/* Un nom d article porte la REFERENCE et le LIBELLE. On les separe pour proposer
   les deux, au lieu de laisser dans le champ reference ce qui avait servi a
   CHERCHER — c est ainsi qu une carte a ete creee sous la cle CLI277-cli277.
   Trois formes rencontrees :
     CLI277 - 11300054875 AMP107   -> ref 11300054875, libelle AMP107
     1300077331 - CARTE MICRO-SD   -> ref 1300077331,  libelle CARTE MICRO-SD
     CLI526-10078-01-01-00         -> ref 10078-01-01-00, libelle dans la ref interne */
function decomposerArticle(a){
  const code = (CREA.client && CREA.client.code) || '';
  let nom = String(a.nom || '').trim();
  if(code){
    const re = new RegExp('^' + code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*-\\s*', 'i');
    nom = nom.replace(re, '').trim();
  }
  const i = nom.indexOf(' - ');
  if(i > 0) return { ref: nom.slice(0, i).trim(), lib: nom.slice(i + 3).trim() };
  const j = nom.indexOf(' ');
  if(j > 0) return { ref: nom.slice(0, j).trim(), lib: nom.slice(j + 1).trim() };
  return { ref: nom, lib: String(a.reference_interne || '').trim() };
}

/* La recherche Odoo vient AVANT la creation (ordre corrige le 04/08 sur remarque
   d Olivier). Trois raisons : une reference qui ne ramene rien est peut-etre
   fautive, et mieux vaut le voir AVANT d avoir cree la carte ; l article porte le
   libelle, qui peut donc etre repris au lieu d etre retape ; et on distingue tout
   de suite une carte recurrente deja connue d Odoo d une carte reellement neuve.
   Cette etape est en LECTURE SEULE : rien n est ecrit tant que l humain n a pas
   clique sur Creer. */
async function chercherDansOdoo(){
  const msg = document.getElementById('cr-msg');
  const btn = document.getElementById('cr-ok');
  const sel = document.getElementById('cr-cli');
  const ref = (document.getElementById('cr-ref').value || '').trim();

  if(!sel || !sel.value){ msg.textContent = 'Choisissez un client.'; return; }
  if(!ref){ msg.textContent = 'La référence est obligatoire : elle forme la clé de la carte.'; return; }

  const opt = sel.options[sel.selectedIndex];
  const code = opt.getAttribute('data-code') || '';
  if(!code){ msg.textContent = "Ce client n'a pas de code CLI dans Odoo : impossible de former la clé."; return; }

  CREA.client = { id: Number(sel.value), code: code, nom: opt.textContent.split(' \u00b7 ')[0] };
  CREA.ref = ref;

  btn.disabled = true; msg.textContent = 'Recherche dans Odoo\u2026';
  try{
    const q = `reference=${encodeURIComponent(ref)}&code=${encodeURIComponent(code)}`;
    const r = await fetch(`${BASE}/produit-odoo-chercher?${q}`);
    const j = await r.json().catch(()=>null);
    CREA.resultats = (j && j.ok) ? j : { articles: [] };
  }catch(e){
    // Odoo indisponible ne doit pas empecher de creer une carte : on le dit et
    // on continue, le lien pourra etre pose plus tard.
    CREA.resultats = { articles: [] };
    CREA.msg = "Odoo n'a pas répondu : vous pouvez créer la carte, le lien sera à poser plus tard.";
  }
  // Un seul article libre : on le retient d office et on reprend son libelle.
  // L humain le voit marque « retenu » et peut le deselectionner.
  const libres = (CREA.resultats.articles || []).filter(a => !a.deja_lie);
  if(libres.length === 1) choisirArticleInterne(libres[0]);
  CREA.etape = 'choix';
  rendreCreation();
}

function choisirArticleInterne(a){
  CREA.article = a;
  const d = decomposerArticle(a);
  // La reference de l article FAIT AUTORITE sur ce qui a servi a chercher : on
  // la reprend systematiquement, l humain pouvant la corriger ensuite.
  if(d.ref) CREA.ref = d.ref;
  if(d.lib && !CREA.libelle) CREA.libelle = d.lib;
}

function choisirArticle(id){
  const a = (CREA.resultats.articles || []).find(x => Number(x.id) === Number(id));
  if(!a) return;
  // Second clic sur le meme article : on le retire, pour pouvoir creer sans lien.
  if(CREA.article && CREA.article.id === a.id){ CREA.article = null; }
  else { choisirArticleInterne(a); }
  memoriserSaisie();
  rendreCreation();
}

function memoriserSaisie(){
  const ref = document.getElementById('cr-ref2');
  const lib = document.getElementById('cr-lib');
  const ind = document.getElementById('cr-ind');
  if(ref) CREA.ref = (ref.value || '').trim();
  if(lib) CREA.libelle = lib.value || '';
  if(ind) CREA.indice = ind.value || '';
}

async function creerCarte(){
  const msg = document.getElementById('cr-msg');
  const btn = document.getElementById('cr-ok');
  memoriserSaisie();

  if(!CREA.ref){ msg.textContent = 'La référence est obligatoire : elle forme la clé de la carte.'; return; }
  btn.disabled = true; msg.textContent = 'Création\u2026';
  try{
    const r = await fetch(`${BASE}/produit-rattacher`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        odoo_partner_id: CREA.client.id,
        code_client: CREA.client.code,
        nom_client: CREA.client.nom,
        ref_carte: CREA.ref,
        libelle_carte: CREA.libelle || null,
        alias: CREA.indice ? (CREA.ref + '_' + CREA.indice) : null,
        indice: CREA.indice || null
      })
    });
    const j = await r.json().catch(()=>null);
    if(!r.ok || !j || j.ok !== true) throw new Error((j && j.motif) || ('HTTP ' + r.status));

    // Le lien Odoo suit immediatement, s il a ete retenu. Un echec ici ne remet
    // pas la carte en cause : elle existe, on le dit et on ouvre quand meme.
    let alerte = null;
    if(CREA.article){
      try{
        const rl = await fetch(`${BASE}/produit-odoo-lier`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ produit_id: j.produit_id, article_id: CREA.article.id })
        });
        const jl = await rl.json().catch(()=>null);
        if(!jl || jl.ok !== true) alerte = (jl && jl.motif) || "Le lien Odoo n'a pas pu être posé.";
      }catch(e){ alerte = "Le lien Odoo n'a pas pu être posé : " + e.message; }
    }

    await charger();
    if(alerte) alert("La carte est créée.\n\n" + alerte);
    CREA.etape = 'ferme';
    ouvrir(j.produit_id);
  }catch(e){
    btn.disabled = false;
    msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
  }
}

/* ---------- CORRECTION D UNE CARTE ----------
   Une faute de frappe arrive, et jusqu au 04/08 il fallait passer par la base
   pour la reparer (demande d Olivier). Le client n est PAS modifiable : en
   changer changerait le code donc la cle entiere, ce ne serait plus une
   correction mais une autre carte.
   Les entrees de fiche de vie pointent vers l IDENTIFIANT de la carte, jamais
   vers sa cle : corriger une reference ne detache donc aucune entree. */
let EDIT = null;

function ouvrirEdition(id){
  const p = PRODUITS.find(x => Number(x.id) === Number(id));
  if(!p){ alert("Carte introuvable dans la liste locale."); return; }
  const al = (p.alias || []).filter(a => a && a.indice);
  EDIT = { id: Number(id), code: p.code_client || '', client: p.nom_client || '',
           ref: p.ref_carte || '', libelle: p.libelle_carte || '',
           indice: (al[0] && al[0].indice) || '', msg: null };
  rendreEdition();
}

function fermerEdition(){ EDIT = null; rendreEdition(); }

function rendreEdition(){
  const z = document.getElementById('zone-edition');
  if(!z) return;
  if(!EDIT){ z.innerHTML = ''; return; }
  z.innerHTML = `<div class="card" style="border-left:3px solid var(--accent);margin-bottom:10px">
    <p style="margin:0 0 4px;font-size:14px;font-weight:600;color:var(--accent)">Modifier la carte</p>
    <p class="hint" style="margin:0 0 4px">${esc(EDIT.client)} · le client ne se change pas : ce serait une autre carte.</p>

    <label class="cr-lab">Référence de la carte</label>
    <input id="ed-ref" value="${esc(EDIT.ref)}" oninput="majCleEdition()" autocomplete="off" style="width:100%;max-width:320px">
    <p class="hint" style="margin:5px 0 0">Clé de la carte : <span id="ed-cle" style="color:var(--text2)">${esc(EDIT.code)}-${esc(EDIT.ref)}</span></p>

    <label class="cr-lab">Libellé</label>
    <input id="ed-lib" value="${esc(EDIT.libelle)}" autocomplete="off" style="width:100%;max-width:420px">

    <label class="cr-lab">Indice</label>
    <input id="ed-ind" value="${esc(EDIT.indice)}" autocomplete="off" style="width:100px">

    <div class="cr-l">
      <button class="btn-p" id="ed-ok" onclick="enregistrerEdition()"><i class="ti ti-check"></i> Enregistrer</button>
      <button class="btn-s" onclick="fermerEdition()">Annuler</button>
      <button class="btn-s" style="margin-left:auto;color:var(--red)" onclick="supprimerCarte()">
        <i class="ti ti-trash"></i> Supprimer cette carte</button>
      <span id="ed-msg" class="hint">${EDIT.msg ? esc(EDIT.msg) : ''}</span>
    </div>
    <p class="hint" style="margin-top:9px">Un article Odoo déjà relié garde son nom : corrigez-le dans Odoo si besoin.</p>
    </div>`;
}

function majCleEdition(){
  const r = document.getElementById('ed-ref');
  if(r) EDIT.ref = (r.value || '').trim();
  const c = document.getElementById('ed-cle');
  if(c) c.textContent = EDIT.code + '-' + EDIT.ref;
}

async function enregistrerEdition(){
  const msg = document.getElementById('ed-msg');
  const btn = document.getElementById('ed-ok');
  majCleEdition();
  EDIT.libelle = (document.getElementById('ed-lib').value || '').trim();
  EDIT.indice  = (document.getElementById('ed-ind').value || '').trim();
  if(!EDIT.ref){ msg.textContent = 'La référence est obligatoire.'; return; }

  btn.disabled = true; msg.textContent = 'Enregistrement\u2026';
  try{
    const r = await fetch(`${BASE}/produit-modifier`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ produit_id: EDIT.id, ref_carte: EDIT.ref,
                             libelle_carte: EDIT.libelle || null, indice: EDIT.indice || null })
    });
    const j = await r.json().catch(()=>null);
    if(!r.ok || !j || j.ok !== true) throw new Error((j && j.motif) || ('HTTP ' + r.status));
    await charger();
    EDIT = null;
    monterFiche(j.produit_id);
  }catch(e){
    btn.disabled = false;
    msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
  }
}

/* La suppression est GARDEE cote serveur : refusee si le journal porte des
   entrees, ou si un article Odoo reference encore la carte. Ce second garde est
   la lecon du 04/08 — une suppression en base laissait un lien orphelin cote
   Odoo qui bloquait l article a jamais. */
/* Delier un article de sa carte. C est l inverse exact de la liaison, et le seul
   moyen de debloquer la suppression d une carte sans passer par Odoo. */
async function delierArticle(articleId){
  const msg = document.getElementById('ed-msg');
  if(msg) msg.textContent = 'Déliaison\u2026';
  try{
    const r = await fetch(`${BASE}/produit-odoo-delier`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ article_id: articleId })
    });
    const j = await r.json().catch(()=>null);
    if(!j || j.ok !== true) throw new Error((j && j.motif) || 'Déliaison refusée.');
    if(msg) msg.innerHTML = `<span style="color:var(--green)">${esc(j.article_nom)} délié. Vous pouvez relancer la suppression.</span>`;
  }catch(e){
    if(msg) msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
  }
}

async function supprimerCarte(){
  const msg = document.getElementById('ed-msg');
  if(!confirm('Supprimer définitivement la carte ' + EDIT.code + '-' + EDIT.ref + ' ?\n\n'
    + "La suppression sera refusée si la fiche de vie porte des entrées, ou si un article Odoo y est relié.")) return;
  msg.textContent = 'Suppression\u2026';
  try{
    const r = await fetch(`${BASE}/produit-supprimer`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ produit_id: EDIT.id })
    });
    const j = await r.json().catch(()=>null);
    if(!j) throw new Error('Réponse illisible.');
    if(j.ok !== true){
      // Un refus n est pas une erreur : il dit ce qui bloque, et l humain tranche.
      // Quand ce sont des articles Odoo, on propose de les delier SUR PLACE —
      // sinon la seule issue serait d aller vider le champ a la main dans Odoo.
      let sup = '';
      (j.articles || []).forEach(a => {
        sup += `<button class="btn-s" style="margin:7px 7px 0 0" onclick="delierArticle(${a.id})">` +
               `<i class="ti ti-unlink"></i> Délier ${esc(a.nom || ('article ' + a.id))}</button>`;
      });
      msg.innerHTML = `<span style="color:var(--amber-badge);display:block;margin-top:6px;padding:9px 11px;background:var(--amber-bg);border-radius:6px">${esc(j.motif)}</span>` + sup;
      return;
    }
    EDIT = null; FICHE_ID = null;
    await charger();
    retour();
  }catch(e){
    msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
  }
}

async function ouvrir(id){
  const f = document.getElementById('fiche');
  document.getElementById('choix').style.display = 'none';
  f.style.display = '';
  if(!window.PPFicheDeVie){
    f.innerHTML = '<div class="card"><p style="color:var(--amber)">Module fiche de vie non chargé.</p>' +
      '<button class="btn-s" style="margin-top:9px" onclick="retour()">Retour</button></div>';
    return;
  }
  FICHE_ID = id;
  if(!qui()) demanderQui();
  await monterFiche(id);
}

function retour(){
  FICHE_ID = null;
  if(window.PPFicheDeVie) PPFicheDeVie.invalider();
  document.getElementById('fiche').style.display = 'none';
  document.getElementById('choix').style.display = '';
  history.replaceState(null,'',location.pathname);
}

/* Le rendu de la fiche vit dans ../shared/fiche-de-vie.js, partage avec l onglet
   de devis-client. Il etait duplique : le 02/08, sur trois defauts constates en
   une soiree, DEUX venaient d une meme regle ecrite a deux endroits.
   Cette appli ne garde que ce qui lui est propre : le choix de la carte,
   l identite de l operateur, et le retour a la liste.
   repondre:true et champsAvances:true — c est ICI qu on repond et qu on saisit
   repere, MPN, lien et poles ; devis-client, lui, pose et remonte seulement. */
function apresQui(){
  majQui();
  if(FICHE_ID) monterFiche(FICHE_ID);
}

function monterFiche(id){
  const f = document.getElementById('fiche');
  f.innerHTML = '<div style="margin-bottom:10px;display:flex;gap:9px;flex-wrap:wrap">' +
    '<button class="btn-s" onclick="retour()"><i class="ti ti-arrow-left"></i> Changer de carte</button>' +
    '<button class="btn-s" onclick="ouvrirEdition(' + id + ')"><i class="ti ti-pencil"></i> Modifier la carte</button>' +
    '</div><div id="zone-edition"></div><div id="zone-fiche"></div>';
  majQui();
  return PPFicheDeVie.monter({
    cible: 'zone-fiche',
    base: BASE,
    produitId: () => id,
    repondre: true,
    choixMetier: true,
    champsAvances: true,
    etapeDefaut: 'DEVIS',
    source: 'fiche-de-vie'
  });
}

charger();
</script>
