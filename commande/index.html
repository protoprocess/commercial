<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande</title>
<style>
:root {
  --bg:#0a0c12; --surface:#1a2030; --surface2:#161b27; --border:#262e42; --border2:#333d55;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  --accent:#F07B1F; --accent-bg:#2a1f10;
  --green:#86c564; --green-bg:#EAF3DE; --green-badge:#3B6D11;
  --amber:#eab676; --amber-bg:#FAEEDA; --amber-badge:#854F0B;
  --red:#f09595;   --red-bg:#FCEBEB;   --red-badge:#A32D2D;
  --radius:6px; --radius-lg:10px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13.5px; line-height:1.55; }
header { background:#0f1117; height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; position:sticky; top:0; z-index:5; }
.logo-text { display:flex; align-items:center; gap:0; font-size:13px; font-weight:500; }
.logo-text .lt { color:#fff; } .logo-text .ls { color:#444; margin:0 3px; } .logo-text .lo { color:var(--accent); }
.ver { color:var(--text3); font-size:11px; font-family:var(--mono); }
.wrap { max-width:min(96vw,900px); margin:0 auto; padding:26px 16px 70px; }

/* ---- Saisie ---- */
.saisie { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; }
.saisie label { display:block; color:var(--text2); font-size:12px; margin-bottom:7px; }
.ligne { display:flex; gap:8px; }
input[type=text] { flex:1; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius);
  color:var(--text); font-size:14px; padding:9px 12px; font-family:var(--mono); }
input[type=text]:focus { outline:none; border-color:var(--accent); }
.btn-p { padding:9px 16px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
  font-size:13px; font-weight:500; cursor:pointer; }
.btn-p:disabled { opacity:.5; cursor:default; }
.btn-s { padding:5px 11px; background:transparent; color:var(--text2); border:0.5px solid var(--border);
  border-radius:var(--radius); font-size:12px; cursor:pointer; }
.detecte { margin-top:8px; font-size:12px; color:var(--text3); min-height:16px; }
.detecte b { color:var(--accent); font-weight:600; }

/* ---- Code d'acces ---- */
.acces { margin-top:12px; display:none; }
.acces.visible { display:block; }
.acces p { margin:0 0 8px; color:var(--amber); font-size:12.5px; }

/* ---- Rapport ---- */
.rapport { margin-top:22px; display:none; }
.rapport.visible { display:block; }
.rapport h2 { font-size:13px; color:var(--text2); font-weight:500; margin:0 0 10px; text-transform:uppercase; letter-spacing:.05em; }
.piece { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 15px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
.piece.ok   { box-shadow:inset 3px 0 0 var(--green-badge); }
.piece.warn { box-shadow:inset 3px 0 0 var(--amber-badge); }
.piece.err  { box-shadow:inset 3px 0 0 var(--red-badge); }
.piece.mute { box-shadow:inset 3px 0 0 var(--border2); }
.p-nom { flex:none; width:88px; color:var(--text2); font-size:12px; padding-top:2px; }
.p-corps { flex:1; min-width:0; }
.badge { display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 9px;
  letter-spacing:.03em; text-transform:uppercase; }
.badge-ok   { background:var(--green-bg); color:var(--green-badge); }
.badge-warn { background:var(--amber-bg); color:var(--amber-badge); }
.badge-err  { background:var(--red-bg);   color:var(--red-badge); }
.badge-mute { background:var(--surface2); color:var(--text3); border:1px solid var(--border); }
.p-detail { margin-top:5px; color:var(--text2); font-size:12.5px; overflow-wrap:anywhere; }
.p-detail a { color:var(--accent); text-decoration:none; }
.p-detail a:hover { text-decoration:underline; }
.p-detail code { font-family:var(--mono); font-size:11.5px; background:var(--surface2);
  border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.p-actions { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.copiable { cursor:pointer; }
.etat-msg { margin-top:14px; font-size:12.5px; }
.etat-msg.err { color:var(--red); }
.etat-msg.chargement { color:var(--text2); }
.spin { display:inline-block; width:11px; height:11px; border:2px solid var(--border2);
  border-top-color:var(--accent); border-radius:50%; animation:r .8s linear infinite; vertical-align:-1px; margin-right:6px; }
@keyframes r { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
/* ---- Diagnostic commande (v5.0, 01/09) : une ligne = un fait + une ecriture ---- */
.hdr-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.btn-accueil { padding:5px 11px; background:transparent; color:var(--text2); border:0.5px solid var(--border2); border-radius:var(--radius); font-size:12px; cursor:pointer; font-family:inherit; }
.btn-accueil:hover { color:var(--accent); border-color:var(--accent); }
.diag { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 16px; margin-top:16px; }
.diag-tete { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.diag-tete b { color:var(--text); }
.diag-tete .sp { flex:1; }
.dl { display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
.dl .ic { flex:none; width:18px; text-align:center; font-family:var(--mono); font-weight:700; }
.dl .ic.ok { color:var(--green); } .dl .ic.warn { color:var(--amber); } .dl .ic.err { color:var(--red); } .dl .ic.mute { color:var(--text3); }
.dl input[type=checkbox] { flex:none; width:15px; height:15px; accent-color:var(--accent); margin:0 1px; cursor:pointer; }
.dl .lib { flex:none; width:150px; color:var(--text2); }
.dl .val { flex:1; min-width:0; overflow-wrap:anywhere; }
.dl .val code { font-family:var(--mono); font-size:11.5px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.dl .det { flex:none; max-width:42%; color:var(--text3); font-size:12px; text-align:right; }
.dl .det.err { color:var(--red); }
.dl input[type=date] { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius); color:var(--text); padding:3px 6px; font-family:var(--mono); font-size:12px; color-scheme:dark; }
.dl.off { opacity:.5; }
.diag-pied { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px; }
.diag-pied .msg { font-size:12px; color:var(--text3); }
.autres { display:none; border-bottom:1px solid var(--border); }
.autres.visible { display:block; }
.autres .dl { border-bottom:none; padding:4px 0; }
.lien { color:var(--accent); cursor:pointer; font-size:12px; text-decoration:none; }
.lien:hover { text-decoration:underline; }
.journal { margin-top:8px; }
.journal .dl { border-bottom:none; padding:3px 0; }
.aide { cursor:help; border-bottom:1px dotted var(--text3); }

/* ---- Feuille de route (v6.0) ---- */
.fr { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:6px 16px 10px; }
.fr .diag-tete { padding:8px 0; }
.et { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
.et:last-child { border-bottom:none; }
.et .num { flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:700; border:1.5px solid var(--border2); color:var(--text3); }
.et.done .num { background:var(--green-bg); color:var(--green-badge); border-color:transparent; }
.et.active .num { background:var(--accent); color:#fff; border-color:transparent; }
.et.wait { opacity:.5; }
.et .lib { flex:none; width:170px; color:var(--text2); font-size:12.5px; padding-top:4px; }
.et.active .lib { color:var(--text); font-weight:500; }
.et .corps { flex:1; min-width:0; font-size:12.5px; padding-top:4px; overflow-wrap:anywhere; }
.et .corps a { color:var(--accent); text-decoration:none; }
.et .corps code { font-family:var(--mono); font-size:11.5px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.et .corps .p-actions { margin-top:6px; }
.et .why { color:var(--text3); font-size:12px; }
.et .corps .dl { padding:5px 0; }
.et .corps .dl .lib { width:130px; padding-top:0; }
</style>

<style>
/* signalement : bouton flottant, module commun (chantier 72) */
#sig-btn{position:fixed;right:18px;bottom:18px;z-index:60;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:22px;background:var(--surface,#1a2030);color:var(--text2,#94a3b8);border:1px solid var(--border2,#333d55);box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;font-size:12px;font-family:inherit}
#sig-btn:hover{color:var(--blue,#F07B1F);border-color:var(--blue,#F07B1F)}
#sig-fond{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
#sig-fond.hidden{display:none}
#sig-boite{background:var(--surface,#1a2030);border:1px solid var(--border2,#333d55);border-radius:10px;width:min(94vw,560px);max-height:90vh;overflow:auto;padding:18px;color:var(--text,#e2e8f0);font-size:13px}
#sig-boite h2{font-size:15px}
.sig-t{display:flex;gap:6px;margin:0 0 11px;flex-wrap:wrap}
.sig-t button{flex:1;min-width:120px;padding:8px 10px;border-radius:6px;background:transparent;color:var(--text2,#94a3b8);border:1px solid var(--border,#262e42);font-size:12px;cursor:pointer;font-family:inherit}
.sig-t button.on{background:var(--blue,#F07B1F);color:#fff;border-color:transparent;font-weight:500}
#sig-boite label.f{display:block;font-size:11.5px;color:var(--text2,#94a3b8);margin:0 0 4px}
#sig-boite input.f,#sig-boite textarea.f{width:100%;box-sizing:border-box;background:var(--surface2,#161b27);color:var(--text,#e2e8f0);border:1px solid var(--border,#262e42);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;margin-bottom:10px}
#sig-boite .btn-ann{padding:6px 13px;background:transparent;color:var(--text2,#94a3b8);border:1px solid var(--border,#262e42);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
#sig-boite .btn-env{padding:6px 13px;background:var(--blue,#F07B1F);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<header>
  <img src="../shared/picto-pp.png" alt="Proto Process" width="24" height="24"
       style="object-fit:contain" onerror="this.style.display='none'">
  <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo">Commande</span></span>
  <span class="ver" id="ver"></span>
  <span class="hdr-right"><button class="btn-accueil" id="btn-accueil" title="Retour à la liste des commandes entrantes">← Accueil</button></span>
</header>

<div class="wrap">
  <div class="saisie">
    <label for="entree">Numéro de commande (SO…) ou produit (clé, référence ou libellé)</label>
    <div class="ligne">
      <input type="text" id="entree" placeholder="SO2608-434 ou CLI277-1300078240" autocomplete="off">
      <button class="btn-p" id="btn-diag">Diagnostiquer</button>
    </div>
    <div class="detecte" id="detecte"></div>
    <div class="acces" id="acces">
      <p>Code d'accès Proto Process requis (le même que FabStory).</p>
      <div class="ligne">
        <input type="text" id="code" placeholder="Code d'accès">
        <button class="btn-p" id="btn-code">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="entrantes"></div>

  <div id="confrontation"></div>

  <div class="etat-msg" id="etat"></div>

  <div class="rapport" id="rapport">
    <h2>Feuille de route</h2>
    <div id="pieces"></div>
  </div>
</div>

<script>
/* ============================================================ COMMANDE ==== */
const APP_VERSION = "6.6";
const APP_DATE = "01/09/2026";
document.title = "Commande v" + APP_VERSION;
document.getElementById('ver').textContent = "v" + APP_VERSION + " \u2014 " + APP_DATE;

const KEY = 'pp_access_code', HDR = 'X-PP-Auth';
const API = 'https://protoprocess.app.n8n.cloud/webhook/';
function code()      { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function setCode(v)  { try { localStorage.setItem(KEY, v); } catch (e) {} }
function delCode()   { try { localStorage.removeItem(KEY); } catch (e) {} }
const el = id => document.getElementById(id);

/* Detection SO / produit : un numero SOxxxx-xxx est une commande, le reste un produit. */
function analyser(txt) {
  const t = String(txt || '').trim();
  if (!t) return null;
  if (/^SO[\d-]+$/i.test(t)) return { mode: 'so', valeur: t.toUpperCase() };
  return { mode: 'produit', valeur: t };
}
el('entree').addEventListener('input', function () {
  const a = analyser(this.value);
  el('detecte').innerHTML = !a ? '' :
    (a.mode === 'so' ? 'Entr\u00e9e reconnue : <b>commande</b> \u2014 diagnostic du SO existant'
                     : 'Entr\u00e9e reconnue : <b>produit</b> \u2014 parcours refab');
});
el('entree').addEventListener('keydown', e => { if (e.key === 'Enter') diagnostiquer(); });
el('btn-diag').addEventListener('click', diagnostiquer);
el('btn-code').addEventListener('click', function () {
  const v = el('code').value.trim();
  if (!v) return;
  setCode(v); el('acces').classList.remove('visible'); diagnostiquer();
});

async function appel(chemin, options) {
  const o = options || {};
  o.headers = Object.assign({}, o.headers, { [HDR]: code() });
  const r = await fetch(API + chemin, o);
  if (r.status === 401 || r.status === 403) { delCode(); throw new Error('ACCES'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---- Proposition de carte deduite d'une commande entrante -------------
   Cas rencontre le 28/08 avec le PO EPFL : entree par PRODUIT (pas par SO),
   donc l'API ne fournit aucune proposition — elle ne sait la construire qu'a
   partir d'un SO existant. L'humain tombait alors sur un simple lien vers
   FabStory, formulaire vide, alors que le bon de commande venait de livrer
   de quoi le remplir.
   La cle attendue est CLIxxx-ref : on la decoupe depuis la reference lue dans
   le PO. Si le motif CLIxxx est absent, on laisse les champs vides plutot que
   d'inventer un code client — c'est l'humain qui tranche. */
function propositionDepuisEntrante() {
  if (!ENTRANTE) return null;
  const ref = String(ENTRANTE.ref_detectee || '').trim();
  if (!ref) return null;
  const m = ref.match(/^\s*(CLI\d+)\s*[-\u2013\u2014]?\s*(.*)$/i);
  return {
    code_client: m ? m[1].toUpperCase() : '',
    ref_carte: m ? (m[2] || '').trim() : ref,
    indice: ENTRANTE.indice_detecte || '',
    libelle: '',
    nom_client: ENTRANTE.client_detecte || ''
  };
}

let DERNIER = null;
let MSG_PERSIST = null; /* message de succes affiche APRES le re-diagnostic */
let ENTRANTE = null; /* commande entrante choisie, pour pre-remplir le devis */

/* ---- Commandes entrantes (mails etiquette "commande") ------------------ */
async function chargerEntrantes() {
  if (!code()) return;
  try {
    const rep = await appel('commande-entrantes');
    const z = el('entrantes');
    if (!rep.ok || !rep.nb) { z.innerHTML = ''; return; }
    z.innerHTML = rep.entrantes.map(e => {
      const cad = (e.cadences || []).map(c =>
        [c.date, c.qte ? c.qte + ' pcs' : null, (c.prix_unitaire || c.prix_unitaire === 0) ? c.prix_unitaire + ' \u20ac' : null]
        .filter(Boolean).join(' \u00b7 ')).join('  /  ');
      const rat = e.etat === 'rattachee';
      return '<div class="piece ' + (rat ? 'ok' : 'warn') + '" style="margin-top:14px"><div class="p-nom">Mail re\u00e7u</div><div class="p-corps">' +
        (rat ? '<span class="badge badge-ok">rattach\u00e9e \u00b7 ' + ech(e.odoo_so_name || '') + '</span> <span style="color:var(--text3);font-size:12px">attend la confirmation du devis dans Odoo</span>'
             : '<span class="badge badge-warn">commande entrante</span>') +
        (Number(e.nb_lots) > 1 ? ' <span class="badge badge-mute">lot ' + ech(e.lot) + '/' + ech(e.nb_lots) + '</span>' : '') +
        (e.ref_devis_pp ? ' <span class="badge badge-mute">devis cit\u00e9 ' + ech(e.ref_devis_pp) + '</span>' : '') +
        '<div class="p-detail"><b>' + ech(e.client_detecte || e.expediteur || '?') + '</b> \u00b7 ' + ech(e.ref_detectee || 'r\u00e9f non lue') +
        (e.indice_detecte ? ' <code>indice ' + ech(e.indice_detecte) + '</code>' : '') +
        (e.num_commande_client ? ' \u00b7 PO ' + ech(e.num_commande_client) : '') +
        (cad ? '<br>' + ech(cad) : '') +
        (e.resume ? '<br><span style="color:var(--text3)">' + ech(e.resume) + ' (confiance ' + ech(e.confidence) + ')</span>' : '') +
        '</div><div class="p-actions">' +
        '<button class="btn-p" data-diag-entrante="' + e.id + '">Diagnostiquer</button>' +

        '<button class="btn-s" data-entrante-etat="' + e.id + '" data-etat="traitee">Marquer trait\u00e9e</button>' +
        (rat ? '' : '<button class="btn-s" data-entrante-etat="' + e.id + '" data-etat="ecartee">\u00c9carter</button>') +
        '</div></div></div>';
    }).join('');
    z.querySelectorAll('[data-ouvrir-entrante]').forEach(b => b.addEventListener('click', function () {
      ENTRANTE = rep.entrantes.find(x => String(x.id) === this.dataset.ouvrirEntrante) || null;
      if (ENTRANTE) { el('entree').value = ENTRANTE.ref_detectee; el('entree').dispatchEvent(new Event('input')); diagnostiquer(); }
    }));
    z.querySelectorAll('[data-diag-entrante]').forEach(b => b.addEventListener('click', function () {
      const ent = rep.entrantes.find(x => String(x.id) === this.dataset.diagEntrante) || null;
      diagnostiquerEntrante(ent, this);
    }));
    z.querySelectorAll('[data-entrante-etat]').forEach(b => b.addEventListener('click', async function () {
      this.disabled = true;
      try {
        await appel('commande-entrante-etat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: parseInt(this.dataset.entranteEtat, 10), etat: this.dataset.etat }) });
        chargerEntrantes();
      } catch (e2) { this.disabled = false; }
    }));
  } catch (err) { /* silencieux : le bandeau est un plus, jamais un blocage */ }
}
chargerEntrantes();
/* ---- DIAGNOSTIC D UNE COMMANDE ENTRANTE (v5.0 → v6.0, 01/09/2026) ---------
   Une seule action : Diagnostiquer = chercher les devis ouverts du client,
   retenir le plus probable (meme montant, sinon le plus proche), confronter,
   puis lire les 5 pieces de l affaire. Le tout est rendu dans UNE feuille de
   route numerotee (v6.0, demande Olivier : l ordre des gestes doit etre
   evident, sinon « ca va merdouiller »). */
let DIAG = null; /* { ent, devisListe, note, so: {nom,id}, conf: reponse confronter, applique: journal } */

async function diagnostiquerEntrante(ent, bouton) {
  if (!ent) return;
  if (!code()) { el('acces').classList.add('visible'); el('code').focus(); return; }
  const z = el('confrontation');
  if (bouton) { bouton.disabled = true; bouton.textContent = 'Diagnostic\u2026'; }
  z.innerHTML = '<div class="etat-msg chargement"><span class="spin"></span>Recherche du devis et confrontation\u2026</div>';
  el('rapport').classList.remove('visible');
  /* v6.2 : une entrante RATTACHEE va droit a son devis (qui peut deja etre
     confirme, donc absent de la liste des devis ouverts). */
  if (ent.etat === 'rattachee' && ent.odoo_so_name) {
    DIAG = { ent: ent, devisListe: [], note: null, so: null, conf: null, applique: null };
    ENTRANTE = ent;
    if (bouton) { bouton.disabled = false; bouton.textContent = 'Diagnostiquer'; }
    await confronter(ent, ent.odoo_so_name);
    return;
  }
  let liste = null;
  try { liste = await appel('commande-devis-ouverts?entrante=' + encodeURIComponent(ent.id)); } catch (err) { liste = null; }
  DIAG = { ent: ent, devisListe: (liste && liste.ok) ? (liste.devis || []) : [], note: liste ? liste.note : null, so: null, conf: null, applique: null };
  ENTRANTE = ent;
  if (bouton) { bouton.disabled = false; bouton.textContent = 'Diagnostiquer'; }
  /* v6.4 : l appli PROPOSE, l humain TRANCHE (regle du 28/08). Le devis ne
     s ouvre seul que s il est CITE au bon de commande ou au centime pres ;
     sinon la liste des candidats, avec le bouton devis refab. Constate le
     01/09 : un lot HORIBA sans devis avait ete confronte au premier devis
     ouvert du client, une autre carte. */
  const premier = DIAG.devisListe[0] || null;
  if (premier && (premier.cite_au_po || premier.meme_montant)) { await confronter(ent, premier.nom); return; }
  afficherChoixDevis(z);
}

/* Confronte l entrante a un devis, puis lance la lecture des 5 pieces sur ce
   devis : la feuille de route est rendue par afficher() avec les deux. */
async function confronter(ent, so) {
  const z = el('confrontation');
  z.innerHTML = '<div class="etat-msg chargement"><span class="spin"></span>Confrontation \u00e0 ' + ech(so) + '\u2026</div>';
  el('rapport').classList.remove('visible');
  try {
    const rep = await appel('commande-confronter?entrante=' + encodeURIComponent(ent.id) + '&so=' + encodeURIComponent(so));
    if (!rep || !rep.ok) { z.innerHTML = '<div class="etat-msg err">' + ech((rep && rep.motif) || 'R\u00e9ponse illisible.') + '</div>'; return; }
    DIAG.so = { nom: rep.devis.nom, id: rep.devis.id };
    DIAG.conf = rep;
    DIAG.applique = null;
    el('entree').value = rep.devis.nom;
    el('entree').dispatchEvent(new Event('input'));
    await diagnostiquer(true);
  } catch (err) {
    z.innerHTML = '<div class="etat-msg err">La confrontation n\u2019a pas r\u00e9pondu (' + ech(err.message) + ').</div>';
  }
}

/* Un seul appel groupe : l API pose tout, relit tout, et rend un journal. */
async function appliquer(rep, ent) {
  const z = el('pieces');
  const coche = c => { const x = z.querySelector('[data-action="' + c + '"]'); return !!(x && x.checked); };
  const A = {}; (rep.actions || []).forEach(a => { A[a.cle] = a; });
  const dateChamp = z.querySelector('[data-date]');
  const ecritures = {
    ref: coche('ref') && A.ref ? (A.ref.valeur || null) : null,
    date: coche('date') && dateChamp && dateChamp.value ? dateChamp.value : null,
    abonnes: A.abonnes ? (A.abonnes.liste || []).filter((c, i) => { const x = z.querySelector('[data-abonne="' + i + '"]'); return !!(x && x.checked); })
      .map(c => ({ partner_id: c.partner_id || null, email: c.email || null, nom: c.nom || null })) : undefined,
    commercial_id: A.abonnes && A.abonnes.commercial ? A.abonnes.commercial.partner_id : null,
    exigences: coche('note') && A.note ? (A.note.liste || []) : [],
    piece_jointe: coche('pj')
  };
  const b = el('btn-appliquer'), m = el('diag-msg');
  b.disabled = true; b.textContent = '\u00c9criture en cours\u2026'; m.textContent = ''; m.style.color = '';
  try {
    const r = await appel('commande-rattacher', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ so_id: rep.devis.id, entrante_id: ent.id, ecritures: ecritures }) });
    if (r.ok) {
      DIAG.applique = r;
      chargerEntrantes();
      MSG_PERSIST = '\u00c9critures appliqu\u00e9es sur ' + (r.so || rep.devis.nom) + ' (' + r.nb_fait + ' relue(s) dans Odoo). Entrante rattach\u00e9e : elle dispara\u00eetra \u00e0 la confirmation du devis.';
      diagnostiquer();
    } else {
      afficherJournal(r, el('journal'));
      b.disabled = false; b.textContent = 'R\u00e9essayer';
      m.textContent = r.motif || 'Refus\u00e9.'; m.style.color = 'var(--red)';
    }
  } catch (err) {
    b.disabled = false; b.textContent = 'R\u00e9essayer';
    m.textContent = 'L\u2019\u00e9criture n\u2019a pas r\u00e9pondu (' + err.message + ').'; m.style.color = 'var(--red)';
  }
}

/* sansConf = true quand confronter() vient de rafraichir DIAG.conf : on ne le
   relit pas une seconde fois. Sinon (apres une action), la confrontation est
   relue en parallele des 5 pieces, pour que l etape 6 reflete le devis a jour
   (ex. le constat « article generique » disparait apres le remplacement). */
async function diagnostiquer(sansConf) {
  const a = analyser(el('entree').value);
  if (!a) { el('etat').textContent = 'Saisir un num\u00e9ro de commande ou un produit.'; el('etat').className = 'etat-msg err'; return; }
  if (!code()) { el('acces').classList.add('visible'); el('code').focus(); return; }
  el('btn-diag').disabled = true;
  el('etat').innerHTML = '<span class="spin"></span>Lecture de l\u2019affaire\u2026';
  el('etat').className = 'etat-msg chargement';
  el('confrontation').innerHTML = '';
  el('rapport').classList.remove('visible');
  try {
    const q = (a.mode === 'so' ? 'so=' : 'produit=') + encodeURIComponent(a.valeur);
    const promesses = [appel('commande-diagnostic?' + q)];
    const relireConf = !sansConf && DIAG && DIAG.ent && DIAG.so && a.mode === 'so' && a.valeur === DIAG.so.nom;
    if (relireConf) promesses.push(appel('commande-confronter?entrante=' + encodeURIComponent(DIAG.ent.id) + '&so=' + encodeURIComponent(DIAG.so.nom)).catch(() => null));
    const res = await Promise.all(promesses);
    const rep = res[0];
    if (relireConf && res[1] && res[1].ok) DIAG.conf = res[1];
    DERNIER = { entree: a, rep: rep };
    if (MSG_PERSIST) { el('etat').textContent = '\u2713 ' + MSG_PERSIST; el('etat').className = 'etat-msg'; el('etat').style.color = 'var(--green)'; MSG_PERSIST = null; }
    else { el('etat').textContent = ''; el('etat').style.color = ''; }
    afficher(rep);
  } catch (err) {
    if (err.message === 'ACCES') {
      el('etat').textContent = 'Code d\u2019acc\u00e8s refus\u00e9 \u2014 ressaisir.';
      el('etat').className = 'etat-msg err';
      el('acces').classList.add('visible'); el('code').focus();
    } else {
      el('etat').textContent = 'Le diagnostic n\u2019a pas r\u00e9pondu (' + err.message + '). R\u00e9essayer, et si \u00e7a persiste v\u00e9rifier n8n.';
      el('etat').className = 'etat-msg err';
    }
  }
  el('btn-diag').disabled = false;
}

/* ---- FEUILLE DE ROUTE (v6.0) ----------------------------------------------
   1 carte FabStory → 2 article Odoo → 3 ligne Prototype (ou devis refab) →
   4 lien article↔carte → 5 projet Odoo (libre) → 6 ecritures Odoo (si PO) →
   7 rappel manuel Odoo. Une seule etape active (▶) ; 3 et 4 attendent 2 ;
   5 reste toujours actionnable. */
const ech = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const INP = 'background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12.5px';
const ODOO = 'https://protoprocess-main-16873066.dev.odoo.com/odoo/sales/';

function afficher(rep) {
  if (!rep || !rep.pieces) { el('etat').textContent = 'R\u00e9ponse illisible.'; el('etat').className = 'etat-msg err'; return; }
  const P = {}; rep.pieces.forEach(p => { P[p.piece] = p; });
  const so = P.so || {}, art = P.article || {}, carte = P.carte || {}, liens = P.liens || {}, proj = P.projet || {};
  const conf = (DIAG && DIAG.conf && DIAG.so && so.so === DIAG.so.nom) ? DIAG.conf : null;
  const ent = conf ? DIAG.ent : null;
  const parProduit = so.verdict === 'non_demande';

  /* --- calcul de l etat de chaque etape --- */
  const E = []; /* { n, lib, etat: done|active|wait|info, corps, dep } */
  // 1. carte
  const carteOk = carte.verdict === 'existe';
  E.push({ n: 1, lib: 'Carte FabStory', done: carteOk, bloque: false });
  // 2. article
  const artOk = !!art.article;
  E.push({ n: 2, lib: 'Article Odoo', done: artOk, bloque: !carteOk && !artOk && art.verdict !== 'plusieurs', dep: 1 });
  // 3. ligne prototype / devis refab
  let e3;
  if (parProduit) e3 = { n: 3, lib: 'Devis refab', done: false, bloque: !(artOk && carteOk), dep: 2 };
  else {
    const lp = art.ligne_prototype;
    e3 = { n: 3, lib: 'Ligne Prototype', done: !lp, bloque: !!lp && !artOk, dep: 2, verrou: !!lp && artOk && !so.confirmable };
  }
  E.push(e3);
  // 4. liens
  const liensOk = liens.verdict === 'poses';
  E.push({ n: 4, lib: 'Lien article \u2194 carte', done: liensOk, bloque: !liensOk && liens.verdict !== 'a_poser', dep: 2 });
  // 5. projet (libre)
  const projOk = proj.verdict === 'trouve';
  E.push({ n: 5, lib: 'Projet Odoo', done: projOk, bloque: false, libre: true });
  // 6. ecritures (si PO)
  if (conf) E.push({ n: 6, lib: '\u00c9critures Odoo', done: !!(DIAG.applique && DIAG.applique.ok), bloque: false });
  // 7. manuel
  E.push({ n: 7, lib: 'Dans Odoo', done: false, manuel: true });

  /* etape active = premiere non faite, hors libre et manuel, et hors verrou */
  const courante = E.find(e => !e.done && !e.libre && !e.manuel && !e.verrou);
  const nCourante = courante ? courante.n : null;
  const etat = e => e.done ? 'done' : (e.manuel ? 'info' : (e.libre ? 'active' : (e.n === nCourante ? 'active' : 'wait')));

  /* --- corps de chaque etape --- */
  const attente = e => e.dep ? '<span class="why">attend l\u2019\u00e9tape ' + e.dep + '</span>' : '';
  const corps = {};

  // 1
  if (carteOk) corps[1] = ech(carte.carte.cle_produit) + (carte.carte.indice ? ' <code>indice ' + ech(carte.carte.indice) + '</code>' : '') +
    (carte.carte.libelle_carte ? ' \u00b7 ' + ech(carte.carte.libelle_carte) : '') + ' \u2014 <a href="' + ech(carte.url) + '" target="_blank" rel="noopener">ouvrir la carte</a>';
  else if (carte.verdict === 'plusieurs') corps[1] = 'Plusieurs cartes candidates, choisir la bonne (rattachement) :<div class="p-actions">' +
    carte.candidats.map(c => '<button class="btn-s" data-choisir="' + c.id + '" data-cle="' + ech(c.cle_produit) + '">' + ech(c.cle_produit) + (c.libelle_carte ? ' \u00b7 ' + ech(c.libelle_carte) : '') + '</button>').join('') +
    '<span class="choix-note why"></span></div>';
  else {
    const pr = carte.proposition || propositionDepuisEntrante();
    if (pr) corps[1] = 'Aucune carte : cr\u00e9er depuis ' + (carte.proposition ? 'le SO' : 'le bon de commande') + ' (la carte porte la r\u00e9f <b>famille</b>, l\u2019indice \u00e0 part) :' +
      '<div class="p-actions"><div class="form-carte" data-client="' + ech(pr.nom_client || '') + '" style="display:grid;grid-template-columns:110px 1fr 90px;gap:6px;width:100%;max-width:560px">' +
      '<input type="text" class="fc-code" value="' + ech(pr.code_client) + '" placeholder="CLIxxx" style="' + INP + '">' +
      '<input type="text" class="fc-ref" value="' + ech(pr.ref_carte) + '" placeholder="R\u00e9f famille (sans indice)" style="' + INP + '">' +
      '<input type="text" class="fc-indice" value="' + ech(pr.indice) + '" placeholder="Indice" style="' + INP + '">' +
      '<input type="text" class="fc-libelle" value="" placeholder="Libell\u00e9 (optionnel)" style="grid-column:1/3;' + INP + ';font-family:inherit">' +
      '<button class="btn-p" data-creer-carte="1">Cr\u00e9er la carte</button></div></div>';
    else corps[1] = 'Aucune carte pour ce produit. <a class="btn-s" style="text-decoration:none;display:inline-block" href="https://protoprocess.github.io/commercial/fabstory/" target="_blank" rel="noopener">Cr\u00e9er la carte dans FabStory</a> <span class="why">puis relancer</span>';
  }

  // 2
  if (artOk) corps[2] = ech(art.article.nom) + ' <code>#' + art.article.id + '</code>' + (art.verdict === 'existe_hors_so' ? ' \u2014 existe, pas encore sur ce SO' : '');
  else if (art.verdict === 'plusieurs') corps[2] = 'Arbitrage requis : ' + art.candidats.map(c => ech(c.nom)).join(' / ');
  else if (carteOk) corps[2] = 'Aucun article r\u00e9el : le cr\u00e9er depuis la carte (cat\u00e9gorie Protos, liens pos\u00e9s d\u2019office).' +
    '<div class="p-actions" style="max-width:560px"><input type="text" class="fa-nom" value="' + ech(carte.carte.cle_produit + (carte.carte.indice ? ' ' + carte.carte.indice : '')) + '" style="flex:1;min-width:260px;' + INP + '">' +
    '<button class="btn-p" data-creer-article="' + carte.carte.id + '">Cr\u00e9er l\u2019article</button>' +
    '<span class="why" style="width:100%">nom \u00e9ditable \u2014 doit commencer par ' + ech(carte.carte.cle_produit) + '</span></div>';
  else corps[2] = 'Aucun article r\u00e9el. ' + attente(E[1]);

  // 3
  if (parProduit) {
    if (artOk && carteOk) corps[3] = '__REFAB__';
    else corps[3] = 'Le devis refab sera cr\u00e9\u00e9 depuis l\u2019article. ' + attente(e3);
  } else if (!art.ligne_prototype) corps[3] = 'Aucune ligne \u00ab Prototype \u00bb sur le devis.';
  else {
    const lp = art.ligne_prototype;
    if (!artOk) corps[3] = lp.nb + ' ligne(s) \u00ab Prototype \u00bb \u00e0 remplacer par l\u2019article d\u00e9di\u00e9. ' + attente(e3);
    else if (!so.confirmable) corps[3] = lp.nb + ' ligne(s) \u00ab Prototype \u00bb, mais SO ' + ech(so.etat) + ' : remplacement verrouill\u00e9 (des livraisons existent derri\u00e8re), geste manuel dans Odoo si vraiment n\u00e9cessaire.';
    else {
      const tout = lp.lignes.map(l => l.id).join(',');
      corps[3] = lp.nb + ' ligne(s) \u00ab Prototype \u00bb \u00e0 remplacer par <b>' + ech(art.article.nom) + '</b> (prix, quantit\u00e9, date conserv\u00e9s, preuve au retour).<div class="p-actions">' +
        (lp.lignes.length > 1 ? '<button class="btn-p" data-remplacer-tout="' + tout + '" data-article="' + art.article.id + '">Remplacer les ' + lp.lignes.length + ' lignes</button>' : '') +
        lp.lignes.map(l => '<button class="' + (lp.lignes.length > 1 ? 'btn-s' : 'btn-p') + '" data-remplacer-ligne="' + l.id + '" data-article="' + art.article.id + '">Remplacer la ligne ' + ech(l.prix) + ' \u20ac \u00d7 ' + ech(l.qte) + '</button>').join('') + '</div>';
    }
  }

  // 4
  if (liensOk) corps[4] = 'PP Produit ID <code>' + ech(liens.pp_produit_id) + '</code>' + (liens.fabstory ? ' \u00b7 <a href="' + ech(liens.fabstory) + '" target="_blank" rel="noopener">lien FabStory sur l\u2019article</a>' : '');
  else if (liens.verdict === 'a_poser') {
    const pid = (liens.action || '').match(/produit_id=(\d+)/);
    corps[4] = 'L\u2019article et la carte existent mais ne sont pas reli\u00e9s.' + (pid ? '<div class="p-actions"><button class="btn-p" data-lier="' + pid[1] + '">Relier maintenant</button></div>' : '');
  } else corps[4] = ech(liens.detail || 'En attente.') + ' ' + attente(E[3]);

  // 5
  if (projOk) corps[5] = ech(proj.projet.name) + ' <code>#' + proj.projet.id + '</code>';
  else if (proj.verdict === 'plusieurs') corps[5] = 'Plusieurs projets au nom attendu : ' + proj.candidats.map(c => ech(c.name)).join(' / ') + ' \u2014 \u00e0 trancher dans Odoo';
  else if (proj.verdict === 'candidats') corps[5] = ech(proj.detail || '') + ' Nom attendu : <code>' + ech(proj.nom_attendu) + '</code><div class="p-actions">' +
    proj.candidats.map(c => '<button class="btn-s" data-projet-renommer="' + c.id + '" data-nom="' + ech(proj.nom_attendu) + '">Renommer \u00ab ' + ech(c.name) + ' \u00bb</button>').join('') +
    '<button class="btn-s" data-projet-creer="1" data-nom="' + ech(proj.nom_attendu) + '" data-so="' + ech(proj.so_numero || '') + '">Aucun : cr\u00e9er le projet</button></div>';
  else if (proj.verdict === 'introuvable') corps[5] = 'Introuvable \u2014 nom attendu <code class="copiable" title="Cliquer pour copier">' + ech(proj.nom_attendu) + '</code><div class="p-actions">' +
    '<button class="btn-p" data-projet-creer="1" data-nom="' + ech(proj.nom_attendu) + '" data-so="' + ech(proj.so_numero || '') + '">Cr\u00e9er le projet</button>' +
    (proj.so_numero ? '<span class="why">avec l\u2019\u00e9tape ' + ech(proj.so_numero) + '</span>' : '') + '</div>';
  else corps[5] = ech(proj.detail || '');

  // 6
  if (conf) {
    if (DIAG.applique && DIAG.applique.ok) corps[6] = '<div class="journal">' + htmlJournal(DIAG.applique) + '</div>';
    else corps[6] = htmlEcritures(conf);
  }

  // 7
  const ancienne = conf ? (conf.ecarts || []).filter(e => e.nom === 'Ligne ancienne rest\u00e9e ouverte') : [];
  corps[7] = (so.so ? '<a href="' + ODOO + ech(so.so_id) + '" target="_blank" rel="noopener">Ouvrir ' + ech(so.so) + '</a> : ' : '') +
    'v\u00e9rifier, confirmer le devis, envoyer l\u2019AR.' +
    (ancienne.length ? ' <b>Puis seulement</b> neutraliser (quantit\u00e9 0) ' + ancienne.map(e => ech(String(e.constat).split(' : ')[0])).join(', ') + '.' : '');

  /* --- rendu --- */
  const z = el('pieces'); z.innerHTML = '';
  let tete = '';
  if (conf) {
    const d = conf.devis, t = conf.totaux;
    const meme = Math.abs(Number(t.po) - Number(t.devis)) < 0.01;
    tete = '<div class="diag-tete"><b>' + ech(d.nom) + '</b> \u00b7 ' + ech(d.client) +
      ' \u00b7 <span class="badge ' + (meme ? 'badge-ok' : 'badge-err') + '">' + (meme ? 'PO = devis ' + ech(t.devis_texte) : 'PO ' + ech(t.po_texte) + ' \u2260 devis ' + ech(t.devis_texte)) + '</span>' +
      '<span class="sp"></span><a class="lien" id="lien-changer">Changer de devis</a>' +
      '<a class="lien" target="_blank" rel="noopener" href="' + ODOO + d.id + '">Ouvrir dans Odoo \u2197</a></div>' +
      '<div class="autres" id="autres">' + htmlChoixDevis(d.nom) + '</div>';
  } else if (so.so) {
    tete = '<div class="diag-tete"><b>' + ech(so.so) + '</b> \u00b7 ' + ech(so.client || '') + ' \u00b7 <code>' + ech(so.etat) + '</code>' +
      (so.alerte ? ' <span style="color:var(--amber)">\u26a0 ' + ech(so.alerte) + '</span>' : '') +
      '<span class="sp"></span><a class="lien" target="_blank" rel="noopener" href="' + ODOO + so.so_id + '">Ouvrir dans Odoo \u2197</a></div>';
  } else if (so.verdict === 'introuvable') {
    tete = '<div class="diag-tete"><span style="color:var(--red)">' + ech(so.detail || 'SO introuvable') + '</span></div>';
  } else {
    tete = '<div class="diag-tete"><b>Refab</b> \u00b7 ' + ech((DERNIER && DERNIER.entree.valeur) || '') + '<span class="sp"></span></div>';
  }
  const fr = document.createElement('div'); fr.className = 'fr';
  let h = tete;
  for (const e of E) {
    const st = etat(e);
    const ico = st === 'done' ? '\u2713' : (st === 'active' ? '\u25b6' : String(e.n));
    let c = corps[e.n] || '';
    if (c === '__REFAB__') c = '';
    h += '<div class="et ' + st + '" data-etape="' + e.n + '"><span class="num">' + ico + '</span><span class="lib">' + e.n + '. ' + e.lib + '</span><div class="corps">' + c + '</div></div>';
  }
  fr.innerHTML = h;
  z.appendChild(fr);

  /* bloc refab (etape 3 par produit) : formulaire cadences */
  if (parProduit && corps[3] === '__REFAB__') {
    const cible = fr.querySelector('[data-etape="3"] .corps');
    const refDef = (carte.carte.ref_carte || '') + (carte.carte.indice ? ' ' + carte.carte.indice : '');
    cible.innerHTML = 'Article ' + ech(art.article.nom) + ' \u00b7 une ligne par cadence \u00b7 jamais de PP-0001 \u00b7 na\u00eet brouillon.' +
      '<div class="p-actions" style="flex-direction:column;align-items:stretch;max-width:560px">' +
      '<input type="text" class="fd-ref" value="' + ech(refDef) + '" placeholder="R\u00e9f projet (colonne F)" style="' + INP + ';font-family:inherit">' +
      '<div class="fd-cadences"></div>' +
      '<div style="display:flex;gap:8px"><button class="btn-s" data-cadence-plus="1">+ cadence</button>' +
      '<button class="btn-p" data-creer-devis="' + carte.carte.id + '">Cr\u00e9er le devis brouillon</button></div></div>';
    const zone = cible.querySelector('.fd-cadences');
    const ligneCadence = () => {
      const r = document.createElement('div');
      r.style.cssText = 'display:grid;grid-template-columns:150px 1fr 1fr;gap:6px;margin-bottom:6px';
      r.innerHTML = '<input type="date" class="fd-date" style="' + INP + ';color-scheme:dark">' +
        '<input type="number" class="fd-qte" min="1" placeholder="Quantit\u00e9" style="' + INP + '">' +
        '<input type="number" class="fd-prix" min="0" step="0.01" placeholder="Prix unitaire \u20ac" style="' + INP + '">';
      zone.appendChild(r);
    };
    const cadEntrante = (ENTRANTE && Array.isArray(ENTRANTE.cadences)) ? ENTRANTE.cadences : [];
    if (cadEntrante.length) {
      for (const c of cadEntrante) {
        ligneCadence();
        const r = zone.lastElementChild;
        if (c.date) r.querySelector('.fd-date').value = c.date;
        if (c.qte) r.querySelector('.fd-qte').value = c.qte;
        if (c.prix_unitaire || c.prix_unitaire === 0) r.querySelector('.fd-prix').value = c.prix_unitaire;
      }
      cible.insertAdjacentHTML('afterbegin', '<div class="why">\u26a0 Cadences pr\u00e9-remplies depuis le mail : v\u00e9rifier chaque date, quantit\u00e9 et prix contre le PDF client.</div>');
    } else ligneCadence();
    cible.querySelector('[data-cadence-plus]').addEventListener('click', ligneCadence);
    cible.querySelector('[data-creer-devis]').addEventListener('click', function () {
      const cadences = Array.from(zone.children).map(r => ({
        date: r.querySelector('.fd-date').value,
        qte: parseFloat(r.querySelector('.fd-qte').value),
        prix: parseFloat(r.querySelector('.fd-prix').value)
      })).filter(c => c.date || c.qte || c.prix);
      agir(this, 'commande-creer-devis', {
        produit_id: parseInt(this.dataset.creerDevis, 10),
        ref_projet: cible.querySelector('.fd-ref').value.trim() || null,
        cadences: cadences,
        num_commande_client: (ENTRANTE && ENTRANTE.num_commande_client) || null,
        entrante_id: (ENTRANTE && ENTRANTE.id) || null
      }, r => { const e = ENTRANTE; ENTRANTE = null; chargerEntrantes();
        return 'Devis ' + r.so_numero + ' cr\u00e9\u00e9 (' + r.cadences + ' cadence(s), ' + r.total + ' \u20ac)' +
          (e ? ', entrante trait\u00e9e et fil Gmail \u00e9tiquet\u00e9 \u00ab Commande \u00bb' : '') + ' \u2014 \u00e0 v\u00e9rifier et envoyer dans Odoo.'; });
    });
  }

  /* une seule etape active : les boutons des etapes en attente sont desactives */
  fr.querySelectorAll('.et.wait button, .et.wait input').forEach(b => { b.disabled = true; });

  /* branchements */
  const lc = fr.querySelector('#lien-changer');
  if (lc) { lc.addEventListener('click', () => fr.querySelector('#autres').classList.toggle('visible')); brancherChoixDevis(fr, ent); }
  if (conf && !(DIAG.applique && DIAG.applique.ok)) brancherEcritures(fr, conf, ent, etat(E.find(e => e.n === 6)) === 'active');

  z.querySelectorAll('[data-remplacer-tout]').forEach(b => b.addEventListener('click', async function () {
    const ids = this.dataset.remplacerTout.split(',').map(x => parseInt(x, 10)).filter(x => x > 0);
    const article = parseInt(this.dataset.article, 10);
    const texte = this.textContent;
    this.disabled = true;
    const bilans = [];
    for (let i = 0; i < ids.length; i++) {
      this.textContent = 'Ligne ' + (i + 1) + '/' + ids.length + '\u2026';
      try {
        const r = await appel('commande-remplacer-ligne', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ligne_id: ids[i], article_id: article }) });
        bilans.push(r.ok ? (r.apres.prix + ' \u20ac \u00d7 ' + r.apres.qte + (r.prix_conserve && r.qte_conservee ? ' \u2713' : ' ECART !')) : 'refus\u00e9e (' + (r.motif || '?') + ')');
      } catch (err) { bilans.push('sans r\u00e9ponse (' + err.message + ')'); }
    }
    el('etat').textContent = ids.length + ' ligne(s) trait\u00e9e(s) : ' + bilans.join(' \u00b7 ') + ' \u2014 relecture\u2026';
    el('etat').className = bilans.some(x => x.indexOf('ECART') >= 0 || x.indexOf('refus') >= 0 || x.indexOf('sans') >= 0) ? 'etat-msg err' : 'etat-msg';
    this.textContent = texte;
    diagnostiquer();
  }));
  z.querySelectorAll('[data-remplacer-ligne]').forEach(b => b.addEventListener('click', function () {
    agir(this, 'commande-remplacer-ligne', { ligne_id: parseInt(this.dataset.remplacerLigne, 10), article_id: parseInt(this.dataset.article, 10) },
      r => 'Ligne remplac\u00e9e sur ' + r.so + ' : \u00ab ' + r.apres.produit + ' \u00bb, prix ' + r.apres.prix + ' \u20ac ' + (r.prix_conserve ? 'conserv\u00e9 \u2713' : 'ECART !') + ', qt\u00e9 ' + r.apres.qte + (r.qte_conservee ? ' \u2713' : ' ECART !') + '.');
  }));
  z.querySelectorAll('[data-lier]').forEach(b => b.addEventListener('click', () => relier(b)));
  z.querySelectorAll('[data-creer-carte]').forEach(b => b.addEventListener('click', function () {
    const f = this.closest('.form-carte');
    agir(this, 'commande-creer-carte', {
      code_client: f.querySelector('.fc-code').value.trim(),
      ref_carte: f.querySelector('.fc-ref').value.trim(),
      indice: f.querySelector('.fc-indice').value.trim() || null,
      libelle: f.querySelector('.fc-libelle').value.trim() || null,
      nom_client: f.dataset.client || null
    }, r => 'Carte ' + r.cle_produit + ' cr\u00e9\u00e9e (#' + r.produit_id + ').');
  }));
  z.querySelectorAll('[data-creer-article]').forEach(b => b.addEventListener('click', function () {
    const champNom = this.parentElement.querySelector('.fa-nom');
    agir(this, 'commande-creer-article', { produit_id: parseInt(this.dataset.creerArticle, 10), nom: champNom ? champNom.value.trim() : null },
      r => 'Article \u00ab ' + r.article_nom + ' \u00bb cr\u00e9\u00e9 (#' + r.article_id + '), liens pos\u00e9s.');
  }));
  z.querySelectorAll('[data-projet-renommer]').forEach(b => b.addEventListener('click', function () {
    if (!confirm('Renommer ce projet en \u00ab ' + this.dataset.nom + ' \u00bb ?\nUne fois renomm\u00e9, la cha\u00eene le retrouvera seule \u00e0 chaque refab.')) return;
    agir(this, 'commande-projet', { action: 'renommer', projet_id: parseInt(this.dataset.projetRenommer, 10), nom_attendu: this.dataset.nom },
      r => 'Projet renomm\u00e9 : \u00ab ' + r.ancien_nom + ' \u00bb \u2192 \u00ab ' + r.nouveau_nom + ' \u00bb.');
  }));
  z.querySelectorAll('[data-projet-creer]').forEach(b => b.addEventListener('click', function () {
    agir(this, 'commande-projet', { action: 'creer', nom_attendu: this.dataset.nom, so_numero: this.dataset.so || null },
      r => 'Projet \u00ab ' + r.nom + ' \u00bb cr\u00e9\u00e9 (#' + r.projet_id + ')' + (r.etape_so ? ', \u00e9tape ' + r.etape_so : '') + '.');
  }));
  z.querySelectorAll('[data-choisir]').forEach(b => b.addEventListener('click', function () {
    z.querySelectorAll('[data-choisir]').forEach(x => { x.style.borderColor = ''; x.style.color = ''; });
    this.style.borderColor = 'var(--accent)'; this.style.color = 'var(--accent)';
    const note = this.parentElement.querySelector('.choix-note');
    const article = (DERNIER && DERNIER.rep.pieces.find(x => x.piece === 'article')) || {};
    if (article.article) { this.dataset.lier = this.dataset.choisir; if (note) note.textContent = ''; relier(this); }
    else if (note) note.textContent = 'Choix retenu : ' + this.dataset.cle + ' \u2014 servira \u00e0 cr\u00e9er l\u2019article.';
  }));
  z.querySelectorAll('.copiable').forEach(c => c.addEventListener('click', function () {
    navigator.clipboard && navigator.clipboard.writeText(this.textContent);
    this.style.borderColor = 'var(--accent)';
  }));
  el('rapport').classList.add('visible');
  if (DIAG && DIAG.conf) el('rapport').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---- Action generique : POST garde, message, re-diagnostic --------------- */
async function agir(bouton, chemin, corps, messageOk) {
  const texte = bouton.textContent;
  bouton.disabled = true; bouton.textContent = 'En cours\u2026';
  try {
    const rep = await appel(chemin, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corps)
    });
    if (rep.ok) {
      MSG_PERSIST = messageOk(rep);
      el('etat').textContent = messageOk(rep) + ' Diagnostic relanc\u00e9\u2026';
      el('etat').className = 'etat-msg';
      diagnostiquer();
    } else {
      el('etat').textContent = 'Refus\u00e9 : ' + (rep.motif || 'motif inconnu') +
        (rep.existants ? ' (' + rep.existants.map(x => x.nom).join(', ') + ')' : '');
      el('etat').className = 'etat-msg err';
      bouton.disabled = false; bouton.textContent = texte;
    }
  } catch (err) {
    el('etat').textContent = 'L\u2019action n\u2019a pas r\u00e9pondu (' + err.message + ').';
    el('etat').className = 'etat-msg err';
    bouton.disabled = false; bouton.textContent = texte;
  }
}

/* ---- Relier article <-> carte (endpoint commande-lier) ---------------- */
async function relier(bouton) {
  bouton.disabled = true; bouton.textContent = 'Rapprochement\u2026';
  try {
    const artV = (DERNIER && DERNIER.rep.pieces.find(x => x.piece === 'article')) || {};
    const rep = await appel('commande-lier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ produit_id: parseInt(bouton.dataset.lier, 10),
                             article_id: artV.article ? artV.article.id : null })
    });
    if (rep.ok) { MSG_PERSIST = 'Li\u00e9 : ' + rep.article_nom + ' \u2192 carte ' + rep.pp_produit_id + '.'; el('etat').textContent = MSG_PERSIST + ' Diagnostic relanc\u00e9\u2026'; el('etat').className = 'etat-msg'; diagnostiquer(); }
    else { el('etat').textContent = 'Refus\u00e9 : ' + (rep.motif || 'motif inconnu'); el('etat').className = 'etat-msg err'; bouton.disabled = false; bouton.textContent = 'Relier maintenant'; }
  } catch (err) {
    el('etat').textContent = 'Le rapprochement n\u2019a pas r\u00e9pondu (' + err.message + ').'; el('etat').className = 'etat-msg err';
    bouton.disabled = false; bouton.textContent = 'Relier maintenant';
  }
}
</script>

<button id="sig-btn" onclick="ouvrirSignalement()" title="Signaler un bug, une analyse fausse ou une idée">
  <i class="ti ti-message-report"></i> Signaler</button>

<div id="sig-fond" class="hidden">
  <div id="sig-boite">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="margin:0"><i class="ti ti-message-report"></i> Signaler</h2>
      <button class="btn-ann" onclick="fermerSignalement()">✕</button>
    </div>
    <p style="font-size:11.5px;color:var(--text2,#94a3b8);margin:0 0 12px">
      L'appli et sa version partent automatiquement avec votre message.</p>

    <div class="sig-t" id="sig-types">
      <button data-t="bug" class="on" onclick="sigType('bug')">Bug</button>
      <button data-t="analyse" onclick="sigType('analyse')">Analyse fausse</button>
      <button data-t="idee" onclick="sigType('idee')">Idée</button>
    </div>

    <label class="f">Votre nom</label>
    <input class="f" id="sig-auteur" placeholder="pour qu'on puisse revenir vers vous">

    <label class="f">Ce que vous avez constaté</label>
    <textarea class="f" id="sig-desc" rows="6" placeholder="Sur une analyse fausse, précisez la valeur attendue et où vous l'avez lue."></textarea>

    <div id="sig-msg" style="font-size:12px;margin-top:2px"></div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:13px">
      <button class="btn-ann" onclick="fermerSignalement()">Annuler</button>
      <button class="btn-env" id="sig-env" onclick="envoyerSignalement()">Envoyer</button>
    </div>
  </div>
</div>

<script>
/* ---------- signalement : module commun (chantier 72) ----------
   Auto-suffisant : URL de production en dur, l'en-tete X-PP-Auth est pose par
   l'intercepteur d'acces commun. Le contexte minimal (appli, version) part
   automatiquement. Destination : Data Table n8n + table Supabase signalements
   (lue par Claude) + mail immediat. */
(function(){
  var URL_SIG = 'https://protoprocess.app.n8n.cloud/webhook/v2-signalement';
  var CLE_SIGNALEUR = 'pp_signaleur';
  var SIG_TYPE = 'bug';
  var APPLI = 'commande';

  window.sigType = function(t){
    SIG_TYPE = t;
    document.querySelectorAll('#sig-types button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); });
  };
  window.ouvrirSignalement = function(){
    try{ document.getElementById('sig-auteur').value = localStorage.getItem(CLE_SIGNALEUR) || ''; }catch(e){}
    document.getElementById('sig-msg').textContent = '';
    document.getElementById('sig-fond').classList.remove('hidden');
    document.getElementById('sig-desc').focus();
  };
  window.fermerSignalement = function(){ document.getElementById('sig-fond').classList.add('hidden'); };
  window.envoyerSignalement = function(){
    var desc = document.getElementById('sig-desc').value.trim();
    var msg = document.getElementById('sig-msg');
    if(!desc){ msg.innerHTML = '<span style="color:#f09595">Décrivez ce que vous avez constaté.</span>'; return; }
    var auteur = document.getElementById('sig-auteur').value.trim();
    try{ if(auteur) localStorage.setItem(CLE_SIGNALEUR, auteur); }catch(e){}
    var btn = document.getElementById('sig-env');
    btn.disabled = true;
    msg.innerHTML = '<span style="color:var(--text2,#94a3b8)">Envoi…</span>';
    fetch(URL_SIG, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        type: SIG_TYPE, description: desc, auteur: auteur,
        appli: APPLI, version: (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '')
      })
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      msg.innerHTML = '<span style="color:#86c564">Merci, c\'est envoyé.</span>';
      document.getElementById('sig-desc').value = '';
      setTimeout(window.fermerSignalement, 1400);
    }).catch(function(e){
      msg.innerHTML = '<span style="color:#f09595">Envoi impossible : ' + String(e.message).replace(/[<>&]/g,'') + '. Réessayez ou prévenez Olivier.</span>';
    }).then(function(){ btn.disabled = false; });
  };
})();
</script>

</body>
</html>
