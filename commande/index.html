<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande</title>
<style>
:root {
  --bg:#0a0c12; --surface:#1a2030; --surface2:#161b27; --border:#262e42; --border2:#333d55;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  --accent:#F07B1F; --accent-bg:#2a1f10;
  --green:#86c564; --green-bg:#EAF3DE; --green-badge:#3B6D11;
  --amber:#eab676; --amber-bg:#FAEEDA; --amber-badge:#854F0B;
  --red:#f09595;   --red-bg:#FCEBEB;   --red-badge:#A32D2D;
  --radius:6px; --radius-lg:10px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13.5px; line-height:1.55; }
header { background:#0f1117; height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; position:sticky; top:0; z-index:5; }
.logo-text { display:flex; align-items:center; gap:0; font-size:13px; font-weight:500; }
.logo-text .lt { color:#fff; } .logo-text .ls { color:#444; margin:0 3px; } .logo-text .lo { color:var(--accent); }
.ver { color:var(--text3); font-size:11px; font-family:var(--mono); }
.wrap { max-width:min(96vw,900px); margin:0 auto; padding:26px 16px 70px; }

/* ---- Saisie ---- */
.saisie { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; }
.saisie label { display:block; color:var(--text2); font-size:12px; margin-bottom:7px; }
.ligne { display:flex; gap:8px; }
input[type=text] { flex:1; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius);
  color:var(--text); font-size:14px; padding:9px 12px; font-family:var(--mono); }
input[type=text]:focus { outline:none; border-color:var(--accent); }
.btn-p { padding:9px 16px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
  font-size:13px; font-weight:500; cursor:pointer; }
.btn-p:disabled { opacity:.5; cursor:default; }
.btn-s { padding:5px 11px; background:transparent; color:var(--text2); border:0.5px solid var(--border);
  border-radius:var(--radius); font-size:12px; cursor:pointer; }
.detecte { margin-top:8px; font-size:12px; color:var(--text3); min-height:16px; }
.detecte b { color:var(--accent); font-weight:600; }

/* ---- Code d'acces ---- */
.acces { margin-top:12px; display:none; }
.acces.visible { display:block; }
.acces p { margin:0 0 8px; color:var(--amber); font-size:12.5px; }

/* ---- Rapport ---- */
.rapport { margin-top:22px; display:none; }
.rapport.visible { display:block; }
.rapport h2 { font-size:13px; color:var(--text2); font-weight:500; margin:0 0 10px; text-transform:uppercase; letter-spacing:.05em; }
.piece { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 15px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
.piece.ok   { box-shadow:inset 3px 0 0 var(--green-badge); }
.piece.warn { box-shadow:inset 3px 0 0 var(--amber-badge); }
.piece.err  { box-shadow:inset 3px 0 0 var(--red-badge); }
.piece.mute { box-shadow:inset 3px 0 0 var(--border2); }
.p-nom { flex:none; width:88px; color:var(--text2); font-size:12px; padding-top:2px; }
.p-corps { flex:1; min-width:0; }
.badge { display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 9px;
  letter-spacing:.03em; text-transform:uppercase; }
.badge-ok   { background:var(--green-bg); color:var(--green-badge); }
.badge-warn { background:var(--amber-bg); color:var(--amber-badge); }
.badge-err  { background:var(--red-bg);   color:var(--red-badge); }
.badge-mute { background:var(--surface2); color:var(--text3); border:1px solid var(--border); }
.p-detail { margin-top:5px; color:var(--text2); font-size:12.5px; overflow-wrap:anywhere; }
.p-detail a { color:var(--accent); text-decoration:none; }
.p-detail a:hover { text-decoration:underline; }
.p-detail code { font-family:var(--mono); font-size:11.5px; background:var(--surface2);
  border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.p-actions { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.copiable { cursor:pointer; }
.etat-msg { margin-top:14px; font-size:12.5px; }
.etat-msg.err { color:var(--red); }
.etat-msg.chargement { color:var(--text2); }
.spin { display:inline-block; width:11px; height:11px; border:2px solid var(--border2);
  border-top-color:var(--accent); border-radius:50%; animation:r .8s linear infinite; vertical-align:-1px; margin-right:6px; }
@keyframes r { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
</style>
</head>
<body>
<header>
  <img src="../shared/picto-pp.png" alt="Proto Process" width="24" height="24"
       style="object-fit:contain" onerror="this.style.display='none'">
  <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo">Commande</span></span>
  <span class="ver" id="ver"></span>
</header>

<div class="wrap">
  <div class="saisie">
    <label for="entree">Numéro de commande (SO…) ou produit (clé, référence ou libellé)</label>
    <div class="ligne">
      <input type="text" id="entree" placeholder="SO2608-434 ou CLI277-1300078240" autocomplete="off">
      <button class="btn-p" id="btn-diag">Diagnostiquer</button>
    </div>
    <div class="detecte" id="detecte"></div>
    <div class="acces" id="acces">
      <p>Code d'accès Proto Process requis (le même que FabStory).</p>
      <div class="ligne">
        <input type="text" id="code" placeholder="Code d'accès">
        <button class="btn-p" id="btn-code">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="etat-msg" id="etat"></div>

  <div class="rapport" id="rapport">
    <h2>Les 5 pièces de l'affaire</h2>
    <div id="pieces"></div>
  </div>
</div>

<script>
/* ============================================================ COMMANDE ==== */
const APP_VERSION = "2.1";
const APP_DATE = "10/08/2026";
document.title = "Commande v" + APP_VERSION;
document.getElementById('ver').textContent = "v" + APP_VERSION + " \u2014 " + APP_DATE;

const KEY = 'pp_access_code', HDR = 'X-PP-Auth';
const API = 'https://protoprocess.app.n8n.cloud/webhook/';
function code()      { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function setCode(v)  { try { localStorage.setItem(KEY, v); } catch (e) {} }
function delCode()   { try { localStorage.removeItem(KEY); } catch (e) {} }
const el = id => document.getElementById(id);

/* Detection SO / produit : un numero SOxxxx-xxx est une commande, le reste un produit. */
function analyser(txt) {
  const t = String(txt || '').trim();
  if (!t) return null;
  if (/^SO[\d-]+$/i.test(t)) return { mode: 'so', valeur: t.toUpperCase() };
  return { mode: 'produit', valeur: t };
}
el('entree').addEventListener('input', function () {
  const a = analyser(this.value);
  el('detecte').innerHTML = !a ? '' :
    (a.mode === 'so' ? 'Entr\u00e9e reconnue : <b>commande</b> \u2014 diagnostic du SO existant'
                     : 'Entr\u00e9e reconnue : <b>produit</b> \u2014 parcours refab');
});
el('entree').addEventListener('keydown', e => { if (e.key === 'Enter') diagnostiquer(); });
el('btn-diag').addEventListener('click', diagnostiquer);
el('btn-code').addEventListener('click', function () {
  const v = el('code').value.trim();
  if (!v) return;
  setCode(v); el('acces').classList.remove('visible'); diagnostiquer();
});

async function appel(chemin, options) {
  const o = options || {};
  o.headers = Object.assign({}, o.headers, { [HDR]: code() });
  const r = await fetch(API + chemin, o);
  if (r.status === 401 || r.status === 403) { delCode(); throw new Error('ACCES'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let DERNIER = null;
async function diagnostiquer() {
  const a = analyser(el('entree').value);
  if (!a) { el('etat').textContent = 'Saisir un num\u00e9ro de commande ou un produit.'; el('etat').className = 'etat-msg err'; return; }
  if (!code()) { el('acces').classList.add('visible'); el('code').focus(); return; }
  el('btn-diag').disabled = true;
  el('etat').innerHTML = '<span class="spin"></span>Diagnostic en cours\u2026';
  el('etat').className = 'etat-msg chargement';
  el('rapport').classList.remove('visible');
  try {
    const q = (a.mode === 'so' ? 'so=' : 'produit=') + encodeURIComponent(a.valeur);
    const rep = await appel('commande-diagnostic?' + q);
    DERNIER = { entree: a, rep: rep };
    el('etat').textContent = '';
    afficher(rep);
  } catch (err) {
    if (err.message === 'ACCES') {
      el('etat').textContent = 'Code d\u2019acc\u00e8s refus\u00e9 \u2014 ressaisir.';
      el('etat').className = 'etat-msg err';
      el('acces').classList.add('visible'); el('code').focus();
    } else {
      el('etat').textContent = 'Le diagnostic n\u2019a pas r\u00e9pondu (' + err.message + '). R\u00e9essayer, et si \u00e7a persiste v\u00e9rifier n8n.';
      el('etat').className = 'etat-msg err';
    }
  }
  el('btn-diag').disabled = false;
}

/* ---- Rendu des 5 pieces ---------------------------------------------- */
const NOMS = { so: 'Commande', article: 'Article', carte: 'Carte FabStory', liens: 'Liens', projet: 'Projet Odoo' };
const ech = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function classeEtBadge(p) {
  const v = p.verdict;
  if (['trouve', 'present', 'existe', 'existe_hors_so', 'poses'].includes(v))
    return { cl: p.alerte ? 'warn' : 'ok', badge: p.alerte ? 'badge-warn' : 'badge-ok', lib: { trouve: 'trouv\u00e9', present: 'pr\u00e9sent', existe: 'existe', existe_hors_so: 'existe', poses: 'pos\u00e9s' }[v] };
  if (['a_poser', 'a_creer', 'introuvable', 'attend_la_carte', 'plusieurs'].includes(v))
    return { cl: v === 'plusieurs' ? 'err' : 'warn', badge: v === 'plusieurs' ? 'badge-err' : 'badge-warn',
             lib: { a_poser: '\u00e0 poser', a_creer: '\u00e0 cr\u00e9er', introuvable: 'introuvable', attend_la_carte: 'attend la carte', plusieurs: 'plusieurs' }[v] };
  return { cl: 'mute', badge: 'badge-mute', lib: v === 'non_demande' ? 'sans objet' : v };
}

function afficher(rep) {
  if (!rep || !rep.pieces) { el('etat').textContent = 'R\u00e9ponse illisible.'; el('etat').className = 'etat-msg err'; return; }
  const z = el('pieces'); z.innerHTML = '';
  for (const p of rep.pieces) {
    const m = classeEtBadge(p);
    let d = '', actions = '';
    if (p.piece === 'so') {
      if (p.verdict === 'trouve') {
        d = ech(p.so) + ' \u2014 \u00e9tat <code>' + ech(p.etat) + '</code>' +
            (p.code_client ? ' \u00b7 ' + ech(p.code_client) : '') +
            (p.ref_projet ? ' \u00b7 ' + ech(p.ref_projet) : '');
        if (p.alerte) d += '<br>\u26a0 ' + ech(p.alerte);
      } else d = ech(p.detail || '');
    }
    if (p.piece === 'article') {
      const carteP = rep.pieces.find(x => x.piece === 'carte') || {};
      if (p.article) d = ech(p.article.nom) + ' <code>#' + p.article.id + '</code>' +
        (p.verdict === 'existe_hors_so' ? ' \u2014 existe, pas encore sur ce SO' : '');
      else if (p.verdict === 'plusieurs') d = 'Arbitrage requis : ' + p.candidats.map(c => ech(c.nom)).join(' / ');
      else {
        d = 'Aucun article r\u00e9el.';
        if (carteP.verdict === 'existe') {
          actions = '<div style="display:flex;gap:6px;width:100%;max-width:560px;flex-wrap:wrap;align-items:center">' +
            '<input type="text" class="fa-nom" value="' + ech(carteP.carte.cle_produit + (carteP.carte.indice ? ' ' + carteP.carte.indice : '')) + '" ' +
            'style="flex:1;min-width:260px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12.5px">' +
            '<button class="btn-p" data-creer-article="' + carteP.carte.id + '">Cr\u00e9er l\u2019article</button>' +
            '<span style="color:var(--text3);font-size:12px;width:100%">nom \u00e9ditable \u2014 doit commencer par ' + ech(carteP.carte.cle_produit) + ' \u00b7 cat\u00e9gorie Protos \u00b7 liens pos\u00e9s d\u2019office</span></div>';
        } else d += ' Cr\u00e9er d\u2019abord la carte ci-dessous.';
      }
      if (p.ligne_prototype) {
        const soP = rep.pieces.find(x => x.piece === 'so') || {};
        d += '<br>\u26a0 ' + p.ligne_prototype.nb + ' ligne(s) \u00ab Prototype \u00bb sur le devis.';
        if (p.article && soP.confirmable) {
          const tout = p.ligne_prototype.lignes.map(l => l.id).join(',');
          actions = (actions || '') +
            (p.ligne_prototype.lignes.length > 1 ?
              '<button class="btn-p" data-remplacer-tout="' + tout + '" data-article="' + p.article.id + '">Remplacer les ' + p.ligne_prototype.lignes.length + ' lignes</button>' : '') +
            p.ligne_prototype.lignes.map(l =>
            '<button class="btn-s" data-remplacer-ligne="' + l.id + '" data-article="' + p.article.id + '">' +
            'Remplacer la ligne ' + ech(l.prix) + ' \u20ac \u00d7 ' + ech(l.qte) + '</button>').join('') +
            '<span style="color:var(--text3);font-size:12px;width:100%">prix, quantit\u00e9 et date conserv\u00e9s \u2014 preuve avant/apr\u00e8s au retour, ligne par ligne</span>';
        } else if (p.article && !soP.confirmable) {
          d += ' SO confirm\u00e9 : remplacement verrouill\u00e9 (des livraisons existent derri\u00e8re) \u2014 geste manuel dans Odoo si vraiment n\u00e9cessaire.';
        } else {
          d += ' Cr\u00e9er l\u2019article d\u2019abord, les boutons de remplacement appara\u00eetront.';
        }
      }
    }
    if (p.piece === 'carte') {
      if (p.verdict === 'existe') d = ech(p.carte.cle_produit) + (p.carte.indice ? ' <code>indice ' + ech(p.carte.indice) + '</code>' : '') + (p.carte.libelle_carte ? ' \u00b7 ' + ech(p.carte.libelle_carte) : '') +
        ' \u2014 <a href="' + ech(p.url) + '" target="_blank" rel="noopener">ouvrir la carte</a>';
      else if (p.verdict === 'plusieurs') {
        d = 'Plusieurs cartes candidates \u2014 choisir la bonne :';
        actions = p.candidats.map(c =>
          '<button class="btn-s" data-choisir="' + c.id + '" data-cle="' + ech(c.cle_produit) + '">' +
          ech(c.cle_produit) + (c.libelle_carte ? ' \u00b7 ' + ech(c.libelle_carte) : '') + '</button>').join('') +
          '<span class="choix-note" style="color:var(--text3);font-size:12px"></span>';
      }
      else {
        if (p.proposition) {
          const pr = p.proposition;
          d = 'Aucune carte \u2014 proposition pr\u00e9-remplie depuis le SO, <b>\u00e0 v\u00e9rifier</b> (la carte porte la r\u00e9f FAMILLE, l\u2019indice \u00e0 part) :';
          actions = '<div class="form-carte" data-client="' + ech(pr.nom_client || '') + '" style="display:grid;grid-template-columns:110px 1fr 90px;gap:6px;width:100%;max-width:560px">' +
            '<input type="text" class="fc-code" value="' + ech(pr.code_client) + '" placeholder="CLIxxx" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12.5px">' +
            '<input type="text" class="fc-ref" value="' + ech(pr.ref_carte) + '" placeholder="R\u00e9f famille (sans indice)" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12.5px">' +
            '<input type="text" class="fc-indice" value="' + ech(pr.indice) + '" placeholder="Indice" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12.5px">' +
            '<input type="text" class="fc-libelle" value="" placeholder="Libell\u00e9 (optionnel)" style="grid-column:1/3;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-size:12.5px">' +
            '<button class="btn-p" data-creer-carte="1">Cr\u00e9er la carte</button></div>';
        } else {
          d = 'Aucune carte pour ce produit.';
          actions = '<a class="btn-p" style="text-decoration:none;display:inline-block" ' +
            'href="https://protoprocess.github.io/commercial/fabstory/" target="_blank" rel="noopener">Cr\u00e9er la carte dans FabStory</a>' +
            '<span style="color:var(--text3);font-size:12px">puis relancer le diagnostic</span>';
        }
      }
    }
    if (p.piece === 'liens') {
      if (p.verdict === 'poses') d = 'PP Produit ID <code>' + ech(p.pp_produit_id) + '</code>' +
        (p.fabstory ? ' \u00b7 <a href="' + ech(p.fabstory) + '" target="_blank" rel="noopener">lien FabStory sur l\u2019article</a>' : '');
      else if (p.verdict === 'a_poser') {
        d = 'L\u2019article et la carte existent mais ne sont pas reli\u00e9s.';
        const pid = (p.action || '').match(/produit_id=(\d+)/);
        if (pid) actions = '<button class="btn-p" data-lier="' + pid[1] + '">Relier maintenant</button>';
      }
      else d = ech(p.detail || 'En attente des pi\u00e8ces pr\u00e9c\u00e9dentes.');
    }
    if (p.piece === 'projet') {
      if (p.verdict === 'trouve') d = ech(p.projet.name) + ' <code>#' + p.projet.id + '</code> \u2014 la colonne A du Planning pointera dessus';
      else if (p.verdict === 'plusieurs') d = 'Plusieurs projets au nom attendu : ' + p.candidats.map(c => ech(c.name)).join(' / ') + ' \u2014 \u00e0 trancher \u00e0 la main dans Odoo';
      else if (p.verdict === 'candidats') {
        d = ech(p.detail || '') + '<br>Nom attendu : <code>' + ech(p.nom_attendu) + '</code>';
        actions = p.candidats.map(c =>
          '<button class="btn-s" data-projet-renommer="' + c.id + '" data-nom="' + ech(p.nom_attendu) + '">Renommer \u00ab ' + ech(c.name) + ' \u00bb</button>').join('') +
          '<button class="btn-s" data-projet-creer="1" data-nom="' + ech(p.nom_attendu) + '" data-so="' + ech(p.so_numero || '') + '">Aucun : cr\u00e9er le projet</button>';
      }
      else if (p.verdict === 'introuvable') {
        d = ech(p.detail || '') + '<br>Nom attendu : <code class="copiable" title="Cliquer pour copier">' + ech(p.nom_attendu) + '</code>';
        actions = '<button class="btn-p" data-projet-creer="1" data-nom="' + ech(p.nom_attendu) + '" data-so="' + ech(p.so_numero || '') + '">Cr\u00e9er le projet</button>' +
          (p.so_numero ? '<span style="color:var(--text3);font-size:12px">avec l\u2019\u00e9tape ' + ech(p.so_numero) + '</span>' : '');
      }
      else d = ech(p.detail || '');
    }
    const carte = document.createElement('div');
    carte.className = 'piece ' + m.cl;
    carte.innerHTML = '<div class="p-nom">' + NOMS[p.piece] + '</div>' +
      '<div class="p-corps"><span class="badge ' + m.badge + '">' + ech(m.lib) + '</span>' +
      (d ? '<div class="p-detail">' + d + '</div>' : '') +
      (actions ? '<div class="p-actions">' + actions + '</div>' : '') + '</div>';
    z.appendChild(carte);
  }
  // Entree par produit, tout est en place -> proposer le devis refab
  const soP0 = rep.pieces.find(x => x.piece === 'so') || {};
  const artP0 = rep.pieces.find(x => x.piece === 'article') || {};
  const carteP0 = rep.pieces.find(x => x.piece === 'carte') || {};
  if (soP0.verdict === 'non_demande' && artP0.article && carteP0.verdict === 'existe') {
    const refDef = (carteP0.carte.ref_carte || '') + (carteP0.carte.indice ? ' ' + carteP0.carte.indice : '');
    const bloc = document.createElement('div');
    bloc.className = 'piece warn';
    bloc.innerHTML = '<div class="p-nom">Devis refab</div><div class="p-corps">' +
      '<span class="badge badge-warn">\u00e0 cr\u00e9er</span>' +
      '<div class="p-detail">Article ' + ech(artP0.article.nom) + ' \u00b7 une ligne par cadence \u00b7 jamais de PP-0001 \u00b7 na\u00eet brouillon, envoi et confirmation dans Odoo.</div>' +
      '<div class="p-actions" style="flex-direction:column;align-items:stretch;max-width:560px">' +
      '<input type="text" class="fd-ref" value="' + ech(refDef) + '" placeholder="R\u00e9f projet (colonne F)" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-size:12.5px">' +
      '<div class="fd-cadences"></div>' +
      '<div style="display:flex;gap:8px"><button class="btn-s" data-cadence-plus="1">+ cadence</button>' +
      '<button class="btn-p" data-creer-devis="' + carteP0.carte.id + '">Cr\u00e9er le devis brouillon</button></div></div></div>';
    z.appendChild(bloc);
    const zone = bloc.querySelector('.fd-cadences');
    const ligneCadence = () => {
      const r = document.createElement('div');
      r.style.cssText = 'display:grid;grid-template-columns:150px 1fr 1fr;gap:6px;margin-bottom:6px';
      r.innerHTML = '<input type="date" class="fd-date" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:6px 8px;font-size:12.5px;color-scheme:dark">' +
        '<input type="number" class="fd-qte" min="1" placeholder="Quantit\u00e9" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:6px 10px;font-size:12.5px">' +
        '<input type="number" class="fd-prix" min="0" step="0.01" placeholder="Prix unitaire \u20ac" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:6px 10px;font-size:12.5px">';
      zone.appendChild(r);
    };
    ligneCadence();
    bloc.querySelector('[data-cadence-plus]').addEventListener('click', ligneCadence);
    bloc.querySelector('[data-creer-devis]').addEventListener('click', function () {
      const cadences = Array.from(zone.children).map(r => ({
        date: r.querySelector('.fd-date').value,
        qte: parseFloat(r.querySelector('.fd-qte').value),
        prix: parseFloat(r.querySelector('.fd-prix').value)
      })).filter(c => c.date || c.qte || c.prix);
      agir(this, 'commande-creer-devis', {
        produit_id: parseInt(this.dataset.creerDevis, 10),
        ref_projet: bloc.querySelector('.fd-ref').value.trim() || null,
        cadences: cadences
      }, r => 'Devis ' + r.so_numero + ' cr\u00e9\u00e9 (' + r.cadences + ' cadence(s), ' + r.total + ' \u20ac) \u2014 \u00e0 v\u00e9rifier et envoyer dans Odoo.');
    });
  }
  z.querySelectorAll('[data-remplacer-tout]').forEach(b => b.addEventListener('click', async function () {
    const ids = this.dataset.remplacerTout.split(',').map(x => parseInt(x, 10)).filter(x => x > 0);
    const article = parseInt(this.dataset.article, 10);
    const texte = this.textContent;
    this.disabled = true;
    const bilans = [];
    for (let i = 0; i < ids.length; i++) {
      this.textContent = 'Ligne ' + (i + 1) + '/' + ids.length + '\u2026';
      try {
        const r = await appel('commande-remplacer-ligne', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ligne_id: ids[i], article_id: article })
        });
        bilans.push(r.ok ? (r.apres.prix + ' \u20ac \u00d7 ' + r.apres.qte + (r.prix_conserve && r.qte_conservee ? ' \u2713' : ' ECART !')) : 'refus\u00e9e (' + (r.motif || '?') + ')');
      } catch (err) { bilans.push('sans r\u00e9ponse (' + err.message + ')'); }
    }
    el('etat').textContent = ids.length + ' ligne(s) trait\u00e9e(s) : ' + bilans.join(' \u00b7 ') + ' \u2014 diagnostic relanc\u00e9\u2026';
    el('etat').className = bilans.some(x => x.indexOf('ECART') >= 0 || x.indexOf('refus') >= 0 || x.indexOf('sans') >= 0) ? 'etat-msg err' : 'etat-msg';
    this.textContent = texte;
    diagnostiquer();
  }));
  z.querySelectorAll('[data-remplacer-ligne]').forEach(b => b.addEventListener('click', function () {
    agir(this, 'commande-remplacer-ligne', { ligne_id: parseInt(this.dataset.remplacerLigne, 10), article_id: parseInt(this.dataset.article, 10) },
      r => 'Ligne remplac\u00e9e sur ' + r.so + ' : \u00ab ' + r.apres.produit + ' \u00bb, prix ' + r.apres.prix + ' \u20ac ' + (r.prix_conserve ? 'conserv\u00e9 \u2713' : 'ECART !') + ', qt\u00e9 ' + r.apres.qte + (r.qte_conservee ? ' \u2713' : ' ECART !') + '.');
  }));
  z.querySelectorAll('[data-lier]').forEach(b => b.addEventListener('click', () => relier(b)));
  z.querySelectorAll('[data-creer-carte]').forEach(b => b.addEventListener('click', function () {
    const f = this.closest('.form-carte');
    agir(this, 'commande-creer-carte', {
      code_client: f.querySelector('.fc-code').value.trim(),
      ref_carte: f.querySelector('.fc-ref').value.trim(),
      indice: f.querySelector('.fc-indice').value.trim() || null,
      libelle: f.querySelector('.fc-libelle').value.trim() || null,
      nom_client: f.dataset.client || null
    }, r => 'Carte ' + r.cle_produit + ' cr\u00e9\u00e9e (#' + r.produit_id + ').');
  }));
  z.querySelectorAll('[data-creer-article]').forEach(b => b.addEventListener('click', function () {
    const champNom = this.parentElement.querySelector('.fa-nom');
    agir(this, 'commande-creer-article', { produit_id: parseInt(this.dataset.creerArticle, 10), nom: champNom ? champNom.value.trim() : null },
      r => 'Article \u00ab ' + r.article_nom + ' \u00bb cr\u00e9\u00e9 (#' + r.article_id + '), liens pos\u00e9s.');
  }));
  z.querySelectorAll('[data-projet-renommer]').forEach(b => b.addEventListener('click', function () {
    if (!confirm('Renommer ce projet en \u00ab ' + this.dataset.nom + ' \u00bb ?\nUne fois renomm\u00e9, la cha\u00eene le retrouvera seule \u00e0 chaque refab.')) return;
    agir(this, 'commande-projet', { action: 'renommer', projet_id: parseInt(this.dataset.projetRenommer, 10), nom_attendu: this.dataset.nom },
      r => 'Projet renomm\u00e9 : \u00ab ' + r.ancien_nom + ' \u00bb \u2192 \u00ab ' + r.nouveau_nom + ' \u00bb.');
  }));
  z.querySelectorAll('[data-projet-creer]').forEach(b => b.addEventListener('click', function () {
    agir(this, 'commande-projet', { action: 'creer', nom_attendu: this.dataset.nom, so_numero: this.dataset.so || null },
      r => 'Projet \u00ab ' + r.nom + ' \u00bb cr\u00e9\u00e9 (#' + r.projet_id + ')' + (r.etape_so ? ', \u00e9tape ' + r.etape_so : '') + '.');
  }));
  z.querySelectorAll('[data-choisir]').forEach(b => b.addEventListener('click', function () {
    z.querySelectorAll('[data-choisir]').forEach(x => { x.style.borderColor = ''; x.style.color = ''; });
    this.style.borderColor = 'var(--accent)'; this.style.color = 'var(--accent)';
    const note = this.parentElement.querySelector('.choix-note');
    const article = (DERNIER && DERNIER.rep.pieces.find(x => x.piece === 'article')) || {};
    if (article.article) {
      // L'article existe : le choix permet de relier tout de suite.
      this.dataset.lier = this.dataset.choisir;
      if (note) note.textContent = '';
      relier(this);
    } else if (note) {
      note.textContent = 'Choix retenu : ' + this.dataset.cle + ' \u2014 servira \u00e0 cr\u00e9er l\u2019article (phase 2).';
    }
  }));
  z.querySelectorAll('.copiable').forEach(c => c.addEventListener('click', function () {
    navigator.clipboard && navigator.clipboard.writeText(this.textContent);
    this.style.borderColor = 'var(--accent)';
  }));
  el('rapport').classList.add('visible');
}

/* ---- Action generique : POST garde, message, re-diagnostic --------------- */
async function agir(bouton, chemin, corps, messageOk) {
  const texte = bouton.textContent;
  bouton.disabled = true; bouton.textContent = 'En cours\u2026';
  try {
    const rep = await appel(chemin, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corps)
    });
    if (rep.ok) {
      el('etat').textContent = messageOk(rep) + ' Diagnostic relanc\u00e9\u2026';
      el('etat').className = 'etat-msg';
      diagnostiquer();
    } else {
      el('etat').textContent = 'Refus\u00e9 : ' + (rep.motif || 'motif inconnu') +
        (rep.existants ? ' (' + rep.existants.map(x => x.nom).join(', ') + ')' : '');
      el('etat').className = 'etat-msg err';
      bouton.disabled = false; bouton.textContent = texte;
    }
  } catch (err) {
    el('etat').textContent = 'L\u2019action n\u2019a pas r\u00e9pondu (' + err.message + ').';
    el('etat').className = 'etat-msg err';
    bouton.disabled = false; bouton.textContent = texte;
  }
}

/* ---- Relier article <-> carte (endpoint commande-lier) ---------------- */
async function relier(bouton) {
  bouton.disabled = true; bouton.textContent = 'Rapprochement\u2026';
  try {
    const rep = await appel('commande-lier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ produit_id: parseInt(bouton.dataset.lier, 10) })
    });
    if (rep.ok) { el('etat').textContent = 'Li\u00e9 : ' + rep.article_nom + ' \u2192 carte ' + rep.pp_produit_id + '. Diagnostic relanc\u00e9\u2026'; el('etat').className = 'etat-msg'; diagnostiquer(); }
    else { el('etat').textContent = 'Refus\u00e9 : ' + (rep.motif || 'motif inconnu'); el('etat').className = 'etat-msg err'; bouton.disabled = false; bouton.textContent = 'Relier maintenant'; }
  } catch (err) {
    el('etat').textContent = 'Le rapprochement n\u2019a pas r\u00e9pondu (' + err.message + ').'; el('etat').className = 'etat-msg err';
    bouton.disabled = false; bouton.textContent = 'Relier maintenant';
  }
}
</script>
