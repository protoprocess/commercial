<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande</title>
<style>
:root {
  --bg:#0a0c12; --surface:#1a2030; --surface2:#161b27; --border:#262e42; --border2:#333d55;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  --accent:#F07B1F; --accent-bg:#2a1f10;
  --green:#86c564; --green-bg:#EAF3DE; --green-badge:#3B6D11;
  --amber:#eab676; --amber-bg:#FAEEDA; --amber-badge:#854F0B;
  --red:#f09595;   --red-bg:#FCEBEB;   --red-badge:#A32D2D;
  --radius:6px; --radius-lg:10px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13.5px; line-height:1.55; }
header { background:#0f1117; height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; position:sticky; top:0; z-index:5; }
.logo-text { display:flex; align-items:center; gap:0; font-size:13px; font-weight:500; }
.logo-text .lt { color:#fff; } .logo-text .ls { color:#444; margin:0 3px; } .logo-text .lo { color:var(--accent); }
.ver { color:var(--text3); font-size:11px; font-family:var(--mono); }
.wrap { max-width:min(96vw,900px); margin:0 auto; padding:26px 16px 70px; }

/* ---- Saisie ---- */
.saisie { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; }
.saisie label { display:block; color:var(--text2); font-size:12px; margin-bottom:7px; }
.ligne { display:flex; gap:8px; }
input[type=text] { flex:1; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius);
  color:var(--text); font-size:14px; padding:9px 12px; font-family:var(--mono); }
input[type=text]:focus { outline:none; border-color:var(--accent); }
.btn-p { padding:9px 16px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
  font-size:13px; font-weight:500; cursor:pointer; }
.btn-p:disabled { opacity:.5; cursor:default; }
.btn-s { padding:5px 11px; background:transparent; color:var(--text2); border:0.5px solid var(--border);
  border-radius:var(--radius); font-size:12px; cursor:pointer; }
.detecte { margin-top:8px; font-size:12px; color:var(--text3); min-height:16px; }
.detecte b { color:var(--accent); font-weight:600; }

/* ---- Code d'acces ---- */
.acces { margin-top:12px; display:none; }
.acces.visible { display:block; }
.acces p { margin:0 0 8px; color:var(--amber); font-size:12.5px; }

/* ---- Rapport ---- */
.rapport { margin-top:22px; display:none; }
.rapport.visible { display:block; }
.rapport h2 { font-size:13px; color:var(--text2); font-weight:500; margin:0 0 10px; text-transform:uppercase; letter-spacing:.05em; }
.piece { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 15px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
.piece.ok   { box-shadow:inset 3px 0 0 var(--green-badge); }
.piece.warn { box-shadow:inset 3px 0 0 var(--amber-badge); }
.piece.err  { box-shadow:inset 3px 0 0 var(--red-badge); }
.piece.mute { box-shadow:inset 3px 0 0 var(--border2); }
.p-nom { flex:none; width:88px; color:var(--text2); font-size:12px; padding-top:2px; }
.p-corps { flex:1; min-width:0; }
.badge { display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 9px;
  letter-spacing:.03em; text-transform:uppercase; }
.badge-ok   { background:var(--green-bg); color:var(--green-badge); }
.badge-warn { background:var(--amber-bg); color:var(--amber-badge); }
.badge-err  { background:var(--red-bg);   color:var(--red-badge); }
.badge-mute { background:var(--surface2); color:var(--text3); border:1px solid var(--border); }
.p-detail { margin-top:5px; color:var(--text2); font-size:12.5px; overflow-wrap:anywhere; }
.p-detail a { color:var(--accent); text-decoration:none; }
.p-detail a:hover { text-decoration:underline; }
.p-detail code { font-family:var(--mono); font-size:11.5px; background:var(--surface2);
  border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.p-actions { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.copiable { cursor:pointer; }
.etat-msg { margin-top:14px; font-size:12.5px; }
.etat-msg.err { color:var(--red); }
.etat-msg.warn { color:var(--amber); }
.etat-msg.chargement { color:var(--text2); }
.spin { display:inline-block; width:11px; height:11px; border:2px solid var(--border2);
  border-top-color:var(--accent); border-radius:50%; animation:r .8s linear infinite; vertical-align:-1px; margin-right:6px; }
@keyframes r { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
/* ---- Diagnostic commande (v5.0, 01/09) : une ligne = un fait + une ecriture ---- */
.hdr-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.btn-accueil { padding:5px 11px; background:transparent; color:var(--text2); border:0.5px solid var(--border2); border-radius:var(--radius); font-size:12px; cursor:pointer; font-family:inherit; }
.btn-accueil:hover { color:var(--accent); border-color:var(--accent); }
.diag { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 16px; margin-top:16px; }
.diag-tete { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.diag-tete b { color:var(--text); }
.diag-tete .sp { flex:1; }
.dl { display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
.dl .ic { flex:none; width:18px; text-align:center; font-family:var(--mono); font-weight:700; }
.dl .ic.ok { color:var(--green); } .dl .ic.warn { color:var(--amber); } .dl .ic.err { color:var(--red); } .dl .ic.mute { color:var(--text3); }
.dl input[type=checkbox] { flex:none; width:15px; height:15px; accent-color:var(--accent); margin:0 1px; cursor:pointer; }
.dl .lib { flex:none; width:150px; color:var(--text2); }
.dl .val { flex:1; min-width:0; overflow-wrap:anywhere; }
.dl .val code { font-family:var(--mono); font-size:11.5px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.dl .det { flex:none; max-width:42%; color:var(--text3); font-size:12px; text-align:right; }
.dl .det.err { color:var(--red); }
.dl input[type=date] { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius); color:var(--text); padding:3px 6px; font-family:var(--mono); font-size:12px; color-scheme:dark; }
.dl.off { opacity:.5; }
.diag-pied { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px; }
.diag-pied .msg { font-size:12px; color:var(--text3); }
.autres { display:none; border-bottom:1px solid var(--border); }
.autres.visible { display:block; }
.autres .dl { border-bottom:none; padding:4px 0; }
.lien { color:var(--accent); cursor:pointer; font-size:12px; text-decoration:none; }
.lien:hover { text-decoration:underline; }
.journal { margin-top:8px; }
.journal .dl { border-bottom:none; padding:3px 0; }
.aide { cursor:help; border-bottom:1px dotted var(--text3); }

/* ---- Feuille de route (v6.0) ---- */
.fr { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:6px 16px 10px; }
.fr .diag-tete { padding:8px 0; }
.et { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
.et:last-child { border-bottom:none; }
.et .num { flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:700; border:1.5px solid var(--border2); color:var(--text3); }
.et.done .num { background:var(--green-bg); color:var(--green-badge); border-color:transparent; }
.et.active .num { background:var(--accent); color:#fff; border-color:transparent; }
.et.wait { opacity:.5; }
.et .lib { flex:none; width:170px; color:var(--text2); font-size:12.5px; padding-top:4px; }
.et.active .lib { color:var(--text); font-weight:500; }
.et .corps { flex:1; min-width:0; font-size:12.5px; padding-top:4px; overflow-wrap:anywhere; }
.et .corps a { color:var(--accent); text-decoration:none; }
.et .corps code { font-family:var(--mono); font-size:11.5px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.et .corps .p-actions { margin-top:6px; }
.et .why { color:var(--text3); font-size:12px; }
.et .corps .dl { padding:5px 0; }
.et .corps .dl .lib { width:130px; padding-top:0; }

/* ---- Déroulé (v7.0, 08/09/2026) : une étape à la fois, les faites repliées ---- */
.prog { display:flex; gap:6px; align-items:center; padding:10px 0 2px; flex-wrap:wrap; }
.prog .pt { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:700; border:1.5px solid var(--border2); color:var(--text3); }
.prog .pt.done { background:var(--green-bg); color:var(--green-badge); border-color:transparent; cursor:pointer; }
.prog .pt.active { background:var(--accent); color:#fff; border-color:transparent; }
.prog .pt.libre { border-style:dashed; }
.prog .sep { flex:none; width:12px; height:1px; background:var(--border2); }
.prog .txt { margin-left:8px; color:var(--text2); font-size:12.5px; }
.fr.deroule .et.wait { display:none; }
.fr.deroule .et.done, .fr.deroule .et.repli { padding:6px 0; align-items:center; }
.fr.deroule .et.done .lib, .fr.deroule .et.repli .lib { padding-top:0; }
.fr.deroule .et.done .corps, .fr.deroule .et.repli .corps { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text3); padding-top:0; cursor:pointer; }
.fr.deroule .et.done .corps .p-actions, .fr.deroule .et.repli .corps .p-actions,
.fr.deroule .et.done .corps .dl, .fr.deroule .et.repli .corps .dl { display:none; }
.fr.deroule .et.ouvert .corps { white-space:normal; overflow:visible; color:var(--text2); cursor:default; }
.fr.deroule .et.ouvert .corps .p-actions, .fr.deroule .et.ouvert .corps .dl { display:flex; }
.fr.deroule .et.focus { border:1px solid var(--accent); border-radius:var(--radius-lg); background:var(--surface2); padding:14px 16px 12px; margin:10px 0 6px; flex-direction:column; gap:6px; }
.fr.deroule .et.focus .num { display:none; }
.fr.deroule .et.focus .lib { width:auto; font-size:14px; color:var(--text); font-weight:600; padding-top:0; }
.fr.deroule .et.focus .corps { font-size:13px; width:100%; padding-top:0; }
.msg-etape { display:block; margin:0 0 8px; font-size:12.5px; }
.msg-etape:empty { display:none; }
.msg-etape.err { color:var(--red); } .msg-etape.warn { color:var(--amber); } .msg-etape.ok { color:var(--green); } .msg-etape.chargement { color:var(--text2); }
/* ---- Étape 6 (v7.1, 08/09/2026) : trois blocs lisibles ---- */
.bloc6 h4 { margin:12px 0 2px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); font-weight:600; display:flex; gap:8px; align-items:baseline; }
.bloc6 h4 .why { text-transform:none; letter-spacing:0; font-weight:400; }
.ec { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
.ec input[type=checkbox] { flex:none; width:15px; height:15px; accent-color:var(--accent); margin:2px 1px 0; cursor:pointer; }
.ec .lib { flex:none; width:150px; color:var(--text2); padding-top:1px; }
.ec .val { flex:1; min-width:0; overflow-wrap:anywhere; }
.ec .val .why { display:block; }
.ec .val .err { color:var(--red); }
.ec .val ul { margin:4px 0 0; padding-left:18px; } .ec .val ul li { margin:1px 0; }
.ec .val code { font-family:var(--mono); font-size:11.5px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.ec .val input[type=date] { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius); color:var(--text); padding:3px 6px; font-family:var(--mono); font-size:12px; color-scheme:dark; }
.ec .lien { flex:none; padding-top:1px; }
.ec.off { opacity:.55; }
.ecw { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:0 12px; margin-bottom:8px; }
.ecw.decoche { opacity:.5; }
.ecw .ec { border-bottom:none; padding:9px 0; }
.subs { display:none; margin:0 0 10px 26px; padding:5px 12px; background:var(--bg); border-left:3px solid var(--accent); border-radius:0; }
.subs.visible { display:block; }
.dl.sub { display:none; padding:4px 0; border-bottom:none; }
.dl.sub.visible { display:flex; }
.cst { display:flex; gap:10px; align-items:flex-start; padding:8px 12px; margin-bottom:8px; background:var(--surface2); border:1px solid var(--border); border-left:3px solid var(--red-badge); border-radius:0; font-size:12.5px; }
.cst.warn-b { border-left-color:var(--amber-badge); }
.cst .ic { flex:none; width:18px; text-align:center; font-weight:700; padding-top:1px; }
.cst .ic.err { color:var(--red); } .cst .ic.warn { color:var(--amber); }
.cst .val { flex:1; min-width:0; overflow-wrap:anywhere; } .cst .val .why { display:block; }
.cst.vu { opacity:.4; } .cst.vu .val { text-decoration:line-through; }
.cst label { flex:none; color:var(--text3); font-size:12px; display:flex; gap:4px; align-items:center; cursor:pointer; padding-top:1px; }
.cst label input { accent-color:var(--accent); margin:0; }
.conf-ok { color:var(--text3); font-size:12.5px; padding:8px 0 2px; cursor:pointer; }
.conf-ok ul { margin:4px 0 0; padding-left:18px; display:none; } .conf-ok.ouvert ul { display:block; }
.recmd { border:1px solid var(--red-badge); border-radius:var(--radius-lg); padding:12px 14px; margin:8px 0; background:var(--surface2); font-size:13px; }
.recmd b { color:var(--red); }
.recmd code { font-family:var(--mono); font-size:11.5px; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
.fr.deroule .et.done .corps .bloc6, .fr.deroule .et.repli .corps .bloc6 { display:none; }
.fr.deroule .et.ouvert .corps .bloc6 { display:block; }
</style>

<style>
/* signalement : bouton flottant, module commun (chantier 72) */
#sig-btn{position:fixed;right:18px;bottom:18px;z-index:60;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:22px;background:var(--surface,#1a2030);color:var(--text2,#94a3b8);border:1px solid var(--border2,#333d55);box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;font-size:12px;font-family:inherit}
#sig-btn:hover{color:var(--blue,#F07B1F);border-color:var(--blue,#F07B1F)}
#sig-fond{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
#sig-fond.hidden{display:none}
#sig-boite{background:var(--surface,#1a2030);border:1px solid var(--border2,#333d55);border-radius:10px;width:min(94vw,560px);max-height:90vh;overflow:auto;padding:18px;color:var(--text,#e2e8f0);font-size:13px}
#sig-boite h2{font-size:15px}
.sig-t{display:flex;gap:6px;margin:0 0 11px;flex-wrap:wrap}
.sig-t button{flex:1;min-width:120px;padding:8px 10px;border-radius:6px;background:transparent;color:var(--text2,#94a3b8);border:1px solid var(--border,#262e42);font-size:12px;cursor:pointer;font-family:inherit}
.sig-t button.on{background:var(--blue,#F07B1F);color:#fff;border-color:transparent;font-weight:500}
#sig-boite label.f{display:block;font-size:11.5px;color:var(--text2,#94a3b8);margin:0 0 4px}
#sig-boite input.f,#sig-boite textarea.f{width:100%;box-sizing:border-box;background:var(--surface2,#161b27);color:var(--text,#e2e8f0);border:1px solid var(--border,#262e42);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;margin-bottom:10px}
#sig-boite .btn-ann{padding:6px 13px;background:transparent;color:var(--text2,#94a3b8);border:1px solid var(--border,#262e42);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
#sig-boite .btn-env{padding:6px 13px;background:var(--blue,#F07B1F);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<header>
  <img src="../shared/picto-pp.png" alt="Proto Process" width="24" height="24"
       style="object-fit:contain" onerror="this.style.display='none'">
  <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo">Commande</span></span>
  <span class="ver" id="ver"></span>
  <span class="hdr-right"><button class="btn-accueil" id="btn-accueil" title="Retour à la liste des commandes entrantes">← Accueil</button></span>
</header>

<div class="wrap">
  <div class="saisie">
    <label for="entree">Numéro de commande (SO…) ou produit (clé, référence ou libellé)</label>
    <div class="ligne">
      <input type="text" id="entree" placeholder="SO2608-434 ou CLI277-1300078240" autocomplete="off">
      <button class="btn-p" id="btn-diag">Diagnostiquer</button>
    </div>
    <div class="detecte" id="detecte"></div>
    <div class="acces" id="acces">
      <p>Code d'accès Proto Process requis (le même que FabStory).</p>
      <div class="ligne">
        <input type="text" id="code" placeholder="Code d'accès">
        <button class="btn-p" id="btn-code">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="entrantes"></div>

  <div id="confrontation"></div>

  <div class="etat-msg" id="etat"></div>

  <div class="rapport" id="rapport">
    <h2>Feuille de route</h2>
    <div id="pieces"></div>
  </div>
</div>

<script>
/* ============================================================ COMMANDE ==== */
const APP_VERSION = "7.5";
const APP_DATE = "08/09/2026";
document.title = "Commande v" + APP_VERSION;
document.getElementById('ver').textContent = "v" + APP_VERSION + " \u2014 " + APP_DATE;

const KEY = 'pp_access_code', HDR = 'X-PP-Auth';
const API = 'https://protoprocess.app.n8n.cloud/webhook/';
function code()      { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function setCode(v)  { try { localStorage.setItem(KEY, v); } catch (e) {} }
function delCode()   { try { localStorage.removeItem(KEY); } catch (e) {} }
const el = id => document.getElementById(id);

/* Detection SO / produit : un numero SOxxxx-xxx est une commande, le reste un produit. */
function analyser(txt) {
  const t = String(txt || '').trim();
  if (!t) return null;
  if (/^SO[\d-]+$/i.test(t)) return { mode: 'so', valeur: t.toUpperCase() };
  return { mode: 'produit', valeur: t };
}
el('entree').addEventListener('input', function () {
  const a = analyser(this.value);
  el('detecte').innerHTML = !a ? '' :
    (a.mode === 'so' ? 'Entr\u00e9e reconnue : <b>commande</b> \u2014 diagnostic du SO existant'
                     : 'Entr\u00e9e reconnue : <b>produit</b> \u2014 parcours refab');
});
el('entree').addEventListener('keydown', e => { if (e.key === 'Enter') diagnostiquer(); });
el('btn-diag').addEventListener('click', diagnostiquer);
el('btn-code').addEventListener('click', function () {
  const v = el('code').value.trim();
  if (!v) return;
  setCode(v); el('acces').classList.remove('visible'); diagnostiquer();
});

async function appel(chemin, options) {
  const o = options || {};
  o.headers = Object.assign({}, o.headers, { [HDR]: code() });
  const r = await fetch(API + chemin, o);
  if (r.status === 401 || r.status === 403) { delCode(); throw new Error('ACCES'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---- Proposition de carte deduite d'une commande entrante -------------
   Cas rencontre le 28/08 avec le PO EPFL : entree par PRODUIT (pas par SO),
   donc l'API ne fournit aucune proposition — elle ne sait la construire qu'a
   partir d'un SO existant. L'humain tombait alors sur un simple lien vers
   FabStory, formulaire vide, alors que le bon de commande venait de livrer
   de quoi le remplir.
   La cle attendue est CLIxxx-ref : on la decoupe depuis la reference lue dans
   le PO. Si le motif CLIxxx est absent, on laisse les champs vides plutot que
   d'inventer un code client — c'est l'humain qui tranche. */
function propositionDepuisEntrante() {
  if (!ENTRANTE) return null;
  const ref = String(ENTRANTE.ref_detectee || '').trim();
  if (!ref) return null;
  const m = ref.match(/^\s*(CLI\d+)\s*[-\u2013\u2014]?\s*(.*)$/i);
  return {
    code_client: m ? m[1].toUpperCase() : '',
    ref_carte: m ? (m[2] || '').trim() : ref,
    indice: ENTRANTE.indice_detecte || '',
    libelle: '',
    nom_client: ENTRANTE.client_detecte || ''
  };
}

let DERNIER = null;
let MSG_PERSIST = null; /* message de succes affiche APRES le re-diagnostic */
let ENTRANTE = null; /* commande entrante choisie, pour pre-remplir le devis */

/* ---- Commandes entrantes (mails etiquette "commande") ------------------ */

    z.querySelectorAll('[data-ouvrir-entrante]').forEach(b => b.addEventListener('click', function () {

chargerEntrantes();
/* ---- DIAGNOSTIC D UNE COMMANDE ENTRANTE (v5.0 → v6.0, 01/09/2026) ---------
   Une seule action : Diagnostiquer = chercher les devis ouverts du client,
   retenir le plus probable (meme montant, sinon le plus proche), confronter,
   puis lire les 5 pieces de l affaire. Le tout est rendu dans UNE feuille de
   route numerotee (v6.0, demande Olivier : l ordre des gestes doit etre
   evident, sinon « ca va merdouiller »). */
let DIAG = null; /* { ent, devisListe, note, so: {nom,id}, conf: reponse confronter, applique: journal } */

async function diagnostiquerEntrante(ent, bouton) {
  if (!ent) return;
  if (!code()) { el('acces').classList.add('visible'); el('code').focus(); return; }
  const z = el('confrontation');
  if (bouton) { bouton.disabled = true; bouton.textContent = 'Diagnostic\u2026'; }
  z.innerHTML = '<div class="etat-msg chargement"><span class="spin"></span>Recherche du devis et confrontation\u2026</div>';
  el('rapport').classList.remove('visible');
  /* v6.2 : une entrante RATTACHEE va droit a son devis (qui peut deja etre
     confirme, donc absent de la liste des devis ouverts). */
  if (ent.etat === 'rattachee' && ent.odoo_so_name) {
    DIAG = { ent: ent, devisListe: [], note: null, so: null, conf: null, applique: null };
    ENTRANTE = ent;
    if (bouton) { bouton.disabled = false; bouton.textContent = 'Diagnostiquer'; }
    await confronter(ent, ent.odoo_so_name);
    return;
  }
  let liste = null;
  try { liste = await appel('commande-devis-ouverts?entrante=' + encodeURIComponent(ent.id)); } catch (err) { liste = null; }
  DIAG = { ent: ent, devisListe: (liste && liste.ok) ? (liste.devis || []) : [], note: liste ? liste.note : null, so: null, conf: null, applique: null };
  ENTRANTE = ent;
  if (bouton) { bouton.disabled = false; bouton.textContent = 'Diagnostiquer'; }
  /* v6.4 : l appli PROPOSE, l humain TRANCHE (regle du 28/08). Le devis ne
     s ouvre seul que s il est CITE au bon de commande ou au centime pres ;
     sinon la liste des candidats, avec le bouton devis refab. Constate le
     01/09 : un lot HORIBA sans devis avait ete confronte au premier devis
     ouvert du client, une autre carte. */
  const premier = DIAG.devisListe[0] || null;
  /* v7.1 : un devis cite mais deja commande n est pas ouvert, il est signale. */
  /* v7.1c (retour Olivier) : un devis cite deja commande est quand meme OUVERT :
     sa feuille de route (carte, article, projet) est la meilleure source qui
     soit. Seule l etape 6 change : re-commande -> devis refab sur cette carte. */
  if (premier && (premier.cite_au_po || premier.meme_montant)) { await confronter(ent, premier.nom); return; }
  afficherChoixDevis(z, null);
}

/* Confronte l entrante a un devis, puis lance la lecture des 5 pieces sur ce
   devis : la feuille de route est rendue par afficher() avec les deux. */
async function confronter(ent, so) {
  const z = el('confrontation');
  z.innerHTML = '<div class="etat-msg chargement"><span class="spin"></span>Confrontation \u00e0 ' + ech(so) + '\u2026</div>';
  el('rapport').classList.remove('visible');
  try {
    const rep = await appel('commande-confronter?entrante=' + encodeURIComponent(ent.id) + '&so=' + encodeURIComponent(so));
    if (!rep || !rep.ok) { z.innerHTML = '<div class="etat-msg err">' + ech((rep && rep.motif) || 'R\u00e9ponse illisible.') + '</div>'; return; }
    DIAG.so = { nom: rep.devis.nom, id: rep.devis.id };
    DIAG.conf = rep;
    DIAG.applique = null;
    el('entree').value = rep.devis.nom;
    el('entree').dispatchEvent(new Event('input'));
    await diagnostiquer(true);
  } catch (err) {
    z.innerHTML = '<div class="etat-msg err">La confrontation n\u2019a pas r\u00e9pondu (' + ech(err.message) + ').</div>';
  }
}


/* ---- RE-COMMANDE (v7.1, 08/09/2026) ---------------------------------------
   Cas MHR CDE004285 : le client cite l ancien numero de devis (SO2603-138),
   deja confirme, deja livre, portant deja le PO precedent. L appli prenait la
   citation au pied de la lettre et ouvrait l etape 6 sur un SO clos.
   Regle : un devis cite qui est deja confirme, ou porte deja un AUTRE PO,
   n est pas une cible d ecriture, c est le signe d une re-commande -> on
   propose le devis refab (parcours produit, cadences du PO). Exceptions :
   le devis auquel l entrante est deja RATTACHEE (il se confirme ensuite), et
   un devis qui porte deja CE PO (deja traite). */
function estRecommande(d, ent) {
  if (!d || !ent) return false;
  const po = String(ent.num_commande_client || '').trim();
  const pose = String(d.po_deja_pose || '').trim();
  if (ent.etat === 'rattachee' && ent.odoo_so_name && d.nom === ent.odoo_so_name) return false;
  if (pose && po && pose === po) return false;
  if (pose && po && pose !== po) return true;
  if (d.etat && d.etat !== 'draft' && d.etat !== 'sent') return true;
  return false;
}
function htmlRecommande(d, ent) {
  /* v7.1b : la carte est retrouvee depuis le devis cite (article -> pont), pas
     depuis la reference lue au PO, qui est souvent le CODE ARTICLE DU CLIENT
     (MHR EL0N000098) et non une carte FabStory. Chercher ce code dans
     FabStory aurait propose de creer une carte en double. */
  const viaSO = !!(d && d.nom);
  return '<div class="recmd">\u26a0 <b>' + ech(d.nom) + ' est d\u00e9j\u00e0 command\u00e9</b> \u2014 \u00e9tat <code>' + ech(d.etat || '?') + '</code>' +
    (d.po_deja_pose ? ', bon de commande <code>' + ech(d.po_deja_pose) + '</code>' : '') + '.<br>' +
    'Le bon de commande <code>' + ech(ent.num_commande_client || '?') + '</code> est une <b>re-commande</b> : on ne r\u00e9\u00e9crit pas un devis clos, on en cr\u00e9e un nouveau.' +
    '<div class="p-actions">' +
    '<button class="btn-p" data-refab-entrante="1" data-so="' + ech(viaSO ? d.nom : '') + '">Cr\u00e9er le devis refab</button>' +
    '<span class="why">' + (viaSO ? 'sur la m\u00eame carte que ' + ech(d.nom) + (d.carte ? ' : <code>' + ech(d.carte) + '</code>' : ' (retrouv\u00e9e par l\u2019article)') : (ent.ref_detectee ? 'd\u2019apr\u00e8s la r\u00e9f lue au PO <code>' + ech(ent.ref_detectee) + '</code>' : 'aucune r\u00e9f\u00e9rence lue au PO')) +
    ' \u00b7 cadences pr\u00e9-remplies \u00b7 puis les \u00e9critures Odoo sur le nouveau devis</span></div></div>';
}
async function brancherRefab(z, ent) {
  z.querySelectorAll('[data-refab-entrante]').forEach(b => b.addEventListener('click', async function () {
    const soCite = this.dataset.so || '';
    const texte = this.textContent; this.disabled = true;
    let cle = null;
    /* la carte est deja sous les yeux : feuille de route du devis cite */
    try {
      if (DERNIER && DERNIER.rep && DERNIER.entree && DERNIER.entree.mode === 'so' && (!soCite || DERNIER.entree.valeur === soCite)) {
        const c = (DERNIER.rep.pieces || []).find(x => x.piece === 'carte');
        if (c && c.verdict === 'existe' && c.carte) cle = c.carte.cle_produit;
      }
    } catch (e) { cle = null; }
    if (!cle && soCite) {
      /* sinon : la carte du devis cite, par le pont */
      this.textContent = 'Lecture de la carte de ' + soCite + '\u2026';
      try {
        const r = await appel('commande-diagnostic?so=' + encodeURIComponent(soCite));
        const c = (r && r.pieces || []).find(x => x.piece === 'carte');
        if (c && c.verdict === 'existe' && c.carte) cle = c.carte.cle_produit;
        else if (c && c.verdict === 'plusieurs') { el('etat').textContent = 'Plusieurs cartes possibles derri\u00e8re ' + soCite + ' : saisir la cl\u00e9 de la bonne carte dans le champ du haut.'; el('etat').className = 'etat-msg warn'; this.disabled = false; this.textContent = texte; return; }
      } catch (e) { cle = null; }
    }
    if (!cle) cle = ent.ref_detectee || '';
    if (!cle) { el('etat').textContent = 'Aucune carte trouv\u00e9e : saisir la cl\u00e9 de la carte dans le champ du haut, puis Diagnostiquer.'; el('etat').className = 'etat-msg err'; this.disabled = false; this.textContent = texte; return; }
    ENTRANTE = ent; DIAG = null;
    el('confrontation').innerHTML = '';
    el('entree').value = cle;
    el('entree').dispatchEvent(new Event('input'));
    diagnostiquer();
  }));
}

/* Autres devis candidats + saisie manuelle. */
function htmlChoixDevis(exclure) {

  let h = '';

      '<span class="lib"><a class="lien" data-choisir-devis="' + ech(d.nom) + '">' + ech(d.nom) + '</a></span>' +
      '<span class="val">' + ech(d.date) + ' \u00b7 <b>' + ech(d.total_texte) + '</b>' + (d.projet ? ' \u00b7 ' + ech(d.projet) : '') +
      (d.cite_au_po ? ' <span style="color:var(--green)">cit\u00e9 au bon de commande</span>' : d.meme_ref ? ' <span style="color:var(--green)">m\u00eame r\u00e9f\u00e9rence</span>' : '') +
      (d.meme_montant ? ' <span style="color:var(--green)">m\u00eame montant</span>' : '') +
      (d.etat !== 'draft' && d.etat !== 'sent' ? ' <span style="color:var(--amber)">d\u00e9j\u00e0 ' + ech(d.etat) + '</span>' : '') +
      (d.po_deja_pose ? ' <span style="color:var(--amber)">porte d\u00e9j\u00e0 ' + ech(d.po_deja_pose) + '</span>' : '') + '</span></div>';
  }
  if (nbAutres) h += '<div class="dl" id="voir-autres-devis"><span class="ic mute">\u2026</span><span class="val"><a class="lien" data-voir-devis="1">+ ' + nbAutres + ' autre(s) devis ouvert(s) du client (autres cartes)</a></span></div>';
  h += '<div class="dl"><span class="ic mute">\u2026</span><span class="lib">Autre devis</span><span class="val" style="display:flex;gap:8px;align-items:center">' +

    '<button class="btn-s" id="conf-go">Diagnostiquer</button></span></div>';
  return h;
}
function brancherChoixDevis(z, ent) {
  z.querySelectorAll('[data-choisir-devis]').forEach(b => b.addEventListener('click', function () { confronter(ent, this.dataset.choisirDevis); }));
  const vd = z.querySelector('[data-voir-devis]');
  if (vd) vd.addEventListener('click', function () { z.querySelectorAll('.devis-autre').forEach(x => { x.style.display = ''; }); const l = z.querySelector('#voir-autres-devis'); if (l) l.style.display = 'none'; });
  const champ = z.querySelector('#conf-so'), go = z.querySelector('#conf-go');
  const lancer = () => { const v = (champ.value || '').trim(); if (v) confronter(ent, v); else champ.focus(); };
  if (champ) champ.addEventListener('keydown', e => { if (e.key === 'Enter') lancer(); });
  if (go) go.addEventListener('click', lancer);
}
function afficherChoixDevis(z, recommande) {
  const ent = DIAG.ent;
  const pertinents = DIAG.devisListe.filter(d => d.cite_au_po || d.meme_ref || d.meme_montant).length;
  const refabHtml = ent.ref_detectee ? '<div class="dl"><span class="ic ' + (pertinents ? 'mute' : 'ok') + '">+</span><span class="lib">Pas de devis</span><span class="val" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +

  const note = DIAG.note || (pertinents ? 'Plusieurs devis possibles sur cette r\u00e9f\u00e9rence : choisir.' : (DIAG.devisListe.length ? 'Aucun devis ouvert sur cette r\u00e9f\u00e9rence produit : cr\u00e9er un devis refab, ou saisir un num\u00e9ro.' : 'Aucun devis ouvert pour ce client : cr\u00e9er un devis refab, ou saisir un num\u00e9ro.'));
  z.innerHTML = '<div class="diag"><div class="diag-tete"><b>' + ech(ent.client_detecte || ent.expediteur || '?') + '</b>' +
    (ent.num_commande_client ? ' \u00b7 PO ' + ech(ent.num_commande_client) : '') +

       cadences du PO. */
    ENTRANTE = ent; DIAG = null;

/* ---- ETAPE 6 : les ecritures Odoo (confrontation) ------------------------
   v7.1 (08/09/2026, retour Olivier) : TROIS BLOCS NOMMES au lieu d une seule
   colonne ou se melangeaient ecritures (cases), choix (icones) et constats (!).
   Regle de lecture : UNE CASE = UNE ECRITURE, toujours. L adresse et les
   abonnes sont des ecritures, donc ils ont une case ; leur detail est replie
   derriere « changer ». Les exigences sont LUES, pas comptees. Les constats
   sont a part, en phrase, avec une case « vu » qui les estompe (DIAG.vus).
   Le conforme se replie. Aucun changement de logique : appliquer() lit les
   memes data-action / data-livraison / data-abonne qu avant. */
function htmlEcritures(rep) {
  const vide = '<span style="color:var(--text3)">\u2014</span>';
  const A = {}; (rep.actions || []).forEach(a => { A[a.cle] = a; });
  const vus = (DIAG && DIAG.vus) || {};
  const ligne = (cle, lib, val, opts) => {
    opts = opts || {};
    const a = A[cle] || {};
    const off = !!opts.off;
    return '<div class="ec' + (off ? ' off' : '') + '"><input type="checkbox" data-action="' + cle + '"' + (opts.coche ? ' checked' : '') + (off ? ' disabled' : '') + '>' +
      '<span class="lib">' + lib + '</span><span class="val">' + val + '</span>' + (opts.lien || '') + '</div>';
  };
  /* v7.4 : une ecriture = une carte fermee ; son detail deplie vit DEDANS,
     indente et sur fond --bg avec un lisere accent. Le vide entre cartes
     remplace les traits horizontaux, qui separaient avec la meme force une
     ecriture d une autre et une adresse de la suivante. */
  const carte = (interieur, sub) => '<div class="ecw">' + interieur + (sub || '') + '</div>';
  let h = '<div class="bloc6">';

  /* ---- A. ce qui sera ecrit ---- */
  h += '<h4>Ce qui sera \u00e9crit dans Odoo <span class="why">d\u00e9coche pour retenir une \u00e9criture</span></h4>';
  if (A.ref) {
    const a = A.ref;
    const conflit = a.grave;
    h += carte(ligne('ref', 'R\u00e9f. client', (a.valeur ? '<code>' + ech(a.valeur) + '</code>' : vide) +
      (conflit ? '<span class="why err">' + ech(a.detail) + '</span>' : (a.deja ? '<span class="why">d\u00e9j\u00e0 sur le devis</span>' : '')),
      { coche: a.coche, off: !a.ecriture }));
  }
  if (A.date) {
    const a = A.date;
    h += carte(ligne('date', 'Date de livraison', (a.valeur ? '<input type="date" data-date value="' + ech(a.valeur) + '">' : vide) +
      (a.detail ? '<span class="why' + (a.grave ? ' err' : '') + '">' + ech(a.detail) + '</span>' : ''), { coche: a.coche, off: !a.ecriture }));
  }
  if (A.livraison) {
    const a = A.livraison, L = a.liste || [];
    const choisi = L.find(c => a.choix === c.partner_id) || null;
    const resume = choisi ? ech(choisi.nom) + ' \u2014 ' + ech(choisi.adresse || 'sans adresse')
      : '<span class="err">Aucune adresse choisie : choisir le contact de livraison' + (a.po ? ' (le PO donne l\u2019adresse)' : '') + '.</span>';
    let sub = '';
    const tete = ligne('livraison', 'Livrer \u00e0', '<span data-resume="livraison">' + resume + '</span>' +
      (a.po ? '<span class="why">PO : ' + ech(a.po) + '</span>' : ''), { coche: !!choisi, off: !a.ecriture, lien: L.length ? '<a class="lien" data-changer="liv">changer \u25be</a>' : '' });
    L.forEach(c => {
      sub += '<div class="dl sub sub-liv' + (choisi ? '' : ' visible') + '"><input type="radio" name="livraison" data-livraison="' + c.partner_id + '"' + (a.choix === c.partner_id ? ' checked' : '') + ' style="accent-color:var(--accent);margin:0 1px;cursor:pointer">' +

function brancherEcritures(z, rep, ent, actif) {
  /* v7.4 : une carte dont l ecriture est decochee se grise en entier, pour que
     le compte du bouton se verifie a l oeil sans relire chaque case. */
  const majCartes = () => {
    z.querySelectorAll('[data-action]').forEach(c => {
      const w = c.closest('.ecw'); if (w) w.classList.toggle('decoche', !c.checked || c.disabled);
    });
  };
  const majBouton = () => {
    const n = z.querySelectorAll('[data-action]:checked:not(:disabled)').length;
    majCartes();
    const b = el('btn-appliquer'); if (!b) return;
    b.textContent = 'Appliquer dans Odoo' + (n ? ' (' + n + ')' : ''); b.disabled = !n || !actif;
  };
  z.querySelectorAll('[data-action]').forEach(c => c.addEventListener('change', majBouton));
  majBouton();
  /* changer : deplie / replie le detail */
  const bascule = (cls, lien) => {
    const rows = Array.from(z.querySelectorAll('.' + cls)).filter(r => !r.dataset.soc || r.classList.contains('visible'));
    const ouvert = rows.some(r => r.classList.contains('visible'));
    rows.forEach(r => r.classList.toggle('visible', !ouvert));
    const boite = rows.length ? rows[0].closest('.subs') : null;
    if (boite) boite.classList.toggle('visible', !ouvert);
    if (!ouvert) { const p = z.querySelector('[data-plus-soc]'); if (p && cls === 'sub-abo') p.classList.add('visible'); }
    lien.textContent = ouvert ? 'changer \u25be' : 'replier \u25b4';
  };
  z.querySelectorAll('[data-changer]').forEach(l => l.addEventListener('click', function () { bascule(this.dataset.changer === 'liv' ? 'sub-liv' : 'sub-abo', this); }));
  const vs = z.querySelector('[data-voir-societe]');
  if (vs) vs.addEventListener('click', function () { z.querySelectorAll('.soc-cache').forEach(x => x.classList.add('visible')); const p = z.querySelector('[data-plus-soc]'); if (p) p.classList.remove('visible'); });
  /* resumes vivants */
  const A = {}; (rep.actions || []).forEach(a => { A[a.cle] = a; });
  z.querySelectorAll('[data-livraison]').forEach(r => r.addEventListener('change', () => {
    const c = z.querySelector('[data-livraison]:checked'); const row = c ? c.closest('.dl') : null; const s = z.querySelector('[data-resume="livraison"]');
    if (s && row) s.innerHTML = ech(row.querySelector('.lib').textContent) + ' \u2014 ' + ech(row.querySelector('.val').textContent);
    const cb = z.querySelector('[data-action="livraison"]'); if (cb && c) { cb.checked = true; majBouton(); }
  }));
  z.querySelectorAll('[data-abonne]').forEach(c => c.addEventListener('change', () => {
    const noms = Array.from(z.querySelectorAll('[data-abonne]:checked')).map(x => ech(x.closest('.dl').querySelector('.lib').textContent.trim()));
    const s = z.querySelector('[data-resume="abonnes"]');
    if (s) s.innerHTML = (noms.length ? noms.join(' \u00b7 ') : '<span style="color:var(--text3)">aucun contact coch\u00e9</span>') + ' \u00b7 ' + (A.abonnes && A.abonnes.commercial ? ech(A.abonnes.commercial.nom) : '\u00c9quipe Commerciale') + ' <span style="color:var(--text3)">toujours</span>';
  }));
  /* constats : vu */
  z.querySelectorAll('[data-vu]').forEach(c => c.addEventListener('change', function () {
    if (DIAG) { DIAG.vus = DIAG.vus || {}; if (this.checked) DIAG.vus[this.dataset.vu] = true; else delete DIAG.vus[this.dataset.vu]; }
    this.closest('.cst').classList.toggle('vu', this.checked);
  }));
  const ok = z.querySelector('[data-conf-ok]');
  if (ok) ok.addEventListener('click', () => ok.classList.toggle('ouvert'));
  const b = el('btn-appliquer');
  if (b) b.addEventListener('click', () => appliquer(rep, ent));
}

/* Un seul appel groupe : l API pose tout, relit tout, et rend un journal. */
async function appliquer(rep, ent) {
  const z = el('pieces');
  const coche = c => { const x = z.querySelector('[data-action="' + c + '"]'); return !!(x && x.checked && !x.disabled); };
  const A = {}; (rep.actions || []).forEach(a => { A[a.cle] = a; });
  const dateChamp = z.querySelector('[data-date]');
  const ecritures = {
    ref: coche('ref') && A.ref ? (A.ref.valeur || null) : null,
    date: coche('date') && dateChamp && dateChamp.value ? dateChamp.value : null,
    livraison_id: (function () { if (!coche('livraison')) return null; const r = z.querySelector('[data-livraison]:checked'); return r ? parseInt(r.dataset.livraison, 10) : null; })(),
    /* v7.1 : case « Abonnes » decochee = on ne touche pas aux abonnes (pas de liste = pas de retrait). */
    abonnes: (coche('abonnes') && A.abonnes) ? (A.abonnes.liste || []).filter((c, i) => { const x = z.querySelector('[data-abonne="' + i + '"]'); return !!(x && x.checked); })
      .map(c => ({ partner_id: c.partner_id || null, email: c.email || null, nom: c.nom || null })) : undefined,
    commercial_id: (coche('abonnes') && A.abonnes && A.abonnes.commercial) ? A.abonnes.commercial.partner_id : null,
    exigences: coche('note') && A.note ? (A.note.liste || []) : [],
    piece_jointe: coche('pj')
  };
  const b = el('btn-appliquer'), m = el('diag-msg');
  b.disabled = true; b.textContent = '\u00c9criture en cours\u2026'; m.textContent = ''; m.style.color = '';
  try {
    const r = await appel('commande-rattacher', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ so_id: rep.devis.id, entrante_id: ent.id, ecritures: ecritures }) });
    if (r.ok) {
      DIAG.applique = r;
      chargerEntrantes();
      MSG_PERSIST = '\u00c9critures appliqu\u00e9es sur ' + (r.so || rep.devis.nom) + ' (' + r.nb_fait + ' relue(s) dans Odoo). Entrante rattach\u00e9e : elle dispara\u00eetra \u00e0 la confirmation du devis.';
      diagnostiquer();
    } else {
      afficherJournal(r, el('journal'));
      b.disabled = false; b.textContent = 'R\u00e9essayer';
      m.textContent = r.motif || 'Refus\u00e9.'; m.style.color = 'var(--red)';
      if (r.generiques && r.generiques.length) {
        m.textContent += ' \u2014 ' + r.generiques.map(g => 'ligne ' + g.ligne_id + ' : ' + (g.article || '?') + ' \u00d7' + g.qte).join(' ; ');
      }
    }
  } catch (err) {
    b.disabled = false; b.textContent = 'R\u00e9essayer';
    m.textContent = 'L\u2019\u00e9criture n\u2019a pas r\u00e9pondu (' + err.message + ').'; m.style.color = 'var(--red)';
  }
}
const LIB_JOURNAL = { ref: 'R\u00e9f. client', date: 'Date de livraison', livraison: 'Adresse de livraison', abonner: 'Contact achat', abonne: 'Abonn\u00e9', desabonnes: 'Retir\u00e9s des abonn\u00e9s', note: 'Note exigences', pj: 'Bon de commande' };
function htmlJournal(r) {
