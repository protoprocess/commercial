<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proto Process / FabStory</title>
<link rel="icon" type="image/png" href="../shared/picto-pp.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
/* ================================================================== FabStory
   v4.0 — chantier 111 (28/08) : SAISIE GUIDEE en 3 ecrans pilotee par la
   bibliotheque pb_soluce ; contexte deduit du statut Odoo ; photocopie
   enveloppe {choix, portee} ; initiales en liste memorisees ; Abandonner.
   v0.3 — retours 07/08 : volet toujours visible (tiroir), œil/œil barré,
   composant en tête d entrée, portee des regles (SO / carte / client), labels bleus.
   v0.2 — retours du contre-test Olivier 06/08 : volet lateral type boite mail
   (toutes les actions), reponses liees aux questions, visibilite explicite,
   pieces jointes, rangement metier/poles, promotion en regle client.
   Theme CLAIR dedie : l'orange agit (#F8952D), le bleu informe (#5BC4D8). */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f5;
  --border:#dde3ec; --border2:#c8d2e0;
  --text:#1c2430; --text2:#5b6b80; --text3:#8b98ab;
  --accent:#F8952D; --accent-fonce:#d97a15; --accent-bg:#FDF0E1;
  --info:#5BC4D8; --info-bg:#EAF7FA; --info-txt:#1B7A8F;
  --green:#4d9938; --green-bg:#EAF3DE; --green-badge:#3B6D11;
  --amber:#b07219; --amber-bg:#FAEEDA; --amber-badge:#854F0B;
  --red:#c04545;  --red-bg:#FCEBEB;  --red-badge:#A32D2D;
  --radius:6px; --radius-lg:12px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
header{background:#0f1117;height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:70}
.logo-text{display:flex;align-items:center;font-size:13px;font-weight:500}
.logo-text .lt{color:#fff}.logo-text .ls{color:#444;margin:0 3px}.logo-text .lo{color:var(--accent)}
#hdr-version{margin-left:auto;font-size:11px;color:#64748b}
.wrap{max-width:min(96vw,900px);margin:0 auto;padding:18px 14px 80px}
body.fiche-ouverte .wrap{max-width:min(96vw,1800px)}
.page{display:flex;gap:14px;align-items:flex-start}
.colonne-fil{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px}
h3{font-size:13px;margin:0 0 8px}
.hint{font-size:12.5px;color:var(--text2)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:9px 16px;font-size:13px;font-weight:500}
.btn:hover{background:var(--accent-fonce)}
.btn:disabled{opacity:.5;cursor:default}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:6px 11px;font-size:12.5px}
.btn-s:hover{border-color:var(--border2)}
.btn-danger{background:var(--red-bg);color:var(--red-badge);border:1px solid #e7bcbc;border-radius:var(--radius);padding:7px 13px;font-size:12.5px}
.btn-lien{background:none;border:none;color:var(--info-txt);font-size:12px;padding:2px 4px;text-decoration:underline}
input[type=text],textarea,input[type=date],input[type=file]{width:100%;background:#fff;border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:9px 11px;font-size:13.5px;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
/* ------------------------------------------------------------- ecran cartes */
.carte-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:#fff;cursor:pointer}
.carte-item:hover{border-color:var(--accent)}
.carte-item .ref{font-family:var(--mono);font-size:13px;font-weight:600}
.carte-item .lib{font-size:12.5px;color:var(--text2)}
.carte-item .cli{margin-left:auto;font-size:11.5px;color:var(--text3);white-space:nowrap}
/* -------------------------------------------------------------------- hero */
.hero{background:linear-gradient(180deg,#fff 0%,#fdf8f2 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px}
.hero-haut{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero-ref{font-family:var(--mono);font-size:18px;font-weight:700}
.hero-lib{display:block;width:100%;font-size:16px;font-weight:600;color:var(--text);margin-top:2px}
.hero-cli{font-size:12px;color:var(--text3);margin-left:auto}
.badge-indice{display:inline-flex;align-items:center;gap:5px;background:var(--info-bg);color:var(--info-txt);border:1px solid var(--info);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.badge-indice .plus{background:var(--info);color:#fff;border:none;border-radius:999px;width:19px;height:19px;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.statut-ligne{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.statut-nom{font-size:13.5px;font-weight:600}
.statut-motif{font-size:11.5px;color:var(--text3)}
.jalons{display:flex;gap:0;margin-top:10px}
.jalon{flex:1;text-align:center;position:relative}
.jalon .pt{width:14px;height:14px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);margin:0 auto 5px;position:relative;z-index:2}
.jalon.fait .pt{background:var(--green);border-color:var(--green)}
.jalon.actif .pt{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.jalon .lb{font-size:10.5px;color:var(--text3)}
.jalon.fait .lb,.jalon.actif .lb{color:var(--text);font-weight:500}
.jalon::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--border)}
.jalon:first-child::before{display:none}
.jalon.fait::before,.jalon.actif::before{background:var(--green)}
/* ------------------------------------------------------- regles + attente -- */
.regles-resume summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;align-items:center;gap:7px}
.regle-item{border-left:3px solid var(--info);background:var(--info-bg);border-radius:var(--radius);padding:8px 11px;margin-top:8px;font-size:12.5px}
.regle-item .dom{font-size:10.5px;font-weight:700;color:var(--info-txt);text-transform:uppercase}
.attente{border-left:3px solid var(--red)}
.attente h2 .ti{color:var(--red)}
/* ----------------------------------------------------------------- filtres -- */
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.filtre{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:12px;color:var(--text2)}
.btn-mail-client{background:#5BC4D8;border:1px solid #5BC4D8;color:#0a0c12;font-weight:600;font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer}
.btn-mail-client:hover{filter:brightness(1.08)}
.filtre.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* ----------------------------------------------------------------- timeline */
.tl-entree{border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:9px;background:#fff;cursor:pointer}
.tl-entree:hover{border-color:var(--border2)}
.tl-entree.choisie{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.tl-entree.indice-evt{background:var(--info-bg);border-color:var(--info)}
.tl-reponse{margin-left:26px;position:relative}
.tl-reponse::before{content:'\21b3';position:absolute;left:-19px;top:10px;color:var(--text3)}
.tl-tete{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.chip{display:inline-block;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px}
.chip.note{background:var(--surface2);color:var(--text2)}
.chip.question_client,.chip.reponse_client{background:var(--accent-bg);color:var(--accent-fonce)}
.chip.question_interne,.chip.reponse_interne{background:var(--amber-bg);color:var(--amber-badge)}
.chip.indice{background:var(--info-bg);color:var(--info-txt);border:1px solid var(--info)}
.chip.portee{background:var(--green-bg);color:var(--green-badge)}
.chip.modif{background:var(--surface2);color:var(--text3);font-weight:500}
.chip.attente-c{background:var(--red-bg);color:var(--red-badge)}
.chip.resolu-c{background:var(--green-bg);color:var(--green-badge)}
.chip.regle-c{background:var(--info-bg);color:var(--info-txt)}
.chip.vis-client{background:var(--info-bg);color:var(--info-txt)}
.chip.vis-interne{background:var(--surface2);color:var(--text3);font-weight:500}
.tl-meta{font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap}
.tl-texte{font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.tl-det{font-size:11.5px;color:var(--text2);font-family:var(--mono);margin-top:4px}
.tl-comp{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-bottom:5px}
.tl-comp .cl{color:var(--text2)}
.tl-comp .cv{color:var(--info-txt)}
.tl-src{font-size:11px;color:var(--text3);margin-top:5px}
label.lbl{font-size:12.5px;font-weight:600;color:var(--info-txt);display:block;margin:8px 0 4px}
.reps{margin:-3px 0 9px 26px}
.reps > summary{cursor:pointer;list-style:none;font-size:12px;color:var(--info-txt);margin-bottom:6px}
.reps > summary::before{content:'\21b3 '}
.dropzone{border:2px dashed var(--border2);border-radius:var(--radius);padding:14px;text-align:center;font-size:12.5px;color:var(--text2);cursor:pointer}
.dropzone.survol{border-color:var(--accent);background:var(--accent-bg)}
/* -------------------------------------------------------------------- volet */
.volet{width:clamp(420px,28vw,560px);flex:none;position:sticky;top:66px;max-height:calc(100vh - 82px);overflow:auto;display:none;background:transparent;border:none;padding:0}
#zone-attente:not(:empty){background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--radius-lg);padding:13px 14px;margin-bottom:14px}
#volet-detail:not(:empty){background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
body.avec-attente .volet,body.volet-ouvert .volet{display:block}
.att-titre{font-size:13px;font-weight:700;color:var(--red-badge);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.att-mini{border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--radius);padding:8px 10px;margin-bottom:7px;cursor:pointer;background:#fff}
.att-mini:hover{border-color:var(--accent)}
.att-mini.choisie{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.att-mini .am-comp{font-family:var(--mono);font-size:11.5px;font-weight:600;margin-bottom:2px}
.att-mini .am-comp .cl{color:var(--text2)}.att-mini .am-comp .cv{color:var(--info-txt)}
.att-mini .am-texte{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attente-strip{display:none;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:9px}
.attente-strip .att-mini{min-width:210px;max-width:260px;flex:none;margin-bottom:0}
.badge-lien{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);color:var(--info-txt);border:1px solid var(--border2);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
.badge-lien:hover{border-color:var(--info)}
#volet-detail h2{position:sticky;top:-16px;background:var(--surface);padding:6px 0;z-index:2;display:flex;align-items:center;gap:8px}
.volet-fermer{margin-left:auto;flex:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);font-size:18px;line-height:1;color:var(--text2);padding:3px 8px;cursor:pointer}
.volet-fermer:hover{border-color:var(--border2);color:var(--text)}
.volet section{border-top:1px solid var(--border);padding:11px 0}
.volet section > summary,.volet details > summary{cursor:pointer;font-size:12.5px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;color:var(--text2)}
.volet details{border-top:1px solid var(--border);padding:11px 0}
.volet details[open] > summary{margin-bottom:9px;color:var(--text)}
.volet details > summary::before{content:'+';font-weight:700;width:14px}
.volet details[open] > summary::before{content:'\2212'}
/* -------------------------------------------------------------------- saisie */
.pastilles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pastille{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--text2)}
.pastille.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-fonce);font-weight:600}
.pastille.p-info.on{background:var(--info-bg);border-color:var(--info);color:var(--info-txt)}
.amorces{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.amorce{background:#fff;border:1px dashed var(--border2);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--text2)}
.amorce:hover{border-color:var(--accent);color:var(--accent-fonce)}
.replis{margin-top:9px}
.replis[open] summary{margin-bottom:8px}
.replis summary{font-size:12px;color:var(--text2);cursor:pointer;list-style:none}
.replis summary::before{content:'+ '}
.replis[open] summary::before{content:'\2212 '}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.mini{font-size:11px;color:var(--text3);display:block;margin:6px 0 3px}
/* v2.0 chantier 136 : bandeau de notification. N apparait QUE s il reste des
   entrees non notifiees — rien ne part par une horloge, l envoi est un geste. */
.inter-groupe{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px 6px 8px;font-size:12.5px;color:var(--text2);cursor:pointer;font-family:inherit}
.inter-groupe:hover{border-color:var(--border2)}
.inter-groupe .ig-piste{width:30px;height:17px;border-radius:999px;background:var(--border2);position:relative;flex:none;transition:background .15s}
.inter-groupe .ig-bille{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.inter-groupe.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-fonce);font-weight:600}
.inter-groupe.on .ig-piste{background:var(--accent)}
.inter-groupe.on .ig-bille{left:15px}
.ligne-modele{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.badge-modele{display:inline-flex;align-items:center;gap:5px;background:var(--info-bg);color:var(--info-txt);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}
.choix-edit{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-top:6px}
.choix-edit .ce-item{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--border)}
.choix-edit .ce-item:last-of-type{border-bottom:none}
.choix-edit .ce-lib{font-size:12.5px;font-weight:600;color:var(--text)}
.choix-edit .ce-aide{font-size:11.5px;color:var(--text3)}
.choix-edit .ce-x{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 4px}
.liste-modeles .lm-item{border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;margin-bottom:7px;cursor:pointer}
.liste-modeles .lm-item:hover{border-color:var(--accent)}
.liste-modeles .lm-titre{font-size:13px;font-weight:600;color:var(--text)}
.liste-modeles .lm-apercu{font-size:11.5px;color:var(--text3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pastille-attente{display:inline-flex;align-items:center;gap:4px;margin-left:8px;background:var(--amber-bg);color:var(--amber-badge);border:1px solid var(--amber);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.bandeau-notif{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:14px}
.bandeau-notif .bn-txt{flex:1;min-width:200px;font-size:13px;color:var(--amber-badge)}
.bandeau-notif .bn-nb{font-weight:700}
.notif-recap{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.notif-recap .nr-pole{font-size:12.5px;font-weight:600;color:var(--accent-fonce)}
.notif-recap .nr-mails{font-size:11.5px;color:var(--text3);font-family:var(--mono);word-break:break-all}
.notif-recap .nr-item{font-size:12.5px;color:var(--text2);border-left:3px solid var(--border2);padding:2px 0 2px 8px;margin-top:6px}
.piece-ligne{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--radius);padding:6px 9px;margin-top:6px;font-size:12px}
.piece-ligne .ti{color:var(--text2)}
.ok-msg{color:var(--green);font-size:12.5px}
.err-msg{color:var(--red);font-size:12.5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
dialog{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;max-width:440px;width:92vw}
dialog::backdrop{background:rgba(20,26,36,.45)}
/* ----------------------------------------------------- saisie guidee v4.0 -- */
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;color:var(--text3);font-size:12px;font-weight:500}
.step .dot{width:21px;height:21px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--surface);font-family:var(--mono)}
.step.active{color:var(--text)}
.step.active .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done{color:var(--text2)}
.step.done .dot{background:var(--green-bg);color:var(--green-badge);border-color:var(--green-badge)}
.step-sep{flex:0 0 22px;height:1px;background:var(--border2)}
.groupe-titre{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:700;margin:13px 0 7px}
.situations{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
.situation{display:flex;flex-direction:column;gap:5px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;cursor:pointer;color:var(--text);font-family:inherit}
.situation:hover,.situation:focus-visible{border-color:var(--accent);outline:none}
.situation .st{font-size:13px;font-weight:600;line-height:1.35}
.situation .sd{font-size:12px;color:var(--text2);line-height:1.45}
.situation.libre{border-style:dashed}
.chips-situ{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.chip-situ{display:inline-block;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--text2)}
.chip-situ.mod{background:var(--accent-bg);color:var(--accent-fonce)}
.chip-situ.info{background:var(--info-bg);color:var(--info-txt)}
.as-rappel{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.auto-ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px dashed var(--info);border-radius:var(--radius);background:var(--info-bg);padding:8px 11px;margin-top:10px}
.auto-tag{font-size:11px;font-family:var(--mono);font-weight:600;color:var(--info-txt);border:1px solid var(--info);border-radius:999px;padding:2px 9px;background:#fff}
.auto-txt{font-size:11.5px;color:var(--info-txt)}
.specs-table{width:100%;border-collapse:collapse;margin-top:4px}
.specs-table td{border:1px solid var(--border);padding:0;font-size:12.5px}
.specs-table td:first-child{color:var(--text2);padding:6px 10px;width:42%;background:var(--surface2)}
.specs-table input{width:100%;background:transparent;border:none;border-radius:0;color:var(--text);padding:6px 10px;font-size:12.5px;font-family:inherit}
.specs-table input:focus{outline:1px solid var(--accent);outline-offset:-1px;border-color:transparent}

<!-- ===== ACCES PROTO PROCESS (identique aux autres applis, ne pas diverger) ===== -->
<script>
(function(){
  var KEY='pp_access_code', HDR='X-PP-Auth', HOST='protoprocess.app.n8n.cloud';
  function get(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function del(){try{localStorage.removeItem(KEY)}catch(e){}}
  var _f = window.fetch;
  window.fetch = function(input, init){
    var url='';
    try{url=(typeof input==='string')?input:((input&&input.url)||'')}catch(e){}
    if(url.indexOf(HOST)===-1){return _f.apply(this,arguments)}
    init=init||{};
    try{var h=new Headers(init.headers||{});h.set(HDR,get());init.headers=h}catch(e){}
    return _f.call(this,input,init).then(function(r){
      if(r&&(r.status===401||r.status===403)){del();demander("Code d'acces refuse. Ressaisissez-le.")}
      return r;
    });
  };
  var box=null;
  function construire(){
    if(box)return box;
    box=document.createElement('div');
    box.id='pp-gate';
    box.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#0a0c12;display:none;'
      +'align-items:center;justify-content:center;padding:20px;'
      +'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif';
    box.innerHTML=
      '<div style="background:#1a2030;border:1px solid #262e42;border-radius:10px;padding:26px;max-width:380px;width:100%">'
      +'<div style="font-size:13px;font-weight:500;margin-bottom:14px">'
      +'<span style="color:#fff">PROTO PROCESS</span><span style="color:#444;margin:0 3px">/</span>'
      +'<span style="color:#F8952D">Acces</span></div>'
      +'<div style="font-size:12.5px;color:#94a3b8;line-height:1.55;margin-bottom:16px">'
      +"Saisissez le code d'acces interne. Il ne vous sera demande qu'une fois sur cet appareil.</div>"
      +'<input id="pp-in" type="password" placeholder="Code d acces" autocomplete="off" '
      +'style="width:100%;background:#161b27;border:1px solid #262e42;border-radius:6px;color:#e2e8f0;'
      +'padding:9px 11px;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box">'
      +'<div id="pp-err" style="font-size:12px;color:#f09595;margin-top:9px;min-height:16px"></div>'
      +'<button id="pp-btn" style="width:100%;margin-top:12px;padding:9px;background:#F8952D;color:#fff;'
      +'border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">Valider</button>'
      +'</div>';
    document.body.appendChild(box);
    var inp=box.querySelector('#pp-in'),btn=box.querySelector('#pp-btn');
    btn.addEventListener('click',function(){
      var v=(inp.value||'').trim();
      if(!v){box.querySelector('#pp-err').textContent='Code requis.';return}
      set(v);inp.value='';box.style.display='none';location.reload();
    });
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){btn.click()}});
    return box;
  }
  function demander(msg){
    var b=construire();
    if(msg){b.querySelector('#pp-err').textContent=msg}
    b.style.display='flex';
    setTimeout(function(){var i=b.querySelector('#pp-in');if(i)i.focus()},50);
  }
  function pret(f){if(document.body){f()}else{document.addEventListener('DOMContentLoaded',f)}}
  pret(function(){if(!get()){demander('')}});
  window.__ppDemanderCode=demander;
})();
</script>

<script>
/* ============================================================== CONFIG ==== */
const APP_NAME = 'FabStory';
const APP_VERSION = '4.10';
const APP_DATE = '01/09/2026';
const BASE = 'https://protoprocess.app.n8n.cloud/webhook';

/* Metiers en avant dans la saisie et le volet (retour Olivier 06/08) */

  ['RECLAMATION', 'R\u00c9CLAMATION CLIENT']
];
const STATUTS = [
  { code:'devis',       libelle:'Devis' },
  { code:'preparation', libelle:'Pr\u00e9paration' },

];
const TYPES_LIBELLES = {
  note:'Information', question_client:'Question client', reponse_client:'R\u00e9ponse client',
  question_interne:'\u00c0 traiter', reponse_interne:'R\u00e9ponse interne', indice:'Indice'
};
const PORTEES_LIBELLES = { so:'Cette commande', carte:'Cette carte', client:'Ce client' };
const DOMAINES_REGLE = ['composants','production','pcb','livrables','identification','autre'];

/* ================================================================ ETAT ==== */
const SVG_OEIL = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:-2px"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';

/* Chantier 136 : \u00ab Qui est concern\u00e9 ? \u00bb = destinataires de la notification.
   concernes null = suit automatiquement le m\u00e9tier choisi (mapping identique a
   ref_etapes.pole_defaut en base) ; tableau = choix manuel de l utilisateur. */
const CONCERNES_LISTE = [['COMMERCIAL','Commercial / Achats'],['PRODUCTION','Production / M\u00e9thodes'],['QUALITE','Qualit\u00e9 (les deux)']];
function poleDefaut(c){
  if(['DEVIS','BOM','PCB','APPRO'].includes(c)) return 'COMMERCIAL';
  if(c === 'RECLAMATION') return 'QUALITE';
  return c ? 'PRODUCTION' : 'COMMERCIAL';
}
function concernesEffectifs(){ return saisie.concernes || [poleDefaut(saisie.etape)]; }
function rendreConcernes(){
  const z = document.getElementById('zone-concernes'); if(!z) return;
  const on = concernesEffectifs();
  z.innerHTML = CONCERNES_LISTE.map(c =>
    '<button class="pastille concerne' + (on.includes(c[0])?' on':'') + '" data-concerne="' + c[0] + '">' + c[1] + '</button>').join('') +
    (saisie.concernes ? '<span class="hint" style="align-self:center">choix manuel</span>' : '<span class="hint" style="align-self:center">propos\u00e9 selon l\u2019\u00e9tape</span>');
  const et = document.getElementById('etape-choisie');
  if(et){
    const l = (FICHE.etapes || []).find(x => x.code === saisie.etape);
    et.textContent = l ? ' \u2014 ' + l.libelle : '';
  }
  z.querySelectorAll('.pastille.concerne').forEach(b => b.onclick = () => {
    let cs = (saisie.concernes || concernesEffectifs()).slice();
    const v = b.dataset.concerne;
    if(cs.includes(v)) cs = cs.filter(x => x !== v); else cs.push(v);
    saisie.concernes = cs;
    rendreConcernes();
  });
}

function el(id){ return document.getElementById(id); }

  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
async function getJson(url){
  const r = await fetch(url);
  const j = await r.json().catch(()=>null);
  if(!r.ok || !j) throw new Error((j&&j.motif)||('HTTP '+r.status));
  return j;
}

  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corps)});
  const j = await r.json().catch(()=>null);
  if(!r.ok || !j || j.ok!==true) throw new Error((j&&j.motif)||('HTTP '+r.status));
  return j;
}

/* ======================================================== ECRAN CARTES ==== */
async function chargerCartes(){

    rendreCartes('');
    /* Le badge est un confort : s il echoue, la liste reste utilisable. */
    try{
      const a = await getJson(BASE + '/fabstory-attente');
      ATTENTE = (a && a.attente) || {};
      rendreCartes(filtreTxt);

function rendreCartes(filtreTxt){
  const z = el('ecran-cartes');
  const f = (filtreTxt||'').trim().toLowerCase();
  const liste = PRODUITS.filter(p => !f ||
    [p.cle_produit,p.ref_carte,p.libelle_carte,p.nom_client,p.code_client]
      .some(v => String(v||'').toLowerCase().includes(f)));

    '<button class="btn" style="margin-left:auto;padding:6px 13px;font-size:12.5px" onclick="FS.ouvrirCreation()">+ Nouvelle carte</button></h2>' +
    '<input type="text" id="cherche" placeholder="R\u00e9f\u00e9rence, libell\u00e9 ou client\u2026" value="' + esc(filtreTxt) + '" ' +
    'oninput="rendreCartesDiff(this.value)" style="margin-bottom:11px">';
  if(!liste.length){
    html += '<p class="hint" style="margin:0">Aucune carte ne correspond. Une carte appara\u00eet ici une fois cr\u00e9\u00e9e ' +
      'dans l\u2019analyse de devis ou l\u2019appli fiche de vie.</p>';

    html += liste.map(p =>
      '<div class="carte-item" onclick="ouvrirFiche(' + p.id + ')">' +

  }
  html += '</div>';
  z.innerHTML = html;
  const c = el('cherche');
  if(f){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
}

function rendreCartesDiff(v){ clearTimeout(_t); _t = setTimeout(()=>rendreCartes(v), 140); }

async function ouvrirFiche(id){
  P = PRODUITS.find(p => p.id === id) || { id: id };

  } else if(STATUT.erreur){
    inner = '<span class="statut-motif">Statut indisponible : ' + esc(STATUT.erreur) + '</span>';
  } else {
    const idx = STATUTS.findIndex(s => s.code === STATUT.statut);
    const jalons = STATUTS.map((s,i) => {
      const cls = i < idx ? 'fait' : (i === idx ? (s.code==='expediee'?'fait':'actif') : '');
      return '<div class="jalon ' + cls + '"><div class="pt"></div><div class="lb">' + s.libelle + '</div></div>';
    }).join('');
    const prog = (STATUT.taches_total > 0)
      ? ' \u2014 ' + STATUT.taches_faites + '/' + STATUT.taches_total + ' \u00e9tapes'
      : '';

      '<div style="width:100%"><div class="statut-ligne" style="margin-top:0">' +
      '<span class="statut-nom">' + esc((STATUTS[idx]||{}).libelle || STATUT.statut) + '</span>' +
      (STATUT.so ? '<span class="statut-motif">' + esc(STATUT.so) + prog + '</span>' : '') +
      '</div><div class="jalons">' + jalons + '</div></div>';
  }
  return '<div class="statut-ligne" id="zone-statut">' + inner + '</div>';
}

function chipsEntree(e, complet, sansType){

function compEntree(e){
  /* retour Olivier : identifier D ABORD le composant, la cause ensuite */
  if(!e.repere && !e.mpn) return '';
  const m = [];
  if(e.repere) m.push('<span class="cl">Rep:</span> <span class="cv">' + esc(e.repere) + '</span>');
  if(e.mpn) m.push('<span class="cl">Ref/MPN:</span> <span class="cv">' + esc(e.mpn) + '</span>');

}
function detEntree(e){
  const m = [];
  if(e.etape_libelle) m.push(e.etape_libelle);
  if(e.poles && e.poles.length) m.push('\u2192 ' + e.poles.join(', '));
  if(e.so_canonique) m.push(e.so_canonique);
  let h = m.length ? '<div class="tl-src">' + esc(m.join(' \u00b7 ')) + '</div>' : '';
  if(e.lien) h += '<div class="tl-src"><a href="' + esc(e.lien) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(e.lien) + '</a></div>';
  return h;
}
function piecesEntree(e){
  if(!e.photos || !e.photos.length) return '';
  return '<p style="margin:6px 0 0">' + e.photos.map(c => {
    const nom = String(c).split('/').pop().replace(/^[a-z0-9]{8}-/, '');
    const img = /\.(jpe?g|png|webp|heic|heif)$/i.test(nom);
    return '<button class="btn-s" style="margin:0 6px 4px 0" onclick="event.stopPropagation();FS.ouvrirPiece(\'' + esc(c) + '\')">' +
      '<i class="ti ' + (img?'ti-photo':'ti-file-text') + '"></i> ' + esc(nom) + '</button>';
  }).join('') + '</p>';
}
function passeFiltre(e){
  if(filtreMetier){
    const codes = (filtreMetier === 'DIVERS_PROD') ? GROUPE_PROD : [filtreMetier];
    if(!codes.includes(e.etape_code) && !(e.poles||[]).some(p => codes.includes(p))) return false;
  }
  if(filtreConcerne){
    /* concernes effectifs de l entree : poles normalises (un code etape glisse
       dans poles est traduit), sinon defaut par l etape — meme regle que le
       routage mail. QUALITE couvre les deux equipes. */
    const brut = (e.poles && e.poles.length) ? e.poles : [poleDefaut(e.etape_code)];
    const eff = new Set();
    brut.forEach(v => {
      const p = ['COMMERCIAL','PRODUCTION','QUALITE'].includes(v) ? v : poleDefaut(v);
      if(p === 'QUALITE'){ eff.add('COMMERCIAL'); eff.add('PRODUCTION'); eff.add('QUALITE'); }
      else eff.add(p);
    });
    if(!eff.has(filtreConcerne)) return false;
  }
  if(filtre === 'tous') return true;
  if(filtre === 'attente') return e.etat === 'en_attente';
  if(filtre === 'client')  return e.visible_client === true;
  if(filtre === 'interne') return e.visible_client !== true && e.type !== 'indice';
  return true;
}
function htmlEntree(e, cls){
  return '<div class="tl-entree ' + (cls||'') + (e.type==='indice'?' indice-evt':'') +
    (e.id===choisieId?' choisie':'') + '" onclick="ouvrirVolet(' + e.id + ')">' +
    '<div class="tl-tete">' + chipsEntree(e, false) +
    '<span class="tl-meta">' + esc(e.auteur||'?') + ' \u00b7 ' + fdate(e.cree_le) + '</span></div>' +
    compEntree(e) +
    '<div class="tl-texte">' + esc(e.texte_brut||'') + '</div>' +
    detEntree(e) + piecesEntree(e) + '</div>';
}

function rendreFiche(){
  const z = el('colonne-fil');
  const entrees = FICHE.entrees || [];
  const enAttente = FICHE.en_attente || [];

  /* arbre question -> reponses (retour n1 : les reponses sous leur question) */
  const parId = {}; entrees.forEach(e => parId[e.id] = e);
  const enfants = {};
  entrees.forEach(e => {
    if(e.repond_a && parId[e.repond_a]) (enfants[e.repond_a] = enfants[e.repond_a] || []).push(e);
  });
  const racines = entrees.filter(e => !(e.repond_a && parId[e.repond_a]));
  Object.values(enfants).forEach(l => l.sort((a,b) => new Date(a.cree_le) - new Date(b.cree_le)));

  html += htmlSaisie();

  const visibles = racines.filter(passeFiltre);
  const strip = enAttente.length
    ? '<div class="attente-strip">' + enAttente.map(a => miniAttente(a)).join('') + '</div>'
    : '';
  html += '<div class="card">' + strip + '<h2><i class="ti ti-timeline"></i> Fil de la carte' +

    '<div class="filtres">' +
    [['tous','Tous'],['attente','En attente'],['client','Visible client'],['interne','Interne']].map(f =>
      '<button class="filtre' + (filtre===f[0]?' on':'') + '" onclick="FS.filtrer(\'' + f[0] + '\')">' + f[1] + '</button>').join('') +
    '<select onchange="FS.filtrerMetier(this.value)" style="width:auto;padding:5px 9px;font-size:12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2)">' +
    '<option value="">Toutes les \u00e9tapes</option>' +
    LISTE_SAISIE.map(x => '<option value="' + x[0] + '"' + (filtreMetier===x[0]?' selected':'') + '>' + esc(x[1]) + '</option>').join('') +
    '</select>' +
    '<select onchange="FS.filtrerConcerne(this.value)" style="width:auto;padding:5px 9px;font-size:12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2)">' +
    '<option value="">Tous les concern\u00e9s</option>' +
    CONCERNES_LISTE.map(c => '<option value="' + c[0] + '"' + (filtreConcerne===c[0]?' selected':'') + '>' + c[1] + '</option>').join('') +
    '</select>' +
    '<button class="filtre" style="margin-left:auto" onclick="FS.copierClient()" title="Copie les questions client en attente, pr\u00eates \u00e0 joindre au devis">Copier les questions client</button>' +

    '<button class="btn-mail-client" onclick="FS.mailClient()" title="Cr\u00e9e un brouillon Gmail (commercial@ ou production@ selon vos initiales) avec les questions client en attente et le lien de r\u00e9ponse en ligne. Rien ne part sans vous.">Pr\u00e9parer le mail client</button>' +
    '</div>';

FS.copierClient = async function(){

    if(!r || !r.ok || !r.jeton){ alert(r && r.motif ? r.motif : 'Lien indisponible.'); return; }
    window.open('https://protoprocess.github.io/commercial/fabstory-client/?jeton=' + encodeURIComponent(r.jeton), '_blank');
  }catch(err){
    alert('Impossible d\u2019ouvrir le rapport : ' + (err && err.message ? err.message : err));
  }
};

/* Meme logique que la vue client (resumeImprime) : un fil a un resume
   automatique si PROPOSITION existe et que la reponse est un cas reconnu. */
function resumeAutoPossible(f){
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const r = norm(f.reponse);
  if(!r) return false;
  if(r.indexOf('je fournis') >= 0 || r.indexOf('fournis ce composant') >= 0) return true; /* retire du PDF, rien a rediger */
  if(r.indexOf('attendre') >= 0 && r.indexOf('stock') >= 0) return true; /* idem */
  if(f.proposition && r.indexOf('propos') >= 0 && r.indexOf('accept') >= 0) return true;
  if(r.indexOf('pas cabler') >= 0) return true;
  return false;
}

    let html = '<h3 style="margin:0 0 6px;font-size:15px">Lignes de rapport \u00e0 r\u00e9diger</h3>' +
      '<p style="margin:0 0 14px;color:var(--text2);font-size:12.5px">Ces \u00e9changes r\u00e9solus n\u2019ont pas de formulation automatique. Le rapport n\u2019imprime jamais de texte brut : \u00e9crivez la ligne telle qu\u2019elle doit appara\u00eetre au rapport de fabrication.</p>';
    fils.forEach(function(f, i){
      html += '<div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px">' +
        '<div style="font-size:12px;color:var(--text2);margin-bottom:6px">' +
        (f.repere ? 'Rep ' + esc(f.repere) + ' \u00b7 ' : '') + (f.mpn ? esc(f.mpn) + ' \u00b7 ' : '') +
        (f.modele_code ? 'mod\u00e8le ' + esc(f.modele_code) : 'hors mod\u00e8le') + '</div>' +
        '<div style="font-size:12.5px;margin-bottom:4px;white-space:pre-wrap">' + esc((f.question || '').slice(0, 220)) + '</div>' +
        (f.reponse ? '<div style="font-size:12.5px;color:var(--pp-blue);margin-bottom:8px">R\u00e9ponse client : ' + esc(f.reponse.slice(0, 160)) + '</div>' : '') +
        '<textarea data-fiche="' + f.id + '" data-modele="' + esc(f.modele_code || '') + '" placeholder="Ligne du rapport (ex. : Retouche valid\u00e9e avec vous le\u2026)" style="width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font:inherit;font-size:13px;padding:8px;min-height:52px"></textarea>' +
        '<label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);margin-top:6px"><input type="checkbox" data-proposer="' + f.id + '"' + (f.modele_code ? '' : ' disabled') + '> Proposer comme formulation du mod\u00e8le' + (f.modele_code ? ' ' + esc(f.modele_code) : ' (fil hors mod\u00e8le)') + '</label>' +
        '</div>';
    });
    html += '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">' +
      '<button type="button" class="filtre" id="rlAnnuler">Annuler</button>' +
      '<button type="button" class="filtre actif" id="rlEnregistrer">Enregistrer et ouvrir le rapport</button></div>' +
      '<div id="rlErreur" style="color:var(--rouge);font-size:12.5px;margin-top:8px;min-height:16px"></div>';
    boite.innerHTML = html;
    fond.appendChild(boite);
    document.body.appendChild(fond);
    boite.querySelector('#rlAnnuler').addEventListener('click', function(){ fond.remove(); resoudre(false); });
    boite.querySelector('#rlEnregistrer').addEventListener('click', async function(){
      const zones = Array.from(boite.querySelectorAll('textarea[data-fiche]'));
      const vides = zones.filter(z => !z.value.trim());
      const err = boite.querySelector('#rlErreur');
      if(vides.length){ err.textContent = 'Toutes les lignes doivent \u00eatre r\u00e9dig\u00e9es (' + vides.length + ' manquante' + (vides.length > 1 ? 's' : '') + ').'; vides[0].focus(); return; }
      err.textContent = '';
      this.disabled = true; this.textContent = 'Enregistrement\u2026';
      try{
        for(const z of zones){
          const id = z.getAttribute('data-fiche');
          const proposer = !!boite.querySelector('input[data-proposer="' + id + '"]:checked');
          const rep = await postJson(BASE + '/fabstory-ligne-rapport', { fiche_id: parseInt(id, 10), ligne: z.value.trim(), proposer_modele: proposer, auteur: qui() || null });
          if(!rep || !rep.ok) throw new Error((rep && rep.motif) || 'Enregistrement refus\u00e9 (fil ' + id + ').');
        }
        fond.remove(); resoudre(true);
      }catch(e2){
        err.textContent = '\u00c9chec : ' + (e2 && e2.message ? e2.message : e2);
        this.disabled = false; this.textContent = 'Enregistrer et ouvrir le rapport';
      }
    });
  });
};

   (question libre, note simple sans assistant) ;
   écran 2 tout-en-un — seules les variables NON automatisables ({DATE} et
   {LIEN} arriveront de l'API distributeur en passe 2 ; en attendant leurs
   segments sautent proprement du message) ;
   écran 3 aperçu — texte assemblé, choix retirables/ajoutables, case de
   portée, méta déduite corrigible, Enregistrer / Abandonner.
   Le contexte devis/commande est DÉDUIT du statut Odoo (fabstory-statut) et
   corrigible à l'aperçu — plus de bascule manuelle.
   La photocopie enregistrée devient une ENVELOPPE { choix:[…], portee:{…}|null }
   (décision Olivier 28/08) : la question envoyée est autonome, un modèle
   modifié ne change jamais une question déjà partie. */

let assistant = { produit:null, ecran:0, code:null, vals:{}, specsLignes:null, portee:true };
const AUTO_VARS = ['DATE','LIEN','DATASHEET'];
const VAR_LABELS = {
  REF:           ['Référence concernée', 'Servira aussi de MPN sur la fiche.'],
  REP:           ['Repère(s) sur la carte', ''],
  PROPOSITION:   ['Équivalent proposé', ''],
  LISTE:         ['Passifs concernés (repère + référence, une ligne chacun)', 'La liste part complète dans le mail ; repliée au-delà de 5 réfs à l’écran client.'],
  POINT_A_VERIFIER: ['Point à vérifier', ''],
  BOITIER_RECU:  ['Boîtier reçu', '']
};
const VARS_LONGUES = ['LISTE','POINT_A_VERIFIER'];
const DESCRIPTIONS_SITU = {
  M1:'Composant en rupture — j’ai un équivalent à proposer au client.',
  M2:'Composant en rupture, obsolète ou hors délai — pas d’équivalent trouvé.',
  M3:'Plusieurs passifs indisponibles — demander l’autorisation générique de substitution.',
  M4:'Le dossier ne précise pas de spécifications PCB — faire valider le standard PP.',
  M5:'Autre point à vérifier avant câblage (réponse libre du client).',
  M5A:'Doute sur le sens de montage — une orientation est proposée en photo.',
  M5B:'Le boîtier reçu ne correspond pas à l’empreinte du PCB.'
};
const DOMAINES_LIBELLES = { appro:'Approvisionnement', devis:'Devis / dossier', production:'Câblage / production', logistique:'Logistique', transverse:'Divers' };
const INITIALES_COMMERCIAL = ['AC','OC','DG','MM'];   /* mapping expéditeur (Olivier 08/08) */

function ctxDeduit(){ return (STATUT && STATUT.statut === 'devis') ? 'devis' : 'commande'; }
function etapePourModele(m){
  if(m.code === 'M4') return 'PCB';
  return { appro:'APPRO', devis:'DEVIS', production:'CMS', logistique:'DIVERS_PROD' }[m.domaine] || 'DIVERS_PROD';
}
function varsDuModele(m){
  const t = m.texte_client || '';
  const brutes = (t.match(/\{([A-Z0-9_]+)\}/g) || []).map(v => v.slice(1,-1));
  const vues = {};
  const vars = brutes.filter(v => {
    if(vues[v] || AUTO_VARS.includes(v) || v === 'SPECS') return false;
    vues[v] = true; return true;
  });
  /* le repère alimente la fiche même quand le texte ne le cite pas (M1/M2) */
  if(!vars.includes('REP')) vars.push('REP');
  return vars;
}
function expediteurPour(ini){ return INITIALES_COMMERCIAL.includes(ini) ? 'commercial@' : 'production@'; }

function assistantReset(){
  assistant = { produit: P ? P.id : null, ecran:0, code:null, vals:{}, specsLignes:null, portee:true };
  saisie = { type:'note', etape:null, portee:null, repond_a:null, concernes:null };
  modeleChoisi = null; choixEdit = []; piecesSaisie = [];
}
function modeleCourant(){
  if(assistant.code === 'QL' || assistant.code === 'NOTE' || !assistant.code) return null;
  return (MODELES || []).find(x => x.code === assistant.code) || null;
}

/* ------------------------------------------------------------ rendu carte -- */
function htmlSaisie(){
  /* reset si on change de carte, ou si la fiche a ete rechargee apres envoi */
  if(assistant.produit !== (P && P.id) ||
     (assistant.code && assistant.code !== 'NOTE' && assistant.code !== 'QL' && modeleChoisi === null)){
    assistantReset();
  }
  let corps;
  if(assistant.ecran === 0) corps = htmlSaisieFermee();
  else {
    corps = '<div class="stepper" aria-hidden="true">' +
      [[1,'Situation'],[2,'Compléter'],[3,'Aperçu & envoi']].map(s =>
        '<span class="step' + (assistant.ecran===s[0]?' active':(assistant.ecran>s[0]?' done':'')) + '">' +
        '<span class="dot">' + s[0] + '</span>' + s[1] + '</span>'
      ).join('<span class="step-sep"></span>') + '</div>';
    if(assistant.ecran === 1) corps += htmlEcranSituations();
    if(assistant.ecran === 2) corps += htmlEcranCompleter();
    if(assistant.ecran === 3) corps += htmlEcranApercu();
  }
  return '<div class="card" id="carte-saisie">' + corps + '</div>';
}
function htmlSaisieFermee(){
  return '<button class="btn-s" id="note-deplier" style="display:flex;align-items:center;gap:7px" onclick="FS.assistantOuvrir()">' +
    '<i class="ti ti-pencil-plus"></i> Nouvelle note</button>';
}
function rendreSaisie(){
  const c = el('carte-saisie');
  if(!c) return;
  c.outerHTML = htmlSaisie();
  brancherSaisie();
}
FS.assistantOuvrir = async function(){
  assistant.ecran = 1;
  rendreSaisie();
  if(!MODELES){
    try{ await chargerModeles(); }catch(e){ /* les chemins locaux restent utilisables */ }
    if(assistant.ecran === 1) rendreSaisie();
  }
};
FS.assistantAbandonner = function(){
  const rempli = Object.values(assistant.vals).some(v => String(v||'').trim()) || piecesSaisie.length;
  if(rempli && !confirm('Abandonner cette saisie ? Rien ne sera enregistré.')) return;
  assistantReset();
  rendreSaisie();
};
FS.assistantEcran = function(n){ assistant.ecran = n; rendreSaisie(); };

/* --------------------------------------------------------------- écran 1 -- */
function htmlEcranSituations(){
  let h = '<h2 style="margin-bottom:2px"><i class="ti ti-pencil-plus"></i> Que se passe-t-il sur cette carte ?</h2>' +
    '<p class="hint" style="margin:0 0 4px">Choisissez la situation — étape et concernés se déduisent, tout reste corrigible à l’aperçu. ' +
    'Contexte : <strong>' + ctxDeduit() + '</strong> (statut Odoo).</p>';
  if(!MODELES){
    h += '<p class="hint"><span class="spin"></span> Chargement de la bibliothèque…</p>';
  } else {
    const parDomaine = {};
    MODELES.forEach(m => { (parDomaine[m.domaine] = parDomaine[m.domaine] || []).push(m); });
    const ordre = ['appro','devis','production','logistique'].concat(
      Object.keys(parDomaine).filter(d => !['appro','devis','production','logistique'].includes(d)));
    ordre.forEach(d => {
      const liste = parDomaine[d];
      if(!liste || !liste.length) return;
      h += '<div class="groupe-titre">' + esc(DOMAINES_LIBELLES[d] || d) + '</div><div class="situations">' +
        liste.map(m =>
          '<button class="situation" onclick="FS.choisirSituation(\'' + esc(m.code) + '\')">' +
          '<span class="st">' + esc(m.titre) + '</span>' +
          '<span class="sd">' + esc(DESCRIPTIONS_SITU[m.code] || (m.texte_client||'').split('\n')[0].slice(0,110)) + '</span>' +
          '<span class="chips-situ"><span class="chip-situ mod">' + esc(m.code) + '</span>' +
          '<span class="chip-situ">' + esc(etapePourModele(m)) + '</span>' +
          '<span class="chip-situ info">' + esc(poleDefaut(etapePourModele(m)).toLowerCase()) + '</span></span>' +
          '</button>').join('') + '</div>';
    });
  }
  h += '<div class="groupe-titre">Hors bibliothèque</div><div class="situations">' +
    '<button class="situation libre" onclick="FS.choisirSituation(\'QL\')">' +
    '<span class="st">Question libre au client</span>' +
    '<span class="sd">Question non couverte par un modèle — texte libre + choix de réponses à composer, transformable en modèle.</span></button>' +
    '<button class="situation libre" onclick="FS.choisirSituation(\'NOTE\')">' +
    '<span class="st">Simple note / point à traiter</span>' +
    '<span class="sd">Une note interne, une info à tracer, un point à traiter — champ libre direct, sans assistant.</span></button>' +
    '</div>' +
    '<div style="margin-top:12px"><button class="btn-lien" onclick="FS.assistantAbandonner()">Fermer</button></div>';
  return h;
}
FS.choisirSituation = function(code){
  assistant.code = code; assistant.vals = {}; assistant.portee = true;
  piecesSaisie = [];
  const m = modeleCourant();
  if(m){
    saisie.type = 'question_client';
    saisie.etape = etapePourModele(m);
    saisie.concernes = null;
    ctxModele = (m.contexte === 'les_deux') ? ctxDeduit() : m.contexte;
    modeleChoisi = m.code;
    choixEdit = (m.choix || []).map(c => ({
      ordre: c.ordre, libelle: c.libelle,
      aide: (ctxModele === 'devis' ? (c.aide_devis || c.aide) : (c.aide_commande || c.aide)) || null,
      commentaire_obligatoire: !!c.commentaire_obligatoire
    }));
    assistant.specsLignes = ((m.texte_client||'').indexOf('{SPECS}') >= 0)
      ? SPECS_STANDARD.split('\n').map(l => { const i = l.indexOf(' : '); return [l.slice(0,i), l.slice(i+3)]; })
      : null;
  } else {
    saisie.type = (code === 'QL') ? 'question_client' : 'note';
    saisie.etape = 'DIVERS_PROD';
    saisie.concernes = null;
    ctxModele = ctxDeduit();
    modeleChoisi = null; choixEdit = [];
    assistant.specsLignes = null;
  }
  assistant.ecran = 2;
  rendreSaisie();
};

/* --------------------------------------------------------------- écran 2 -- */
function titreSituation(){
  const m = modeleCourant();
  if(m) return m.code + ' · ' + m.titre;
  return assistant.code === 'QL' ? 'Question libre au client' : 'Simple note / point à traiter';
}
function htmlChampVar(v){
  const def = VAR_LABELS[v] || [v.replace(/_/g,' ').toLowerCase(), ''];
  const long = VARS_LONGUES.includes(v);
  const champ = long
    ? '<textarea id="as-var-' + v + '" style="font-family:var(--mono)">' + esc(assistant.vals[v]||'') + '</textarea>'
    : '<input type="text" id="as-var-' + v + '" style="font-family:var(--mono)" value="' + esc(assistant.vals[v]||'') + '"' +
      ((v === 'REF' || v === 'PROPOSITION') ? ' onchange="FS.chercherLienMouser(false)"' : '') + '>';
  return '<div' + (long?' style="grid-column:1/-1"':'') + '><label class="lbl">' + esc(def[0]) +
    ' <span style="color:var(--accent-fonce)">*</span></label>' + champ +
    (def[1] ? '<p class="mini" style="margin:3px 0 0">' + esc(def[1]) + '</p>' : '') + '</div>';
}
function htmlEcranCompleter(){
  const m = modeleCourant();
  let h = '<div class="as-rappel"><h2 style="margin:0">' + esc(titreSituation()) + '</h2>' +
    '<button class="btn-lien" onclick="FS.assistantEcran(1)">changer de situation</button>' +
    '<span class="mini" style="margin-left:auto">contexte : <strong>' + ctxModele + '</strong>' +
    (m && m.contexte !== 'les_deux' ? ' (fixé par le modèle)' : ' (statut du SO — corrigible à l’aperçu)') + '</span></div>';

  if(m){
    const vars = varsDuModele(m);
    const courts = vars.filter(v => !VARS_LONGUES.includes(v));
    const longs = vars.filter(v => VARS_LONGUES.includes(v));
    h += '<div class="grille2">' + courts.map(htmlChampVar).join('') + '</div>' + longs.map(htmlChampVar).join('');
    if(assistant.specsLignes){
      h += '<label class="lbl">Standard PP — chaque valeur reste modifiable</label><table class="specs-table">' +
        assistant.specsLignes.map((s,i) =>
          '<tr><td>' + esc(s[0]) + '</td><td><input value="' + esc(s[1]) + '" aria-label="' + esc(s[0]) + '" ' +
          'onchange="assistant.specsLignes[' + i + '][1]=this.value"></td></tr>').join('') + '</table>';
    }
    if(/\{(DATE|LIEN)\}/.test(m.texte_client || '')){
      /* v4.2 (decision Olivier 28/08, option A) : date et lien SAISIS par l operateur,
         apres lecture sur les sites distributeurs. Seul le lien est pre-rempli
         (fiche produit Mouser via fabstory-ref-info). Champs facultatifs :
         vides, leurs segments sautent du message. */
      h += '<div class="grille2" style="margin-top:10px">' +
        (/\{DATE\}/.test(m.texte_client)
          ? '<div><label class="lbl">Disponibilité annoncée (facultatif)</label>' +
            '<input type="text" id="as-var-DATE" placeholder="ex. 01/10/2026" style="font-family:var(--mono)" value="' + esc(assistant.vals.DATE||'') + '">' +
            '<p class="mini" style="margin:3px 0 0">À lire sur le site du distributeur — vide : la phrase disparaît du message.</p></div>' : '') +
        (/\{LIEN\}/.test(m.texte_client)
          ? '<div><label class="lbl">Lien fiche produit (facultatif)</label>' +
            '<input type="text" id="as-var-LIEN" placeholder="pré-rempli avec la fiche Mouser si trouvée" style="font-family:var(--mono)" value="' + esc(assistant.vals.LIEN||'') + '">' +
            '<p class="mini" id="as-lien-msg" style="margin:3px 0 0">' + esc(assistant.lienMsg||'') + '</p></div>' : '') +
        (/\{LIEN\}/.test(m.texte_client)
          ? '<div><label class="lbl">Lien datasheet (facultatif)</label>' +
            '<input type="text" id="as-var-DATASHEET" placeholder="pré-rempli (DigiKey / Mouser) si trouvé" style="font-family:var(--mono)" value="' + esc(assistant.vals.DATASHEET||'') + '">' +
            '<p class="mini" style="margin:3px 0 0">Affiché au client comme bouton « Voir datasheet ».</p></div>' : '') +
        '</div>' +
        '<div class="auto-ligne"><span class="auto-txt">Vérifier la dispo chez :</span>' +
        ['Mouser','DigiKey','Farnell','TME'].map(d =>
          '<button type="button" class="btn-s" onclick="FS.ouvrirDistrib(\'' + d + '\')">' + d + '</button>').join('') + '</div>';
    }
  } else if(assistant.code === 'QL'){
    h += '<label class="lbl">Votre question au client <span style="color:var(--accent-fonce)">*</span></label>' +
      '<textarea id="as-var-TEXTE" rows="4" placeholder="Posez la question comme vous l’écririez au client…">' + esc(assistant.vals.TEXTE||'') + '</textarea>' +
      '<div class="auto-ligne"><span class="auto-txt">Les <strong>choix de réponse</strong> se composent à l’aperçu (« Ajouter un choix »). ' +
      'Sans choix, le client répond en texte libre. « Enregistrer comme modèle » versera la question au point dans la bibliothèque.</span></div>';
  } else {
    /* note simple : chemin direct, sans assistant (décision maquette 28/08) */
    h += '<div style="display:flex;align-items:center;gap:8px;margin-top:4px">' +
      '<label class="mini" for="note-etape" style="margin:0">Étape</label>' +
      '<select id="note-etape" style="font-size:12.5px;padding:4px 8px;max-width:250px">' +
      LISTE_SAISIE.map(x => '<option value="' + x[0] + '"' + (saisie.etape === x[0] ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') +
      '</select></div>' +
      '<div class="grille2" style="margin-top:8px">' +
      '<div><label class="mini">Repère</label><input type="text" id="note-repere" placeholder="C12, U3…"></div>' +
      '<div><label class="mini">Composant (MPN)</label><input type="text" id="note-mpn"></div></div>' +
      '<div class="amorces" id="zone-amorces"></div>' +
      '<textarea id="as-var-TEXTE" placeholder="Qu’y a-t-il à noter sur cette carte ?">' + esc(assistant.vals.TEXTE||'') + '</textarea>' +
      '<label class="mini" style="margin-top:8px">Nature</label><div class="pastilles">' +
      '<button class="pastille p-info' + (saisie.type==='note'?' on':'') + '" data-type="note">Information</button>' +
      '<button class="pastille' + (saisie.type==='question_interne'?' on':'') + '" data-type="question_interne">À traiter</button></div>' +
      '<label style="font-size:12.5px;color:var(--text2);display:flex;gap:6px;align-items:center;margin-top:4px" id="ligne-visible">' +
      '<input type="checkbox" id="note-visible"> Visible du client</label>';
  }

  /* pièce jointe : mécanisme éprouvé, ouvert d'office quand le modèle l'attend */
  const pjOuverte = m && m.piece_jointe_attendue;
  h += '<details class="replis"' + (pjOuverte ? ' open' : '') + '><summary>Photo ou fichier joint' +
    (pjOuverte ? ' <span class="mini">(attendu pour ce type de question)</span>' : '') + '</summary>' +
    '<div class="dropzone" id="drop-piece">Glissez un fichier ici, ou cliquez pour parcourir' +
    '<input type="file" id="note-piece" accept="image/*,.pdf,.xls,.xlsx,.csv,.txt,.zip" style="display:none"></div>' +
    '<div id="zone-pieces"></div></details>';

  /* concernés + initiales */
  h += '<label class="lbl">Qui est concerné ? <span class="mini" style="font-weight:400">(recevra la notification — au moins 1)</span></label>' +
    '<div class="pastilles" id="zone-concernes"></div>' +
    '<div style="margin-top:8px"><label class="lbl" for="note-initiales" style="margin-top:0">Vos initiales <span style="color:var(--accent-fonce)">*</span></label>' +
    '<select id="note-initiales" style="max-width:150px;font-family:var(--mono)"><option value="">—</option>' +
    EQUIPE.map(x => '<option value="' + x + '"' + (qui()===x?' selected':'') + '>' + x + '</option>').join('') + '</select>' +
    (saisie.type !== 'note' && saisie.type !== 'question_interne'
      ? '<p class="mini" style="margin:3px 0 0">Décide la boîte d’envoi : ' + INITIALES_COMMERCIAL.join(', ') + ' → commercial · toutes les autres → production.</p>' : '') +
    '</div>';

  h += '<div id="note-msg" style="min-height:18px;margin-top:8px"></div>' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
    '<button class="btn-s" onclick="FS.assistantEcran(1)"><i class="ti ti-arrow-left"></i> Retour</button>' +
    (assistant.code === 'NOTE'
      ? '<button class="btn" id="note-go">Enregistrer la note</button>'
      : '<button class="btn" onclick="FS.assistantApercu()">Aperçu <i class="ti ti-arrow-right"></i></button>') +
    '<button class="btn-lien" onclick="FS.assistantAbandonner()">Abandonner</button></div>';
  return h;
}
function lireChampsEcran2(){
  const m = modeleCourant();
  const vars = m ? varsDuModele(m) : ['TEXTE'];
  vars.forEach(v => {
    const e = el('as-var-' + v);
    if(e) assistant.vals[v] = e.value.trim();
  });
  /* v4.2 : variables facultatives — une valeur vide est SUPPRIMEE de vals,
     sinon remplirVars() viderait {DATE} et le segment optionnel ne sauterait plus */
  AUTO_VARS.forEach(v => {
    const e = el('as-var-' + v);
    if(!e) return;
    const val = e.value.trim();
    if(val) assistant.vals[v] = val; else delete assistant.vals[v];
  });
  const ini = el('note-initiales');
  if(ini && ini.value){ setQui(ini.value.trim().toUpperCase()); }
}
FS.assistantApercu = function(){
  lireChampsEcran2();
  const m = modeleCourant();
  const vars = m ? varsDuModele(m) : ['TEXTE'];
  const manque = vars.filter(v => !String(assistant.vals[v]||'').trim());
  if(manque.length || !qui()){
    el('note-msg').innerHTML = '<span class="err-msg">Complétez les champs marqués * (et vos initiales) avant l’aperçu.</span>';
    return;
  }
  assistant.ecran = 3;
  rendreSaisie();
};

/* --------------------------------------------------------------- écran 3 -- */
function remplirVars(t){
  Object.keys(assistant.vals).forEach(k => {
    const val = String(assistant.vals[k] === undefined || assistant.vals[k] === null ? '' : assistant.vals[k]);
    if(!val.trim()) return;               /* v4.2 : une variable vide reste {X} et saute au nettoyage */
    t = t.split('{' + k + '}').join(val);
  });
  return t;
}
/* v4.2 — sites distributeurs (recherche par MPN, aucune API) + lien Mouser via fabstory-ref-info */
const DISTRIB_URLS = {
  Mouser:  m => 'https://www.mouser.fr/c/?q=' + encodeURIComponent(m),
  DigiKey: m => 'https://www.digikey.fr/fr/products/result?keywords=' + encodeURIComponent(m),
  Farnell: m => 'https://fr.farnell.com/search?st=' + encodeURIComponent(m),
  TME:     m => 'https://www.tme.eu/fr/katalog/?search=' + encodeURIComponent(m)
};
function refCourante(){
  /* reference pour les sites distributeurs = la reference concernee */
  const e = el('as-var-REF');
  return ((e && e.value) || assistant.vals.REF || '').trim();
}
function refPourLien(){
  /* v4.3 (Olivier 31/08) : le LIEN client pointe sur ce qu on PROPOSE (M1 : l equivalent) ;
     sans proposition (M2...), sur la reference concernee */
  const p = el('as-var-PROPOSITION');
  const prop = ((p && p.value) || assistant.vals.PROPOSITION || '').trim();
  return prop || refCourante();
}
FS.ouvrirDistrib = function(d){
  const ref = refPourLien();
  if(!ref){ el('note-msg').innerHTML = '<span class="err-msg">Saisissez d’abord la référence concernée.</span>'; return; }
  window.open(DISTRIB_URLS[d](ref), '_blank', 'noopener');
};
let lienMouserPour = null;
FS.chercherLienMouser = async function(force){
  /* v4.7 : Mouser + DigiKey (endpoint ref-info v0.9). Lien = Mouser d abord, sinon
     DigiKey ; datasheet = DigiKey d abord, sinon Mouser. Champs pre-remplis
     seulement s ils sont vides (ou si force). */
  const ref = refPourLien();
  const champ = el('as-var-LIEN'); const msg = el('as-lien-msg');
  if(!champ || !ref) return;
  if(!force && (lienMouserPour === ref || champ.value.trim())) return;
  lienMouserPour = ref;
  if(msg) msg.textContent = 'Recherche distributeurs…';
  try{
    const r = await getJson(BASE + '/fabstory-ref-info?mpn=' + encodeURIComponent(ref));
    const offres = (r && r.offres) || [];
    const mo = offres.find(o => o.distributeur === 'Mouser');
    const dk = offres.find(o => o.distributeur === 'DigiKey');
    const lien = (r && r.lien) || null;
    const ds = (r && r.datasheet) || null;
    if(lien && (force || !champ.value.trim())) champ.value = lien;
    const champDs = el('as-var-DATASHEET');
    if(champDs && ds && (force || !champDs.value.trim())) champDs.value = ds;
    assistant.datasheet = ds;
    const trouves = [mo ? 'Mouser' : null, dk ? 'DigiKey' : null].filter(Boolean);
    if(!trouves.length){
      assistant.lienMsg = 'Référence inconnue chez Mouser et DigiKey — collez les liens à la main si besoin.';
    } else {
      assistant.lienMsg = 'Trouvée chez ' + trouves.join(' et ') + (lien ? ' — lien ' + (mo && mo.lien ? 'Mouser' : 'DigiKey') : '') +
        (ds ? ', datasheet ' + (dk && dk.datasheet ? 'DigiKey' : 'Mouser') + '.' : ' — pas de datasheet, collez-la si besoin.');
    }
  }catch(e){ assistant.lienMsg = 'Recherche distributeurs indisponible.'; }
  if(msg) msg.textContent = assistant.lienMsg;

function nettoyerAuto(t){
  /* passe 1 sans endpoint distributeur : les segments {DATE}/{LIEN} sautent.
     v4.1 : un segment OPTIONNEL entre crochets (sans pipe) qui contient encore
     une variable auto non remplie saute EN ENTIER, crochets compris ; s'il ne
     contient plus de variable (passe 2, valeur remplie), seuls les crochets
     tombent. Le segment [pas|plus] est deja resolu avant cet appel. */
  return t.replace(/\[[^\[\]|]*\{(DATE|LIEN)\}[^\[\]|]*\]/g, '')
          .replace(/\[([^\[\]|]*)\]/g, '$1')
          .replace(/\s*\(\{(DATE|LIEN)\}\)/g, '')
          .replace(/\s*[—–-]\s*\{(DATE|LIEN)\}/g, '')
          .replace(/\{(DATE|LIEN)\}/g, '')
          .replace(/ {2,}/g, ' ');
}
function texteAssemble(){
  const m = modeleCourant();
  if(!m) return assistant.vals.TEXTE || '';
  let t = m.texte_client || '';
  t = t.replace(/\[([^\[\]|]*)\|([^\[\]|]*)\]/g, (x,a,b) => ctxModele === 'devis' ? a : b);
  if(assistant.specsLignes) t = t.replace('{SPECS}', assistant.specsLignes.map(l => l[0] + ' : ' + l[1]).join('\n'));
  t = nettoyerAuto(remplirVars(t));
  return t.replace(/\n{3,}/g,'\n\n').trim();
}

  const m = modeleCourant();
  if(!m || !m.portee_libelle) return null;
  return { libelle: m.portee_libelle, condition: m.portee_condition || null };
}

        majVisibilite();

        const fic = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
        if(fic) traiterPiece(fic);

  if(assistant.ecran === 3){

      assistant.portee = this.checked;
      const po = porteeDuModele();
      const cond = (po && po.condition && po.condition.length)
        ? 'Visible côté client uniquement sur le choix n° ' + po.condition.join(', ') + '.'
        : 'Toujours visible côté client.';

        ? cond + ' Case décochée par défaut chez le client (= cette commande seulement).'
        : 'Décochée : la proposition de validation définitive n’apparaîtra pas côté client.';
    };
    const se = el('as-etape');
    if(se) se.onchange = () => { saisie.etape = se.value || null; rendreConcernes(); };
    const cx = el('as-ctx');
    if(cx) cx.onclick = () => {
      ctxModele = (ctxModele === 'devis') ? 'commande' : 'devis';
      const m = modeleCourant();

        choixEdit = choixEdit.map(c => {

function compresser(file, maxCote, qualite){
  maxCote = maxCote || 1600; qualite = qualite || 0.8;
  return new Promise(function(res){
    if(!/^image\//.test(file.type || '')) { res(file); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function(){
      const r = Math.min(1, maxCote / Math.max(img.width, img.height));
      if(r >= 1){ URL.revokeObjectURL(url); res(file); return; }
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b){ URL.revokeObjectURL(url); res(b || file); }, 'image/jpeg', qualite);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function deposerPiece(ev){
  const fichier = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  traiterPiece(fichier);

async function traiterPiece(fichier){
  if(!fichier || envoiPiece) return;
  envoiPiece = true; rendrePieces();
  try{
    const j = await postJson(BASE + '/fiche-de-vie-piece', { produit_id: P.id, nom: fichier.name || 'piece' });
    const corps = await compresser(fichier);
    /* Le type vient de l EXTENSION (deduit par n8n), pas du navigateur */
    const up = await fetch(j.url, { method: 'PUT', headers: { 'Content-Type': j.type }, body: corps });
    if(!up.ok) throw new Error('Envoi refusé par le stockage (' + up.status + ').');
    piecesSaisie.push({ chemin: j.chemin, nom: fichier.name, type: j.type });
    envoiPiece = false; rendrePieces();
  }catch(e){
    envoiPiece = false; rendrePieces('Pièce non déposée : ' + e.message);
  }
}

async function envoyerNote(){
  const estNote = (assistant.code === 'NOTE');
  if(estNote) { const ta = el('as-var-TEXTE'); if(ta) assistant.vals.TEXTE = ta.value.trim(); }
  const texte = estNote ? (assistant.vals.TEXTE || '') : texteAssemble();
  const msg = el('note-msg');
  if(!texte){ msg.innerHTML = '<span class="err-msg">Un texte est nécessaire.</span>'; return; }
  if(envoiPiece){ msg.innerHTML = '<span class="err-msg">Une pièce est en cours d’envoi, un instant.</span>'; return; }
  const iniSel = el('note-initiales');
  if(iniSel && iniSel.value) setQui(iniSel.value.trim().toUpperCase());
  const auteur = qui() || auteurOuStop();
  if(!auteur) return;
  const cs = concernesEffectifs();
  if(!cs.length){ msg.innerHTML = '<span class="err-msg">Choisir au moins un concerné (destinataire de la notification).</span>'; return; }
  const estQuestionClient = (saisie.type === 'question_client');
  /* v4.0 : la PHOTOCOPIE devient une enveloppe { choix, portee } — la question
     envoyee est autonome (texte + choix + case, figes ensemble). Les aides des
     choix partent VARIABLES RESOLUES : le client lit du texte, pas des {REF}. */
  let enveloppe = null;
  if(estQuestionClient){
    const choixResolus = choixEdit.map(c => ({
      ordre: c.ordre, libelle: c.libelle,
      aide: c.aide ? nettoyerAuto(remplirVars(c.aide)) : null,
      commentaire_obligatoire: !!c.commentaire_obligatoire
    }));
    /* v4.6 (31/08) : variables STRUCTUREES dans l enveloppe (REF, PROPOSITION, DATE,
       LIEN, DATASHEET...) — la vue client en tire les liens, et la regle client
       automatique (portee "pour toujours") en tirera l equivalence. Valeurs vides exclues. */
    const vars = {};
    Object.keys(assistant.vals).forEach(k => { const v = String(assistant.vals[k] == null ? '' : assistant.vals[k]).trim(); if(v) vars[k] = v; });
    if(assistant.datasheet) vars.DATASHEET = assistant.datasheet;
    enveloppe = { choix: choixResolus, portee: (assistant.portee ? porteeDuModele() : null), vars: vars };
  }
  const corps = {
    produit_id: P.id, type: saisie.type, texte_brut: texte, auteur,
    poles: cs,
    etape_code: saisie.etape || null,
    repere: estNote ? ((el('note-repere')||{}).value||'').trim() || null : (assistant.vals.REP || null),
    mpn: estNote ? ((el('note-mpn')||{}).value||'').trim() || null : (assistant.vals.REF || null),
    lien: estNote ? null : (assistant.vals.LIEN || null),
    photos: piecesSaisie.map(p => p.chemin),
    visible_client: estNote ? !!(el('note-visible')||{}).checked : true,
    portee_validation: null,
    source: 'fabstory',
    differer_notif: true,
    choix_reponse: enveloppe,
    modele_code: estQuestionClient ? modeleChoisi : null
  };
  const restes = (texte.match(/\{[A-Z0-9_]+\}/g) || []);
  if(restes.length && !confirm('Le texte contient encore des variables non complétées : ' +
      restes.join(' ') + '\n\nEnregistrer quand même ?')){
    return;
  }
  const btn = el('note-go');
  if(btn) btn.disabled = true;
  msg.innerHTML = '<span class="spin"></span>';
  try{
    await postJson(BASE + '/fabstory-note', corps);
    assistantReset();
    await recharger(false);
  }catch(e){
    msg.innerHTML = '<span class="err-msg">' + esc(e.message) + '</span>';
    if(btn) btn.disabled = false;
  }
}

  const msg = el('cr-msg');
  const opt = el('cr-client').selectedOptions[0];
  if(!opt || !opt.value){ msg.innerHTML = '<span class="err-msg">Choisissez le client.</span>'; return; }
  const ref = el('cr-ref').value.trim();
  if(!ref){ msg.innerHTML = '<span class="err-msg">La r\u00e9f\u00e9rence est obligatoire : elle forme la cl\u00e9.</span>'; return; }
  const code = opt.dataset.code || '';
  if(ref.toUpperCase().startsWith(code.toUpperCase())){ msg.innerHTML = '<span class="err-msg">La r\u00e9f\u00e9rence ne doit pas r\u00e9p\u00e9ter le code client \u2014 la cl\u00e9 le porte d\u00e9j\u00e0.</span>'; return; }
  const indice = el('cr-indice').value.trim() || null;
  el('cr-go').disabled = true;
  msg.innerHTML = '<span class="spin"></span>';
  try{
    const j = await postJson(BASE + '/produit-rattacher', {
      odoo_partner_id: Number(opt.value), code_client: code, nom_client: opt.dataset.nom || '',
      ref_carte: ref, libelle_carte: el('cr-libelle').value.trim() || null,
      alias: indice ? (ref + '_' + indice) : null, indice: indice
    });
    el('dlg-creer').close();
    el('cr-go').disabled = false;
    // Rapprochement automatique (chantier 110) : si un article Odoo existe deja
    // au bon nom (ex. cree avant la carte via devis-client), le lien se pose
    // seul. Best-effort, JAMAIS bloquant : pas d article encore, ou plusieurs
    // candidats ambigus -> l API refuse silencieusement (garde-fous existants),
    // l appli Commande prendra le relais plus tard.
    try{ await postJson(BASE + '/commande-lier', { produit_id: j.produit_id }); }catch(e){}
    const lj = await getJson(BASE + '/produits');
    PRODUITS = (lj && lj.produits) || [];
    ouvrirFiche(j.produit_id);
  }catch(e){
    msg.innerHTML = '<span class="err-msg">' + esc(e.message) + '</span>';
    el('cr-go').disabled = false;
  }
};

/* ------------------------------------------------------------- indices ---- */
FS.ouvrirIndice = function(){
  el('ind-val').value = ''; el('ind-chg').value = ''; el('ind-date').value = '';
  el('ind-msg').textContent = '';
  el('dlg-indice').showModal();
};
FS.poserIndice = async function(){
  const val = el('ind-val').value.trim();
  const msg = el('ind-msg');
  if(!val){ msg.innerHTML = '<span class="err-msg">Un indice est n\u00e9cessaire.</span>'; return; }
  const auteur = auteurOuStop();
  if(!auteur) return;
  const corps = { produit_id: P.id, indice: val, auteur,
    ce_qui_change: el('ind-chg').value.trim() || null,
    date_evt: el('ind-date').value || null };
  el('ind-go').disabled = true;
  msg.innerHTML = '<span class="spin"></span>';
  try{
    await postJson(BASE + '/fabstory-indice', corps);
    el('dlg-indice').close();
    el('ind-go').disabled = false;
    await recharger(false);
  }catch(e){
    msg.innerHTML = '<span class="err-msg">' + esc(e.message) + '</span>';
    el('ind-go').disabled = false;
  }
};

(async function(){
  await chargerCartes();
  const pid = parseInt(new URLSearchParams(location.search).get('produit'), 10);
  if(pid > 0) ouvrirFiche(pid);
})();
</script>

<button id="sig-btn" onclick="ouvrirSignalement()" title="Signaler un bug, une analyse fausse ou une idée">
  <i class="ti ti-message-report"></i> Signaler</button>

<div id="sig-fond" class="hidden">
  <div id="sig-boite">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="margin:0"><i class="ti ti-message-report"></i> Signaler</h2>
      <button class="btn-ann" onclick="fermerSignalement()">✕</button>
    </div>
    <p style="font-size:11.5px;color:var(--text2,#94a3b8);margin:0 0 12px">
      L'appli et sa version partent automatiquement avec votre message.</p>

    <div class="sig-t" id="sig-types">
      <button data-t="bug" class="on" onclick="sigType('bug')">Bug</button>
      <button data-t="analyse" onclick="sigType('analyse')">Analyse fausse</button>
      <button data-t="idee" onclick="sigType('idee')">Idée</button>
    </div>

    <label class="f">Votre nom</label>
    <input class="f" id="sig-auteur" placeholder="pour qu'on puisse revenir vers vous">

    <label class="f">Ce que vous avez constaté</label>
    <textarea class="f" id="sig-desc" rows="6" placeholder="Sur une analyse fausse, précisez la valeur attendue et où vous l'avez lue."></textarea>

    <div id="sig-msg" style="font-size:12px;margin-top:2px"></div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:13px">
      <button class="btn-ann" onclick="fermerSignalement()">Annuler</button>
      <button class="btn-env" id="sig-env" onclick="envoyerSignalement()">Envoyer</button>
    </div>
  </div>
</div>

<script>
/* ---------- signalement : module commun (chantier 72) ----------
   Auto-suffisant : URL de production en dur, l'en-tete X-PP-Auth est pose par
   l'intercepteur d'acces commun. Le contexte minimal (appli, version) part
   automatiquement. Destination : Data Table n8n + table Supabase signalements
   (lue par Claude) + mail immediat. */
(function(){
  var URL_SIG = 'https://protoprocess.app.n8n.cloud/webhook/v2-signalement';
  var CLE_SIGNALEUR = 'pp_signaleur';
  var SIG_TYPE = 'bug';
  var APPLI = 'fabstory';

  window.sigType = function(t){
    SIG_TYPE = t;
    document.querySelectorAll('#sig-types button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); });
  };
  window.ouvrirSignalement = function(){
    try{ document.getElementById('sig-auteur').value = localStorage.getItem(CLE_SIGNALEUR) || ''; }catch(e){}
    document.getElementById('sig-msg').textContent = '';
    document.getElementById('sig-fond').classList.remove('hidden');
    document.getElementById('sig-desc').focus();
  };
  window.fermerSignalement = function(){ document.getElementById('sig-fond').classList.add('hidden'); };
  window.envoyerSignalement = function(){
    var desc = document.getElementById('sig-desc').value.trim();
    var msg = document.getElementById('sig-msg');
    if(!desc){ msg.innerHTML = '<span style="color:#f09595">Décrivez ce que vous avez constaté.</span>'; return; }
    var auteur = document.getElementById('sig-auteur').value.trim();
    try{ if(auteur) localStorage.setItem(CLE_SIGNALEUR, auteur); }catch(e){}
    var btn = document.getElementById('sig-env');
    btn.disabled = true;
    msg.innerHTML = '<span style="color:var(--text2,#94a3b8)">Envoi…</span>';
    fetch(URL_SIG, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        type: SIG_TYPE, description: desc, auteur: auteur,
        appli: APPLI, version: (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '')
      })
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      msg.innerHTML = '<span style="color:#86c564">Merci, c\'est envoyé.</span>';
      document.getElementById('sig-desc').value = '';
      setTimeout(window.fermerSignalement, 1400);
    }).catch(function(e){
      msg.innerHTML = '<span style="color:#f09595">Envoi impossible : ' + String(e.message).replace(/[<>&]/g,'') + '. Réessayez ou prévenez Olivier.</span>';
    }).then(function(){ btn.disabled = false; });
  };
})();
</script>
