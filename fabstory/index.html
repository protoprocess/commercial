<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proto Process / FabStory</title>
<link rel="icon" type="image/png" href="../shared/picto-pp.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
/* ================================================================== FabStory
   Theme CLAIR dedie (maquettes validees 06/08/2026) : l'orange agit (#F8952D),
   le bleu informe (#5BC4D8, pastilles #EAF7FA / texte #1B7A8F).
   Autonome : ne depend pas de shared/fiche-de-vie.js (intact, contrat ch.95). */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f5;
  --border:#dde3ec; --border2:#c8d2e0;
  --text:#1c2430; --text2:#5b6b80; --text3:#8b98ab;
  --accent:#F8952D; --accent-fonce:#d97a15; --accent-bg:#FDF0E1;
  --info:#5BC4D8; --info-bg:#EAF7FA; --info-txt:#1B7A8F;
  --green:#4d9938; --green-bg:#EAF3DE; --green-badge:#3B6D11;
  --amber:#b07219; --amber-bg:#FAEEDA; --amber-badge:#854F0B;
  --red:#c04545;  --red-bg:#FCEBEB;  --red-badge:#A32D2D;
  --radius:6px; --radius-lg:12px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
header{background:#0f1117;height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:50}
.logo-text{display:flex;align-items:center;font-size:13px;font-weight:500}
.logo-text .lt{color:#fff}.logo-text .ls{color:#444;margin:0 3px}.logo-text .lo{color:var(--accent)}
#hdr-version{margin-left:auto;font-size:11px;color:#64748b}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px}
.hint{font-size:12.5px;color:var(--text2)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:9px 16px;font-size:13px;font-weight:500}
.btn:hover{background:var(--accent-fonce)}
.btn:disabled{opacity:.5;cursor:default}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:6px 11px;font-size:12.5px}
.btn-s:hover{border-color:var(--border2)}
.btn-lien{background:none;border:none;color:var(--info-txt);font-size:12px;padding:2px 4px;text-decoration:underline}
input[type=text],textarea,input[type=date]{width:100%;background:#fff;border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:9px 11px;font-size:13.5px;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
/* ------------------------------------------------------------- ecran cartes */
.carte-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:#fff;cursor:pointer}
.carte-item:hover{border-color:var(--accent)}
.carte-item .ref{font-family:var(--mono);font-size:13px;font-weight:600}
.carte-item .lib{font-size:12.5px;color:var(--text2)}
.carte-item .cli{margin-left:auto;font-size:11.5px;color:var(--text3);white-space:nowrap}
/* -------------------------------------------------------------------- hero */
.hero{background:linear-gradient(180deg,#fff 0%,#fdf8f2 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px}
.hero-haut{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.hero-ref{font-family:var(--mono);font-size:18px;font-weight:700}
.hero-lib{font-size:13.5px;color:var(--text2)}
.hero-cli{font-size:12px;color:var(--text3);margin-left:auto}
.badge-indice{display:inline-flex;align-items:center;gap:4px;background:var(--info-bg);color:var(--info-txt);border:1px solid var(--info);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer}
.statut-ligne{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.statut-nom{font-size:13.5px;font-weight:600}
.statut-motif{font-size:11.5px;color:var(--text3)}
.jalons{display:flex;gap:0;margin-top:10px}
.jalon{flex:1;text-align:center;position:relative}
.jalon .pt{width:14px;height:14px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);margin:0 auto 5px;position:relative;z-index:2}
.jalon.fait .pt{background:var(--green);border-color:var(--green)}
.jalon.actif .pt{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.jalon .lb{font-size:10.5px;color:var(--text3)}
.jalon.fait .lb,.jalon.actif .lb{color:var(--text);font-weight:500}
.jalon::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--border)}
.jalon:first-child::before{display:none}
.jalon.fait::before,.jalon.actif::before{background:var(--green)}
/* --------------------------------------------------------------- en attente */
.attente{border-left:3px solid var(--red)}
.attente h2 .ti{color:var(--red)}
/* ----------------------------------------------------------------- timeline */
.tl-entree{border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:9px;background:#fff}
.tl-entree.indice-evt{background:var(--info-bg);border-color:var(--info)}
.tl-tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.chip{display:inline-block;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px}
.chip.note{background:var(--surface2);color:var(--text2)}
.chip.question_client,.chip.reponse_client{background:var(--accent-bg);color:var(--accent-fonce)}
.chip.question_interne,.chip.reponse_interne{background:var(--amber-bg);color:var(--amber-badge)}
.chip.indice{background:var(--info-bg);color:var(--info-txt);border:1px solid var(--info)}
.chip.portee{background:var(--green-bg);color:var(--green-badge)}
.chip.modif{background:var(--surface2);color:var(--text3);font-weight:500}
.tl-meta{font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap}
.tl-texte{font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.tl-det{font-size:11.5px;color:var(--text2);font-family:var(--mono);margin-top:4px}
.tl-actions{margin-top:6px;display:flex;gap:4px}
.oeil{color:var(--info-txt);font-size:13px;vertical-align:-1px}
/* -------------------------------------------------------------------- saisie */
.pastilles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pastille{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--text2)}
.pastille.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-fonce);font-weight:600}
.pastille.p-info.on{background:var(--info-bg);border-color:var(--info);color:var(--info-txt)}
.amorces{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.amorce{background:#fff;border:1px dashed var(--border2);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--text2)}
.amorce:hover{border-color:var(--accent);color:var(--accent-fonce)}
.replis{margin-top:9px}
.replis[open] summary{margin-bottom:8px}
.replis summary{font-size:12px;color:var(--text2);cursor:pointer;list-style:none}
.replis summary::before{content:'+ '}
.replis[open] summary::before{content:'\2212 '}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.mini{font-size:11px;color:var(--text3);display:block;margin:6px 0 3px}
.ok-msg{color:var(--green);font-size:12.5px}
.err-msg{color:var(--red);font-size:12.5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
dialog{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;max-width:440px;width:92vw}
dialog::backdrop{background:rgba(20,26,36,.45)}
@media(max-width:620px){.wrap{padding:11px}.grille2{grid-template-columns:1fr}.hero-cli{margin-left:0;width:100%}}
</style>
</head>
<body>
<!-- ===== ACCES PROTO PROCESS (identique aux autres applis, ne pas diverger) ===== -->
<script>
(function(){
  var KEY='pp_access_code', HDR='X-PP-Auth', HOST='protoprocess.app.n8n.cloud';
  function get(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function del(){try{localStorage.removeItem(KEY)}catch(e){}}
  var _f = window.fetch;
  window.fetch = function(input, init){
    var url='';
    try{url=(typeof input==='string')?input:((input&&input.url)||'')}catch(e){}
    if(url.indexOf(HOST)===-1){return _f.apply(this,arguments)}
    init=init||{};
    try{var h=new Headers(init.headers||{});h.set(HDR,get());init.headers=h}catch(e){}
    return _f.call(this,input,init).then(function(r){
      if(r&&(r.status===401||r.status===403)){del();demander("Code d'acces refuse. Ressaisissez-le.")}
      return r;
    });
  };
  var box=null;
  function construire(){
    if(box)return box;
    box=document.createElement('div');
    box.id='pp-gate';
    box.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#0a0c12;display:none;'
      +'align-items:center;justify-content:center;padding:20px;'
      +'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif';
    box.innerHTML=
      '<div style="background:#1a2030;border:1px solid #262e42;border-radius:10px;padding:26px;max-width:380px;width:100%">'
      +'<div style="font-size:13px;font-weight:500;margin-bottom:14px">'
      +'<span style="color:#fff">PROTO PROCESS</span><span style="color:#444;margin:0 3px">/</span>'
      +'<span style="color:#F8952D">Acces</span></div>'
      +'<div style="font-size:12.5px;color:#94a3b8;line-height:1.55;margin-bottom:16px">'
      +"Saisissez le code d'acces interne. Il ne vous sera demande qu'une fois sur cet appareil.</div>"
      +'<input id="pp-in" type="password" placeholder="Code d acces" autocomplete="off" '
      +'style="width:100%;background:#161b27;border:1px solid #262e42;border-radius:6px;color:#e2e8f0;'
      +'padding:9px 11px;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box">'
      +'<div id="pp-err" style="font-size:12px;color:#f09595;margin-top:9px;min-height:16px"></div>'
      +'<button id="pp-btn" style="width:100%;margin-top:12px;padding:9px;background:#F8952D;color:#fff;'
      +'border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">Valider</button>'
      +'</div>';
    document.body.appendChild(box);
    var inp=box.querySelector('#pp-in'),btn=box.querySelector('#pp-btn');
    btn.addEventListener('click',function(){
      var v=(inp.value||'').trim();
      if(!v){box.querySelector('#pp-err').textContent='Code requis.';return}
      set(v);inp.value='';box.style.display='none';location.reload();
    });
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){btn.click()}});
    return box;
  }
  function demander(msg){
    var b=construire();
    if(msg){b.querySelector('#pp-err').textContent=msg}
    b.style.display='flex';
    setTimeout(function(){var i=b.querySelector('#pp-in');if(i)i.focus()},50);
  }
  function pret(f){if(document.body){f()}else{document.addEventListener('DOMContentLoaded',f)}}
  pret(function(){if(!get()){demander('')}});
  window.__ppDemanderCode=demander;
})();
</script>

<header>
  <img src="../shared/picto-pp.png" alt="Proto Process" width="24" height="24" style="object-fit:contain" onerror="this.style.display='none'">
  <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo" id="hdr-app">FabStory</span></span>
  <span id="hdr-version"></span>
</header>

<div class="wrap">
  <div id="ecran-cartes"></div>
  <div id="ecran-fiche" style="display:none"></div>
</div>

<dialog id="dlg-indice">
  <h2><i class="ti ti-versions"></i> Nouvel indice</h2>
  <label class="mini">Indice (ex : V2, B, 01)</label>
  <input type="text" id="ind-val" maxlength="20">
  <label class="mini">Ce qui change (visible du client)</label>
  <textarea id="ind-chg" rows="2" placeholder="Ex : correction du routage alimentation"></textarea>
  <label class="mini">Date du passage (laisser vide = aujourd'hui, sert a poser un indice retroactivement)</label>
  <input type="date" id="ind-date">
  <div id="ind-msg" style="min-height:18px;margin-top:6px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
    <button class="btn-s" onclick="document.getElementById('dlg-indice').close()">Annuler</button>
    <button class="btn" id="ind-go" onclick="FS.poserIndice()">Poser l'indice</button>
  </div>
</dialog>

<dialog id="dlg-edit">
  <h2 id="edit-titre"><i class="ti ti-pencil"></i> Modifier l'entree</h2>
  <textarea id="edit-texte" rows="4"></textarea>
  <div id="edit-msg" style="min-height:18px;margin-top:6px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
    <button class="btn-s" onclick="document.getElementById('dlg-edit').close()">Annuler</button>
    <button class="btn" id="edit-go">Enregistrer</button>
  </div>
</dialog>

<script>
/* ============================================================== CONFIG ==== */
const APP_NAME = 'FabStory';                  // decision 06/08 : nom unique ici
const APP_VERSION = '0.1';
const APP_DATE = '07/08/2026';
const BASE = 'https://protoprocess.app.n8n.cloud/webhook';
const CLE_QUI = 'pp_fdv_initiales';           // meme cle que les autres applis
const EQUIPE = ['OC','AC','MM','DG','SG','FR','JM','BL','MD','SS','VF','AP'];

document.title = 'Proto Process / ' + APP_NAME + ' \u2014 v' + APP_VERSION;
document.getElementById('hdr-app').textContent = APP_NAME;
document.getElementById('hdr-version').textContent = 'v' + APP_VERSION + ' \u2014 ' + APP_DATE;

/* Metiers mis en avant dans la saisie (les 5 chips) ; le reste sous le depliant */
const METIERS_FAVORIS = ['BOM','APPRO','CMS','TRAD','CTRL_FINAL'];
const STATUTS = [
  { code:'devis',       libelle:'Devis' },
  { code:'preparation', libelle:'Pr\u00e9paration' },
  { code:'fabrication', libelle:'Fabrication' },
  { code:'expediee',    libelle:'Exp\u00e9di\u00e9e' }
];
const TYPES_LIBELLES = {
  note:'Information', question_client:'Question client', reponse_client:'R\u00e9ponse client',
  question_interne:'\u00c0 traiter', reponse_interne:'R\u00e9ponse interne', indice:'Indice'
};
const PORTEES_LIBELLES = { so:'valable pour ce SO', carte:'d\u00e9finitif pour cette carte', client:'r\u00e8gle client' };

/* ================================================================ ETAT ==== */
const FS = {};
let PRODUITS = [];
let P = null;            // produit courant
let FICHE = null;        // derniere lecture fabstory-fiche
let STATUT = null;       // derniere lecture fabstory-statut
let saisie = { type:'note', etape:null, portee:null, repond_a:null };
let editCtx = null;      // { id, action }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(id){ return document.getElementById(id); }
function qui(){ try{ return localStorage.getItem(CLE_QUI)||''; }catch(e){ return ''; } }
function setQui(v){ try{ localStorage.setItem(CLE_QUI,v); }catch(e){} }
function fdate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function fjour(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
async function getJson(url){
  const r = await fetch(url);
  const j = await r.json().catch(()=>null);
  if(!r.ok || !j) throw new Error((j&&j.motif)||('HTTP '+r.status));
  return j;
}
async function postJson(url, corps){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corps)});
  const j = await r.json().catch(()=>null);
  if(!r.ok || !j || j.ok!==true) throw new Error((j&&j.motif)||('HTTP '+r.status));
  return j;
}
function auteurOuStop(){
  let a = qui();
  if(!a){
    a = (prompt('Vos initiales (m\u00e9moris\u00e9es sur cet appareil) :\n' + EQUIPE.join('  ')) || '').trim().toUpperCase();
    if(!a) return null;
    setQui(a);
  }
  return a;
}

/* ======================================================== ECRAN CARTES ==== */
async function chargerCartes(){
  const z = el('ecran-cartes');
  z.innerHTML = '<div class="card"><h2><i class="ti ti-cpu"></i> Quelle carte ?</h2>' +
    '<p class="hint" style="margin:0"><span class="spin"></span> Chargement des cartes\u2026</p></div>';
  try{
    const j = await getJson(BASE + '/produits');
    PRODUITS = (j && j.produits) || [];
    rendreCartes('');
  }catch(e){
    z.innerHTML = '<div class="card"><h2><i class="ti ti-cpu"></i> Quelle carte ?</h2>' +
      '<p class="err-msg" style="margin:0 0 9px">Liste indisponible : ' + esc(e.message) + '</p>' +
      '<button class="btn-s" onclick="chargerCartes()"><i class="ti ti-refresh"></i> R\u00e9essayer</button></div>';
  }
}
function rendreCartes(filtre){
  const z = el('ecran-cartes');
  const f = (filtre||'').trim().toLowerCase();
  const liste = PRODUITS.filter(p => !f ||
    [p.cle_produit,p.ref_carte,p.libelle_carte,p.nom_client,p.code_client]
      .some(v => String(v||'').toLowerCase().includes(f)));
  let html = '<div class="card"><h2><i class="ti ti-cpu"></i> Quelle carte ?</h2>' +
    '<input type="text" id="cherche" placeholder="R\u00e9f\u00e9rence, libell\u00e9 ou client\u2026" value="' + esc(filtre) + '" ' +
    'oninput="rendreCartesDiff(this.value)" style="margin-bottom:11px">';
  if(!liste.length){
    html += '<p class="hint" style="margin:0">Aucune carte ne correspond. Une carte appara\u00eet ici une fois cr\u00e9\u00e9e ' +
      'dans l\u2019analyse de devis ou l\u2019appli fiche de vie.</p>';
  } else {
    html += liste.map(p =>
      '<div class="carte-item" onclick="ouvrirFiche(' + p.id + ')">' +
      '<div><div class="ref">' + esc(p.ref_carte || p.cle_produit) + '</div>' +
      '<div class="lib">' + esc(p.libelle_carte || '') + '</div></div>' +
      '<div class="cli">' + esc(p.nom_client || p.code_client || '') + '</div></div>').join('');
  }
  html += '</div>';
  z.innerHTML = html;
  const c = el('cherche');
  if(f){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
}
let _t = null;
function rendreCartesDiff(v){ clearTimeout(_t); _t = setTimeout(()=>rendreCartes(v), 140); }

/* ========================================================= ECRAN FICHE ==== */
async function ouvrirFiche(id){
  P = PRODUITS.find(p => p.id === id) || { id: id };
  el('ecran-cartes').style.display = 'none';
  const z = el('ecran-fiche');
  z.style.display = '';
  z.innerHTML = '<div class="card"><p class="hint" style="margin:0"><span class="spin"></span> Lecture de la fiche\u2026</p></div>';
  saisie = { type:'note', etape:null, portee:null, repond_a:null };
  STATUT = null;
  try{
    FICHE = await getJson(BASE + '/fabstory-fiche?produit=' + encodeURIComponent(id));
    P = FICHE.produit;
    rendreFiche();
    chargerStatut();       // en parallele, la fiche s'affiche sans attendre Odoo
  }catch(e){
    z.innerHTML = '<div class="card"><p class="err-msg" style="margin:0 0 9px">Fiche indisponible : ' + esc(e.message) + '</p>' +
      '<button class="btn-s" onclick="ouvrirFiche(' + id + ')"><i class="ti ti-refresh"></i> R\u00e9essayer</button> ' +
      '<button class="btn-s" onclick="retourCartes()"><i class="ti ti-arrow-left"></i> Retour</button></div>';
  }
}
function retourCartes(){
  el('ecran-fiche').style.display = 'none';
  el('ecran-cartes').style.display = '';
  P = null; FICHE = null; STATUT = null;
}
async function chargerStatut(){
  if(!P || !P.cle_produit) return;
  try{
    STATUT = await getJson(BASE + '/fabstory-statut?ref=' + encodeURIComponent(P.cle_produit));
  }catch(e){
    STATUT = { erreur: e.message };
  }
  const zone = el('zone-statut');
  if(zone) zone.outerHTML = htmlStatut();
}
async function recharger(){
  if(!P) return;
  try{
    FICHE = await getJson(BASE + '/fabstory-fiche?produit=' + encodeURIComponent(P.id));
    rendreFiche();
  }catch(e){ /* l'ecran courant reste */ }
}

/* ----------------------------------------------------------------- rendu -- */
function htmlStatut(){
  let inner;
  if(!STATUT){
    inner = '<span class="statut-motif"><span class="spin"></span> Interrogation d\u2019Odoo\u2026</span>';
  } else if(STATUT.erreur){
    inner = '<span class="statut-motif">Statut indisponible : ' + esc(STATUT.erreur) + '</span>';
  } else {
    const idx = STATUTS.findIndex(s => s.code === STATUT.statut);
    const jalons = STATUTS.map((s,i) => {
      const cls = i < idx ? 'fait' : (i === idx ? (s.code==='expediee'?'fait':'actif') : '');
      return '<div class="jalon ' + cls + '"><div class="pt"></div><div class="lb">' + s.libelle + '</div></div>';
    }).join('');
    const prog = (STATUT.taches_total > 0)
      ? ' \u2014 ' + STATUT.taches_faites + '/' + STATUT.taches_total + ' \u00e9tapes'
      : '';
    inner =
      '<div style="width:100%"><div class="statut-ligne" style="margin-top:0">' +
      '<span class="statut-nom">' + esc((STATUTS[idx]||{}).libelle || STATUT.statut) + '</span>' +
      (STATUT.so ? '<span class="statut-motif">' + esc(STATUT.so) + prog + '</span>' : '') +
      '</div><div class="jalons">' + jalons + '</div></div>';
  }
  return '<div class="statut-ligne" id="zone-statut">' + inner + '</div>';
}
function htmlIndices(){
  const ind = FICHE.indice_courant;
  const hist = FICHE.indices || [];
  const titre = hist.map(i => 'Indice ' + i.indice + ' depuis le ' + fjour(i.depuis_le)).join('\n');
  return '<span class="badge-indice" title="' + esc(titre || 'Aucun indice pos\u00e9') + '" onclick="FS.ouvrirIndice()">' +
    '<i class="ti ti-versions"></i>' + (ind ? 'Indice ' + esc(ind) : '+ Indice') + '</span>';
}
function chipsEntree(e){
  let h = '<span class="chip ' + esc(e.type) + '">' + esc(TYPES_LIBELLES[e.type] || e.type) + '</span>';
  if(e.portee_validation) h += '<span class="chip portee">' + esc(PORTEES_LIBELLES[e.portee_validation]) + '</span>';
  if(e.modifiee) h += '<span class="chip modif">modifi\u00e9e</span>';
  if(e.visible_client) h += '<i class="ti ti-eye oeil" title="Visible du client"></i>';
  return h;
}
function detEntree(e){
  const morceaux = [];
  if(e.etape_libelle) morceaux.push(e.etape_libelle);
  if(e.repere) morceaux.push('Rep. ' + e.repere);
  if(e.mpn) morceaux.push(e.mpn);
  if(e.so_canonique) morceaux.push(e.so_canonique);
  let h = morceaux.length ? '<div class="tl-det">' + esc(morceaux.join(' \u00b7 ')) + '</div>' : '';
  if(e.lien) h += '<div class="tl-det"><a href="' + esc(e.lien) + '" target="_blank" rel="noopener">' + esc(e.lien) + '</a></div>';
  return h;
}
function actionsEntree(e){
  let h = '<div class="tl-actions">';
  if(e.etat === 'en_attente')
    h += '<button class="btn-lien" onclick="FS.repondre(' + e.id + ')"><i class="ti ti-corner-down-right"></i> R\u00e9pondre</button>';
  h += '<button class="btn-lien" onclick="FS.modifier(' + e.id + ')">Modifier</button>' +
       '<button class="btn-lien" onclick="FS.retirer(' + e.id + ')">Retirer</button></div>';
  return h;
}
function htmlEntree(e){
  return '<div class="tl-entree' + (e.type==='indice'?' indice-evt':'') + '">' +
    '<div class="tl-tete">' + chipsEntree(e) +
    '<span class="tl-meta">' + esc(e.auteur||'?') + ' \u00b7 ' + fdate(e.cree_le) + '</span></div>' +
    '<div class="tl-texte">' + esc(e.texte_brut||'') + '</div>' +
    detEntree(e) + actionsEntree(e) + '</div>';
}
function rendreFiche(){
  const z = el('ecran-fiche');
  const enAttente = FICHE.en_attente || [];
  const entrees = FICHE.entrees || [];
  const attIds = new Set(enAttente.map(a => a.id));
  const fil = entrees.filter(e => !attIds.has(e.id));

  let html =
    '<button class="btn-s" style="margin-bottom:11px" onclick="retourCartes()"><i class="ti ti-arrow-left"></i> Cartes</button>' +
    '<div class="hero"><div class="hero-haut">' +
    '<span class="hero-ref">' + esc(P.ref_carte || P.cle_produit) + '</span>' +
    htmlIndices() +
    '<span class="hero-lib">' + esc(P.libelle_carte || '') + '</span>' +
    '<span class="hero-cli">' + esc(P.nom_client || P.code_client || '') + '</span>' +
    '</div>' + htmlStatut() + '</div>';

  if(enAttente.length){
    html += '<div class="card attente"><h2><i class="ti ti-alert-circle"></i> En attente de r\u00e9ponse (' + enAttente.length + ')</h2>';
    const complets = entrees.filter(e => attIds.has(e.id));
    html += (complets.length ? complets : enAttente).map(htmlEntree).join('');
    html += '</div>';
  }

  html += htmlSaisie();

  html += '<div class="card"><h2><i class="ti ti-timeline"></i> Fil de la carte' +
    (fil.length ? ' <span class="hint" style="font-weight:400">(' + fil.length + ')</span>' : '') + '</h2>';
  html += fil.length ? fil.map(htmlEntree).join('')
    : '<p class="hint" style="margin:0">Rien encore \u2014 la premi\u00e8re note lance l\u2019histoire de cette carte.</p>';
  html += '</div>';

  z.innerHTML = html;
  brancherSaisie();
}

/* ---------------------------------------------------------------- saisie -- */
function htmlSaisie(){
  const etapes = FICHE.etapes || [];
  const favoris = etapes.filter(e => METIERS_FAVORIS.includes(e.code));
  const autres = etapes.filter(e => !METIERS_FAVORIS.includes(e.code));
  const chipsMetier = list => list.map(e =>
    '<button class="pastille metier' + (saisie.etape===e.code?' on':'') + '" data-etape="' + e.code + '">' +
    esc(e.libelle) + '</button>').join('');
  return '' +
  '<div class="card"><h2><i class="ti ti-pencil-plus"></i> Nouvelle note</h2>' +
  '<label class="mini">M\u00e9tier concern\u00e9</label>' +
  '<div class="pastilles" id="metiers-fav">' + chipsMetier(favoris) + '</div>' +
  (autres.length ? '<details class="replis"><summary>Autres m\u00e9tiers</summary>' +
    '<div class="pastilles">' + chipsMetier(autres) + '</div></details>' : '') +
  '<div class="amorces" id="zone-amorces"></div>' +
  '<textarea id="note-texte" placeholder="Qu\u2019y a-t-il \u00e0 noter sur cette carte ?"></textarea>' +
  '<label class="mini">Nature</label>' +
  '<div class="pastilles">' +
    '<button class="pastille p-info' + (saisie.type==='note'?' on':'') + '" data-type="note">Information</button>' +
    '<button class="pastille' + (saisie.type==='question_interne'?' on':'') + '" data-type="question_interne">\u00c0 traiter</button>' +
    '<button class="pastille' + (saisie.type==='question_client'?' on':'') + '" data-type="question_client">Question client</button>' +
  '</div>' +
  '<div id="zone-portee" style="display:none">' +
    '<label class="mini">Cette validation vaudra\u2026</label>' +
    '<div class="pastilles">' +
      '<button class="pastille" data-portee="so">pour ce SO seulement</button>' +
      '<button class="pastille" data-portee="carte">pour la carte, d\u00e9finitivement</button>' +
      '<button class="pastille" data-portee="client">comme r\u00e8gle de ce client</button>' +
    '</div></div>' +
  '<label class="mini" id="lbl-visible" style="display:none"></label>' +
  '<label style="font-size:12.5px;color:var(--text2);display:flex;gap:6px;align-items:center;margin-top:4px" id="ligne-visible">' +
    '<input type="checkbox" id="note-visible"> Visible du client</label>' +
  '<details class="replis"><summary>Rep\u00e8re, composant, lien</summary>' +
    '<div class="grille2">' +
    '<div><label class="mini">Rep\u00e8re</label><input type="text" id="note-repere" placeholder="C12, U3\u2026"></div>' +
    '<div><label class="mini">Composant (MPN)</label><input type="text" id="note-mpn"></div>' +
    '</div>' +
    '<label class="mini">Lien</label><input type="text" id="note-lien" placeholder="https://\u2026">' +
  '</details>' +
  '<div id="note-msg" style="min-height:18px;margin-top:8px"></div>' +
  '<div style="display:flex;gap:8px;align-items:center">' +
  '<button class="btn" id="note-go">Ajouter au fil</button>' +
  '<span class="hint" id="note-repond" style="display:none"></span></div>' +
  '</div>';
}
function brancherSaisie(){
  document.querySelectorAll('.pastille.metier').forEach(b => b.onclick = () => {
    saisie.etape = (saisie.etape === b.dataset.etape) ? null : b.dataset.etape;
    /* re-render CIBLE du bloc metiers + amorces seulement : on ne re-rend jamais
       tout le formulaire (bug historique : le clic metier vidait repere/MPN) */
    document.querySelectorAll('.pastille.metier').forEach(x =>
      x.classList.toggle('on', x.dataset.etape === saisie.etape));
    rendreAmorces();
  });
  document.querySelectorAll('.pastille[data-type]').forEach(b => b.onclick = () => {
    saisie.type = b.dataset.type;
    document.querySelectorAll('.pastille[data-type]').forEach(x =>
      x.classList.toggle('on', x.dataset.type === saisie.type));
    majVisibilite();
  });
  document.querySelectorAll('.pastille[data-portee]').forEach(b => b.onclick = () => {
    saisie.portee = (saisie.portee === b.dataset.portee) ? null : b.dataset.portee;
    document.querySelectorAll('.pastille[data-portee]').forEach(x =>
      x.classList.toggle('on', x.dataset.portee === saisie.portee));
  });
  el('note-go').onclick = envoyerNote;
  rendreAmorces();
  majVisibilite();
}
function majVisibilite(){
  const t = saisie.type;
  el('zone-portee').style.display = (t === 'question_client') ? '' : 'none';
  const ligne = el('ligne-visible'), cb = el('note-visible');
  if(t === 'question_client'){ cb.checked = true; cb.disabled = true; ligne.style.opacity = .6; }
  else if(t === 'question_interne'){ cb.checked = false; cb.disabled = true; ligne.style.opacity = .6; }
  else { cb.disabled = false; ligne.style.opacity = 1; }
}
function rendreAmorces(){
  const z = el('zone-amorces');
  const props = (FICHE.propositions || {})[saisie.etape] || [];
  z.innerHTML = props.map(t =>
    '<button class="amorce">' + esc(t) + '</button>').join('');
  z.querySelectorAll('.amorce').forEach(b => b.onclick = () => {
    const ta = el('note-texte');
    ta.value = ta.value ? ta.value : (b.textContent + ' : ');
    ta.focus();
  });
}
async function envoyerNote(){
  const texte = el('note-texte').value.trim();
  const msg = el('note-msg');
  if(!texte){ msg.innerHTML = '<span class="err-msg">Un texte est n\u00e9cessaire.</span>'; return; }
  const auteur = auteurOuStop();
  if(!auteur) return;
  const corps = {
    produit_id: P.id, type: saisie.type, texte_brut: texte, auteur,
    etape_code: saisie.etape || null,
    repere: el('note-repere').value.trim() || null,
    mpn: el('note-mpn').value.trim() || null,
    lien: el('note-lien').value.trim() || null,
    visible_client: el('note-visible').checked,
    portee_validation: (saisie.type === 'question_client') ? saisie.portee : null,
    repond_a: saisie.repond_a || null,
    source: 'fabstory'
  };
  const btn = el('note-go');
  btn.disabled = true;
  msg.innerHTML = '<span class="spin"></span>';
  try{
    await postJson(BASE + '/fabstory-note', corps);
    saisie.repond_a = null;
    await recharger();
  }catch(e){
    msg.innerHTML = '<span class="err-msg">' + esc(e.message) + '</span>';
    btn.disabled = false;
  }
}

/* ----------------------------------------------------- actions du fil ----- */
FS.repondre = function(id){
  saisie.repond_a = id;
  const e = (FICHE.entrees || []).find(x => x.id === id) || {};
  saisie.type = (e.type === 'question_client') ? 'reponse_client' : 'reponse_interne';
  const zone = el('note-repond');
  zone.style.display = '';
  zone.innerHTML = 'R\u00e9pond \u00e0 l\u2019entr\u00e9e #' + id + ' \u2014 <button class="btn-lien" onclick="FS.annulerReponse()">annuler</button>';
  el('note-texte').focus();
  el('note-texte').scrollIntoView({behavior:'smooth', block:'center'});
};
FS.annulerReponse = function(){
  saisie.repond_a = null; saisie.type = 'note';
  el('note-repond').style.display = 'none';
  document.querySelectorAll('.pastille[data-type]').forEach(x =>
    x.classList.toggle('on', x.dataset.type === 'note'));
  majVisibilite();
};
FS.modifier = function(id){
  const e = (FICHE.entrees || []).find(x => x.id === id);
  if(!e) return;
  editCtx = { id, action:'modifier' };
  el('edit-titre').innerHTML = '<i class="ti ti-pencil"></i> Modifier l\u2019entr\u00e9e #' + id;
  el('edit-texte').value = e.texte_brut || '';
  el('edit-msg').textContent = '';
  el('edit-go').textContent = 'Enregistrer';
  el('edit-go').onclick = envoyerEdition;
  el('dlg-edit').showModal();
};
FS.retirer = function(id){
  editCtx = { id, action:'retirer' };
  el('edit-titre').innerHTML = '<i class="ti ti-trash"></i> Retirer l\u2019entr\u00e9e #' + id;
  el('edit-texte').value = '';
  el('edit-texte').placeholder = 'Motif du retrait (facultatif)';
  el('edit-msg').innerHTML = '<span class="hint">L\u2019entr\u00e9e dispara\u00eet de l\u2019affichage mais reste dans l\u2019historique.</span>';
  el('edit-go').textContent = 'Retirer';
  el('edit-go').onclick = envoyerEdition;
  el('dlg-edit').showModal();
};
async function envoyerEdition(){
  const auteur = auteurOuStop();
  if(!auteur || !editCtx) return;
  const corps = { id: editCtx.id, action: editCtx.action, auteur };
  const v = el('edit-texte').value.trim();
  if(editCtx.action === 'modifier'){
    if(!v){ el('edit-msg').innerHTML = '<span class="err-msg">Le texte ne peut pas \u00eatre vide.</span>'; return; }
    corps.texte_brut = v;
  } else if(v){ corps.motif = v; }
  el('edit-go').disabled = true;
  el('edit-msg').innerHTML = '<span class="spin"></span>';
  try{
    await postJson(BASE + '/fabstory-note-edition', corps);
    el('dlg-edit').close();
    el('edit-go').disabled = false;
    await recharger();
  }catch(e){
    el('edit-msg').innerHTML = '<span class="err-msg">' + esc(e.message) + '</span>';
    el('edit-go').disabled = false;
  }
}

/* ------------------------------------------------------------- indices ---- */
FS.ouvrirIndice = function(){
  el('ind-val').value = ''; el('ind-chg').value = ''; el('ind-date').value = '';
  el('ind-msg').textContent = '';
  el('dlg-indice').showModal();
};
FS.poserIndice = async function(){
  const val = el('ind-val').value.trim();
  const msg = el('ind-msg');
  if(!val){ msg.innerHTML = '<span class="err-msg">Un indice est n\u00e9cessaire.</span>'; return; }
  const auteur = auteurOuStop();
  if(!auteur) return;
  const corps = { produit_id: P.id, indice: val, auteur,
    ce_qui_change: el('ind-chg').value.trim() || null,
    date_evt: el('ind-date').value || null };
  el('ind-go').disabled = true;
  msg.innerHTML = '<span class="spin"></span>';
  try{
    await postJson(BASE + '/fabstory-indice', corps);
    el('dlg-indice').close();
    el('ind-go').disabled = false;
    await recharger();
  }catch(e){
    msg.innerHTML = '<span class="err-msg">' + esc(e.message) + '</span>';
    el('ind-go').disabled = false;
  }
};

/* ================================================================ BOOT ==== */
chargerCartes();
</script>
</body>
</html>
