<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage boîte commerciale</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root {
  --pp-blue: #5BC4D8;
  --bg: #0a0c12;
  --surface: #1a2030;
  --surface2: #161b27;
  --border: #262e42;
  --border2: #333d55;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --accent: #F07B1F;
  --accent-bg: #2a1f10;
  --green: #86c564;  --green-bg: #EAF3DE;  --green-badge: #3B6D11;
  --amber: #eab676;  --amber-bg: #FAEEDA;  --amber-badge: #854F0B;
  --red: #f09595;    --red-bg: #FCEBEB;    --red-badge: #A32D2D;
  --pink: #ED93B1;   --pink-bg: #FBEAF0;   --pink-badge: #993556;
  --radius: 6px;
  --radius-lg: 10px;
  --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }

header {
  background: #0f1117; height: 52px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo-text { display: flex; align-items: center; gap: 0; font-size: 13px; font-weight: 500; }
.logo-text .lt { color: #fff; }
.logo-text .ls { color: #444; margin: 0 3px; }
.logo-text .lo { color: var(--accent); }
.meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text3); font-family: var(--mono); }
.btn-p { padding: 6px 13px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--sans); }
.btn-p:disabled { opacity: .5; cursor: default; }

main { max-width: min(96vw, 1800px); margin: 0 auto; padding: 22px 0 60px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.filter-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text2); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: var(--sans); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
.toolbar .count { margin-left: auto; color: var(--text3); font-size: 12px; }

.group { margin-bottom: 26px; }
.group-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px 4px; font-size: 13px; font-weight: 600; }
.group-title .n { color: var(--text3); font-weight: 400; font-family: var(--mono); font-size: 12px; }
.group.haute .group-title { color: var(--red); }
.group.moyenne .group-title { color: var(--amber); }
.group.basse .group-title { color: var(--green); }

table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--surface2); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.fil { cursor: pointer; }
tr.fil:hover td { background: rgba(255,255,255,.02); }
.group.haute td:first-child { box-shadow: inset 3px 0 0 var(--red-badge); }
.group.moyenne td:first-child { box-shadow: inset 3px 0 0 var(--amber-badge); }
.group.basse td:first-child { box-shadow: inset 3px 0 0 var(--green-badge); }

.col-age { width: 70px; white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--text2); }
.col-age.vieux { color: var(--red); font-weight: 600; }
.col-type { width: 100px; }
.col-client { width: 220px; }
.client { font-weight: 600; }
.client .mail { display: block; color: var(--text3); font-weight: 400; font-size: 11px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
.objet { color: var(--text); margin-bottom: 4px; }
.resume { color: var(--text2); line-height: 1.45; max-width: 78ch; }
.sugg { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--text3); }
.sugg b { color: var(--text2); font-weight: 500; }
.motif { color: var(--text3); font-size: 12px; margin-top: 5px; display: none; }
tr.ouvert .motif { display: block; }
.col-act { width: 40px; text-align: right; }
.col-act a { color: var(--text3); font-size: 18px; text-decoration: none; }
.col-act a:hover { color: var(--accent); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-devis { background: var(--amber-bg); color: var(--amber-badge); }
.badge-commande { background: var(--green-bg); color: var(--green-badge); }
.badge-reclamation { background: var(--red-bg); color: var(--red-badge); }
.badge-relance { background: var(--pink-bg); color: var(--pink-badge); }
.badge-autre { background: var(--border2); color: var(--text); }

/* Ecran de validation des mises a jour */
.maj { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface2); overflow: hidden; }
.maj-sec { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.maj-sec:last-child { border-bottom: none; }
.maj-hd { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.maj-div { background: rgba(240,123,31,.07); border-left: 3px solid var(--amber-badge); }
.maj-div .l { color: var(--amber); font-size: 12px; line-height: 1.6; }
.maj-mail pre { margin: 0; white-space: pre-wrap; font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--text); max-height: 210px; overflow: auto; }
.act { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.act:last-child { border-bottom: none; }
.act input[type=checkbox] { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
.act .corps { flex: 1; min-width: 0; }
.act .t { font-size: 13px; color: var(--text); }
.act .t .sys { color: var(--text3); font-size: 11px; font-family: var(--mono); margin-right: 6px; }
.act .t b { font-family: var(--mono); }
.act .n { color: var(--text3); font-size: 12px; margin-top: 3px; }
.act .fl { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 12px; color: var(--text2); }
.act .fl .av { text-decoration: line-through; color: var(--text3); font-family: var(--mono); }
.act input[type=date] { background: var(--surface); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius); padding: 4px 8px; font-size: 12px; font-family: var(--mono); }
.act input[type=date]:focus { outline: none; border-color: var(--accent); }
.maj-pied { display: flex; align-items: center; gap: 9px; padding: 12px 14px; background: var(--surface); }
.maj-pied .btn-s { padding: 6px 13px; background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; cursor: pointer; font-family: var(--sans); }
.maj-pied .rest { margin-left: auto; color: var(--text3); font-size: 12px; }
.maj-alerte { color: var(--amber); font-size: 12px; padding: 10px 14px; background: rgba(234,182,118,.08); }
.bilan .r { display: flex; gap: 8px; font-size: 13px; padding: 5px 0; align-items: baseline; }
.bilan .r.ok { color: var(--green); }
.bilan .r.ko { color: var(--red); }
.bilan .r .d { color: var(--text3); font-size: 12px; }

/* Menu de classement au survol */
tr.fil { position: relative; }
.menu { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); display: none; gap: 6px; z-index: 3; }
tr.fil:hover .menu { display: flex; }
.menu button { border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); border-radius: 20px; padding: 4px 11px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: var(--sans); white-space: nowrap; }
.menu button:hover { background: var(--accent); color: #fff; border-color: transparent; }
.menu button:disabled { opacity: .5; cursor: default; }
.classe { margin-top: 8px; font-size: 12px; color: var(--green); }
.classe a { color: var(--accent); }
.classe.err { color: var(--red); }

/* Fiche Odoo */
.odoo { margin-top: 8px; background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--pp-blue, #5BC4D8); border-radius: var(--radius); padding: 9px 11px; font-size: 12px; }
.odoo-hd { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.odoo-so { font-family: var(--mono); font-weight: 600; color: var(--text); }
.odoo-l { color: var(--text2); line-height: 1.6; }
.odoo-l + .odoo-l { margin-top: 5px; }
.odoo-k { color: var(--text3); }
.odoo-vide { color: var(--text3); font-style: italic; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 4px; }
.pill-ok { background: var(--green-bg); color: var(--green-badge); }
.pill-att { background: var(--amber-bg); color: var(--amber-badge); }
.pill-non { background: var(--red-bg); color: var(--red-badge); }

/* Zone réponse */
.rep { display: none; padding: 12px 0 2px; }
tr.ouvert + tr.rep-row .rep { display: block; }
tr.rep-row td { padding-top: 0; border-top: none; }
tr.rep-row:not(.visible) { display: none; }
.rep-lab { color: var(--text3); font-size: 12px; margin-bottom: 6px; }
.rep-in { display: flex; gap: 8px; flex-wrap: wrap; }
.rep-in input { flex: 1; min-width: 280px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 7px 10px; font-size: 13px; font-family: var(--sans); }
.rep-in input:focus { outline: none; border-color: var(--accent); }
.rep-out { margin-top: 10px; background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; }
.rep-out .dest { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 8px; }
.rep-out pre { margin: 0; white-space: pre-wrap; font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--text); }
.rep-out .apres { margin-top: 10px; font-size: 12px; color: var(--text2); }
.rep-out .apres a { color: var(--accent); }
.rep-err { margin-top: 10px; color: var(--red); font-size: 13px; }
.avert { margin-top: 8px; font-size: 12px; color: var(--amber); }

.etat { padding: 40px; text-align: center; color: var(--text3); }
.etat.err { color: var(--red); }

@media (max-width: 800px) {
  th.col-type, td.col-type { display: none; }
  .col-client { width: auto; }
  .client .mail { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="../shared/picto-pp.png" alt="Proto Process" width="24" height="24" style="object-fit:contain" onerror="this.style.display='none'">
    <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo">Triage boîte commerciale</span></span>
  </div>
  <div class="meta">
    <span id="maj">—</span>
    <span id="version"></span>
    <button class="btn-p" id="btn-refresh" onclick="charger()"><i class="ti ti-refresh"></i> Actualiser</button>
  </div>
</header>

<main>
  <div class="toolbar" id="filtres">
    <button class="filter-btn active" data-type="tous">Tous</button>
    <button class="filter-btn" data-type="devis">Devis</button>
    <button class="filter-btn" data-type="commande">Commandes</button>
    <button class="filter-btn" data-type="reclamation">Réclamations</button>
    <button class="filter-btn" data-type="relance">Relances</button>
    <button class="filter-btn" data-type="autre">Autres</button>
    <span class="count" id="count"></span>
  </div>
  <div id="contenu"><div class="etat">Chargement…</div></div>
</main>

<script>
const APP_VERSION = "1.6";
const APP_DATE = "03/09/2026";
const API = "https://protoprocess.app.n8n.cloud/webhook/triage-boite";
const API_REP = "https://protoprocess.app.n8n.cloud/webhook/triage-repondre";
const API_CLASSER = "https://protoprocess.app.n8n.cloud/webhook/triage-classer";
const API_MAJ_PREP = "https://protoprocess.app.n8n.cloud/webhook/triage-maj-preparer";
const API_MAJ_APP = "https://protoprocess.app.n8n.cloud/webhook/triage-maj-appliquer";

document.title = `Triage boîte commerciale v${APP_VERSION}`;
document.getElementById('version').textContent = `v${APP_VERSION} — ${APP_DATE}`;

let donnees = [];
let filtre = 'tous';

const LIB_TYPE = { devis: 'Devis', commande: 'Commande', reclamation: 'Réclamation', relance: 'Relance', autre: 'Autre' };
const LIB_URG = { haute: 'À traiter en priorité', moyenne: 'À traiter', basse: 'Peut attendre' };

function echapper(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function parseClient(raw) {
  const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
  if (m) return { nom: m[1].trim() || m[2], mail: m[2] };
  return { nom: String(raw || '').replace(/[<>]/g, '').trim() || '—', mail: '' };
}

function age(j) {
  const n = Number(j);
  if (isNaN(n)) return '—';
  if (n <= 0) return "auj.";
  if (n === 1) return "hier";
  return `${n} j`;
}

function heureLocale(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function jour(d) { return d ? String(d).slice(0, 10).split('-').reverse().join('/') : null; }

function pillEtat(e) {
  const t = String(e || '').toLowerCase();
  if (/livr|payée|payee|terminée|terminee|confirmée|confirmee|prête|prete/.test(t)) return 'pill-ok';
  if (/annul|non pay/.test(t)) return 'pill-non';
  return 'pill-att';
}

function ficheOdoo(ctx) {
  if (!ctx || !Array.isArray(ctx.commandes) || !ctx.commandes.length) return '';
  const blocs = ctx.commandes.map(c => {
    const bls = (ctx.livraisons || []).filter(l => l.origine === c.so);
    const fas = (ctx.factures || []).filter(x => x.origine === c.so);
    const ligneBL = bls.length
      ? bls.map(l => `${echapper(l.bl)}<span class="pill ${pillEtat(l.etat)}">${echapper(l.etat)}</span>${l.date_livree ? ' le ' + jour(l.date_livree) : (l.date_prevue ? ' prévu ' + jour(l.date_prevue) : '')}`).join(' · ')
      : '<span class="odoo-vide">aucune</span>';
    const ligneFA = fas.length
      ? fas.map(x => `${echapper(x.facture)}<span class="pill ${pillEtat(x.paiement || x.etat)}">${echapper(x.paiement || x.etat)}</span>${x.montant != null ? ' · ' + x.montant + ' €' : ''}`).join(' · ')
      : '<span class="odoo-vide">aucune</span>';
    return `<div class="odoo-l"><span class="odoo-so">${echapper(c.so)}</span><span class="pill ${pillEtat(c.etat)}">${echapper(c.etat)}</span>${c.partenaire ? ' · ' + echapper(c.partenaire) : ''}${c.date_engagee ? ' · <span class="odoo-k">engagée</span> ' + jour(c.date_engagee) : ''}${c.montant != null ? ' · ' + c.montant + ' €' : ''}</div>
      <div class="odoo-l"><span class="odoo-k">Livraison</span> ${ligneBL}</div>
      <div class="odoo-l"><span class="odoo-k">Facture</span> ${ligneFA}</div>`;
  }).join('<div style="height:8px"></div>');
  return `<div class="odoo"><div class="odoo-hd"><i class="ti ti-database"></i> Dans Odoo</div>${blocs}</div>`;
}

function rendre() {
  const cont = document.getElementById('contenu');
  const visibles = donnees.filter(f => filtre === 'tous' || f.type === filtre);
  document.getElementById('count').textContent = `${visibles.length} fil${visibles.length > 1 ? 's' : ''} non lu${visibles.length > 1 ? 's' : ''}`;

  if (!visibles.length) {
    cont.innerHTML = '<div class="etat">Rien à trier dans cette catégorie.</div>';
    return;
  }

  const groupes = { haute: [], moyenne: [], basse: [] };
  for (const f of visibles) (groupes[f.urgence] || groupes.moyenne).push(f);

  let html = '';
  for (const urg of ['haute', 'moyenne', 'basse']) {
    const liste = groupes[urg];
    if (!liste.length) continue;
    html += `<section class="group ${urg}">
      <h2 class="group-title">${LIB_URG[urg]} <span class="n">${liste.length}</span></h2>
      <table>
        <thead><tr>
          <th class="col-age">Attente</th>
          <th class="col-client">Client</th>
          <th class="col-type">Type</th>
          <th>Objet et résumé</th>
          <th class="col-act"></th>
        </tr></thead>
        <tbody>`;
    for (const f of liste) {
      const c = parseClient(f.client);
      const j = Number(f.jours_sans_reponse);
      const t = f.type || 'autre';
      const resume = f.resume ? echapper(f.resume) : '<em style="color:var(--text3)">Résumé indisponible</em>';
      const motif = f.motif_urgence ? `<div class="motif"><i class="ti ti-info-circle"></i> ${echapper(f.motif_urgence)}</div>` : '';
      const odoo = ficheOdoo(f.contexte_odoo);
      const sugg = f.intention_suggeree ? `<div class="sugg"><i class="ti ti-bulb"></i> Réponse suggérée : <b>${echapper(f.intention_suggeree)}</b></div>` : '';
      html += `<tr class="fil" onclick="basculer(this)">
        <td class="col-age ${j >= 5 ? 'vieux' : ''}">${age(j)}</td>
        <td class="col-client"><div class="client">${echapper(c.nom)}<span class="mail" title="${echapper(c.mail)}">${echapper(c.mail)}</span></div></td>
        <td class="col-type"><span class="badge badge-${t}">${LIB_TYPE[t] || t}</span></td>
        <td><div class="objet">${echapper(f.objet)}</div><div class="resume">${resume}</div>${odoo}${sugg}${motif}</td>
        <td class="col-act"><div class="menu" onclick="event.stopPropagation()">
          <button onclick="classer(this,'devis')" title="Poser ->Devis et récupérer le mail">Devis</button>
          <button onclick="classer(this,'commande')" title="Poser ->Commande et récupérer le mail">Commande</button>
        </div><a href="https://mail.google.com/mail/u/0/#inbox/${encodeURIComponent(f.thread_id)}" target="_blank" title="Ouvrir dans Gmail" onclick="event.stopPropagation()"><i class="ti ti-external-link"></i></a></td>
      </tr>
      <tr class="rep-row" data-thread="${echapper(f.thread_id)}"><td></td><td colspan="4">
        <div class="rep">
          <div class="rep-lab">Que voulez-vous répondre ? Une phrase suffit — Claude rédige le mail et le dépose en brouillon dans Gmail.</div>
          <div class="rep-in">
            <input type="text" placeholder="ex. demander l'annulation de la référence commandée" value="${echapper(f.intention_suggeree || '')}"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();preparer(this)}">
            <button class="btn-p" onclick="preparer(this.previousElementSibling)"><i class="ti ti-pencil"></i> Préparer le brouillon</button>
            <button class="btn-p" style="background:transparent;color:var(--accent);border:1px solid var(--accent)" onclick="preparerMaj(this.parentElement.querySelector('input'))"><i class="ti ti-refresh-dot"></i> Mail + mise à jour</button>
          </div>
          <div class="zone"></div>
        </div>
      </td></tr>`;
    }
    html += '</tbody></table></section>';
  }
  cont.innerHTML = html;
}

const APPLI = { devis: 'https://protoprocess.github.io/commercial/devis-client/', commande: 'https://protoprocess.github.io/commercial/commande/' };

async function classer(btn, cible) {
  const tr = btn.closest('tr.fil');
  const rep = tr.nextElementSibling;
  const zone = rep.querySelector('.zone');
  const boutons = tr.querySelectorAll('.menu button');
  tr.classList.add('ouvert');
  rep.classList.add('visible');
  boutons.forEach(b => b.disabled = true);
  zone.innerHTML = '<div class="classe">Classement en cours…</div>';
  try {
    const r = await fetch(API_CLASSER, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: rep.dataset.thread, cible })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    telecharger(d.eml_base64url, d.nom_fichier);
    const lib = cible === 'devis' ? '->Devis' : '->Commande';
    zone.innerHTML = `<div class="classe"><i class="ti ti-check"></i> Libellé <b>${lib}</b> posé${d.deja_pose ? ' (il y était déjà)' : ''}. Le mail <b>${echapper(d.nom_fichier)}</b> vient d'être téléchargé — glissez-le dans <a href="${APPLI[cible]}" target="_blank">l'appli ${cible} →</a></div>`;
  } catch (e) {
    zone.innerHTML = `<div class="classe err">Échec du classement (${echapper(e.message)}).</div>`;
  } finally {
    boutons.forEach(b => b.disabled = false);
  }
}

function telecharger(b64url, nom) {
  const b64 = String(b64url || '').replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([buf], { type: 'message/rfc822' }));
  const a = document.createElement('a');
  a.href = url; a.download = nom || 'mail.eml';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// --- Ecran de validation : proposition puis application ---
const PROPOSITIONS = {};

async function preparerMaj(input) {
  const ligne = input.closest('.rep-row');
  const zone = ligne.querySelector('.zone');
  const intention = input.value.trim();
  if (!intention) { zone.innerHTML = '<div class="rep-err">Indiquez d\'abord ce que vous voulez répondre.</div>'; input.focus(); return; }
  const boutons = ligne.querySelectorAll('.btn-p');
  boutons.forEach(b => b.disabled = true);
  zone.innerHTML = '<div class="maj"><div class="maj-sec">Analyse du fil, d\'Odoo et du planning…</div></div>';
  try {
    const r = await fetch(API_MAJ_PREP, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: ligne.dataset.thread, intention })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    PROPOSITIONS[ligne.dataset.thread] = d;
    zone.innerHTML = rendreMaj(d, ligne.dataset.thread);
  } catch (e) {
    zone.innerHTML = `<div class="rep-err">Échec de la préparation (${echapper(e.message)}).</div>`;
  } finally {
    boutons.forEach(b => b.disabled = false);
  }
}

function rendreMaj(d, thread) {
  const acts = d.actions || [];
  let h = '<div class="maj">';

  if (d.passe_en_cours) {
    h += '<div class="maj-alerte"><i class="ti ti-lock"></i> Une passe du planning est en cours : les écritures planning seront refusées. Réessayez dans quelques minutes.</div>';
  }

  h += `<div class="maj-sec maj-mail"><div class="maj-hd">Brouillon proposé</div><pre>${echapper(d.mail || '')}</pre></div>`;

  if ((d.planning_exclu || []).length) {
    h += `<div class="maj-alerte"><i class="ti ti-info-circle"></i> Planning non modifié pour ${echapper(d.planning_exclu.join(', '))} : plusieurs lots sur ce SO, la ligne à modifier est à choisir à la main.</div>`;
  }

  if (acts.length) {
    const cause = d.cause === 'client' ? 'retard côté client' : (d.cause === 'nous' ? 'retard de notre fait' : 'cause indéterminée');
    h += `<div class="maj-sec"><div class="maj-hd">Mises à jour — ${echapper(cause)}${d.justification ? ' · ' + echapper(d.justification) : ''}</div>`;
    acts.forEach((a, i) => {
      h += `<div class="act">
        <input type="checkbox" ${a.cochee ? 'checked' : ''} data-i="${i}">
        <div class="corps">
          <div class="t"><span class="sys">${echapper(a.systeme)}</span><b>${echapper(a.objet)}</b> — ${echapper(a.champ)}</div>
          <div class="fl"><span class="av">${echapper(a.avant || '—')}</span> <i class="ti ti-arrow-right"></i> <input type="date" value="${echapper(a.valeur || '')}" data-i="${i}"></div>
          ${a.note ? `<div class="n">${echapper(a.note)}</div>` : ''}
        </div>
      </div>`;
    });
    h += '</div>';
  } else {
    h += '<div class="maj-sec"><div class="maj-hd">Mises à jour</div><div style="color:var(--text3);font-size:13px">Aucune affaire rattachée à ce fil : seul le brouillon sera créé.</div></div>';
  }

  h += `<div class="maj-pied">
    <button class="btn-p" onclick="appliquerMaj(this,'${echapper(thread)}')"><i class="ti ti-check"></i> Tout appliquer</button>
    <button class="btn-s" onclick="this.closest('.zone').innerHTML=''">Annuler</button>
    <span class="rest">Rien n'est écrit avant ce clic</span>
  </div></div>`;
  return h;
}

async function appliquerMaj(btn, thread) {
  const maj = btn.closest('.maj');
  const zone = btn.closest('.zone');
  const d = PROPOSITIONS[thread];
  if (!d) { zone.innerHTML = '<div class="rep-err">Proposition perdue, relancez la préparation.</div>'; return; }

  const actions = [];
  maj.querySelectorAll('.act').forEach(el => {
    const cb = el.querySelector('input[type=checkbox]');
    if (!cb.checked) return;
    const a = d.actions[parseInt(cb.dataset.i, 10)];
    const date = el.querySelector('input[type=date]').value;
    if (!date) return;
    const jj = date.slice(8,10) + '/' + date.slice(5,7) + '/' + date.slice(0,4);
    actions.push({ ...a, valeur: date, apres: jj });
  });

  btn.disabled = true;
  const pied = maj.querySelector('.maj-pied .rest');
  pied.textContent = 'Application en cours…';
  try {
    const r = await fetch(API_MAJ_APP, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: thread, mail: d.mail, actions: actions.length ? actions : [{ cle: 'aucune', valeur: '0000-00-00' }] })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const b = await r.json();
    zone.innerHTML = rendreBilan(b);
  } catch (e) {
    pied.textContent = '';
    btn.disabled = false;
    zone.insertAdjacentHTML('beforeend', `<div class="rep-err">Échec de l'application (${echapper(e.message)}).</div>`);
  }
}

function rendreBilan(b) {
  let h = '<div class="maj"><div class="maj-sec bilan"><div class="maj-hd">Résultat</div>';
  for (const r of (b.resultats || [])) {
    h += `<div class="r ${r.ok ? 'ok' : 'ko'}"><i class="ti ti-${r.ok ? 'check' : 'x'}"></i>
      <span>${echapper(r.systeme)} ${echapper(r.objet)} — ${echapper(r.champ)} : ${echapper(r.avant || '—')} → ${echapper(r.apres || '—')}
      ${r.ok ? '' : `<span class="d">${echapper(r.detail || '')}</span>`}</span></div>`;
  }
  for (const r of (b.refusees || [])) {
    h += `<div class="r ko"><i class="ti ti-x"></i><span>Refusé — <span class="d">${echapper(r.motif)}</span></span></div>`;
  }
  if (!(b.resultats || []).length && !(b.refusees || []).length) {
    h += '<div class="r"><span style="color:var(--text3)">Aucune écriture demandée.</span></div>';
  }
  h += '</div>';
  h += `<div class="maj-sec"><div class="r ${b.brouillon_cree ? 'ok' : 'ko'}"><i class="ti ti-${b.brouillon_cree ? 'check' : 'x'}"></i>
    <span>${b.brouillon_cree ? 'Brouillon déposé dans le fil' : 'Brouillon non créé'}
    ${b.brouillon_erreur ? `<span class="d">${echapper(b.brouillon_erreur)}</span>` : ''}</span></div>
    ${b.brouillon_cree ? `<div style="margin-top:8px"><a href="${echapper(b.url || '#')}" target="_blank" style="color:var(--accent)">Ouvrir dans Gmail pour relire et envoyer →</a></div>` : ''}
    </div></div>`;
  return h;
}

function basculer(tr) {
  tr.classList.toggle('ouvert');
  const suivant = tr.nextElementSibling;
  if (suivant && suivant.classList.contains('rep-row')) suivant.classList.toggle('visible', tr.classList.contains('ouvert'));
}

async function preparer(input) {
  const ligne = input.closest('.rep-row');
  const zone = ligne.querySelector('.zone');
  const bouton = ligne.querySelector('.btn-p');
  const intention = input.value.trim();
  if (!intention) { zone.innerHTML = '<div class="rep-err">Indiquez d\'abord ce que vous voulez répondre.</div>'; input.focus(); return; }

  bouton.disabled = true;
  zone.innerHTML = '<div class="rep-out"><pre>Rédaction en cours…</pre></div>';
  try {
    const r = await fetch(API_REP, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: ligne.dataset.thread, intention })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const dest = [d.to ? 'À : ' + d.to : '', d.cc ? ' · Cc : ' + d.cc : ''].join('');
    const avert = d.mode_destinataire === 'transfert'
      ? '<div class="avert"><i class="ti ti-alert-triangle"></i> Fil transféré : le destinataire a été déduit du message d\'origine — à vérifier avant envoi.</div>'
      : (d.mode_destinataire === 'inconnu' ? '<div class="avert"><i class="ti ti-alert-triangle"></i> Destinataire non déterminé : à renseigner dans Gmail.</div>' : '');
    zone.innerHTML = `<div class="rep-out">
      <div class="dest">${echapper(dest)}</div>
      <pre>${echapper(d.texte)}</pre>
      ${avert}
      <div class="apres"><i class="ti ti-check"></i> Brouillon déposé dans le fil. <a href="${echapper(d.url)}" target="_blank">Ouvrir dans Gmail pour relire et envoyer →</a></div>
    </div>`;
  } catch (e) {
    zone.innerHTML = `<div class="rep-err">Échec de la préparation (${echapper(e.message)}).</div>`;
  } finally {
    bouton.disabled = false;
  }
}

async function charger() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    donnees = Array.isArray(data.fils) ? data.fils : [];
    const dernier = donnees.reduce((m, f) => f.maj_le > m ? f.maj_le : m, '');
    document.getElementById('maj').textContent = dernier ? `scan ${heureLocale(dernier)}` : 'aucun scan';
    rendre();
  } catch (e) {
    document.getElementById('contenu').innerHTML = `<div class="etat err">Impossible de charger le triage (${echapper(e.message)}). Vérifier que le workflow n8n de lecture est actif.</div>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('filtres').addEventListener('click', e => {
  const b = e.target.closest('.filter-btn');
  if (!b) return;
  document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  filtre = b.dataset.type;
  rendre();
});

charger();
